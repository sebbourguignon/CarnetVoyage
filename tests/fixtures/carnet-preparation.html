<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Préparation du carnet — scénario de test</title>
  <style>
    :root{--font-display:Georgia,serif;--font-body:Arial,sans-serif;--font-mono:monospace;--paper:#f3f1ea;--paper-deep:#e9e6dd;--card:#ddd7c7;--ink:#1a1a18;--ink-soft:#595650;--pietra:#8e8a7c;--lago:#0f4a4e;--lago-mid:#2a7d80;--rosso:#b23a2e;--sole:#9c7a2e;--oliva:#67794f;--rule:rgba(26,26,24,.14);--rule-soft:rgba(26,26,24,.07)}
    *{box-sizing:border-box}body{margin:0;background:#ece8e0;color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:980px;margin:auto;padding:28px}.eyebrow{text-transform:uppercase;color:var(--rosso);font-size:.72rem;font-weight:800;letter-spacing:.08em}.carnet-bouton-generer{padding:12px 18px;border:0;border-radius:10px;background:var(--rosso);color:#fff;font-weight:800}.footer-stack{position:fixed;left:0;right:0;bottom:0;z-index:40}.day-nav-sticky{display:flex;height:46px;background:var(--paper-deep);border-top:2px solid var(--ink)}.day-nav-sticky-link{flex:1;display:flex;align-items:center;min-height:44px;padding:0 16px;color:var(--ink);font:12px monospace}.day-nav-sticky-next{text-align:right;justify-content:flex-end}.tabbar{height:58px;background:var(--paper);border-top:2px solid var(--ink)}
  </style>
  <link rel="stylesheet" href="../../app/carnet-pdf/preparation.css">
</head>
<body>
  <main class="shell"><div id="panel"></div></main>
  <div class="footer-stack"><nav class="day-nav-sticky" id="day-nav-sticky" aria-label="Navigation entre les journées" hidden></nav><nav class="tabbar" aria-label="Navigation principale"></nav></div>
  <script src="../../app/carnet-pdf/modele.js"></script>
  <script src="../../app/carnet-pdf/preparation.js"></script>
  <script>
    var utilisateur="membre-test";
    var photos=Array.from({length:30},function(_,i){
      var couleur=["b64a37","7b8060","557a8a","c28c45"][i%4];
      return {id:"photo-"+(i+1),journee_id:"jour-1",membre_id:utilisateur,storage_path:"photo-"+(i+1),legende:"Souvenir "+(i+1),url:"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23"+couleur+"%27/%3E%3Ctext x=%27200%27 y=%27160%27 text-anchor=%27middle%27 fill=%27white%27 font-size=%2748%27%3E"+(i+1)+"%3C/text%3E%3C/svg%3E"};
    });
    var jours=[
      {uuid:"jour-1",id:"d-1",dow:"Mar",num:"4",mois:"Août",titre:"Modène &amp; la Motor Valley",rail1:"60 km",rail2:"45 min",regarder:[{id:"obs-1",ou:"Façade du Duomo, panneaux de Wiligelmo"},{id:"obs-2",ou:"Porta della Pescheria, flanc nord du Duomo"},{id:"obs-3",ou:"La Ghirlandina"}],lieux:[{id:"lieu-1",nom:"Duomo di Modena"},{id:"lieu-2",nom:"Les panneaux de Wiligelmo"},{id:"lieu-3",nom:"Porta della Pescheria"},{id:"lieu-4",nom:"Ghirlandina"}],options:["<b>Museo Pagani</b>, activité optionnelle"]},
      {uuid:"jour-2",id:"d-2",dow:"Mer",num:"5",mois:"Août",titre:"Journée au bord du lac",rail1:"Sur place",rail2:"",regarder:[],lieux:[]},
      {uuid:"jour-3",id:"d-3",dow:"Jeu",num:"6",mois:"Août",titre:"Route vers les Dolomites",rail1:"185 km",rail2:"3 h",regarder:[],lieux:[]}
    ];
    for(var numero=4;numero<=24;numero++)jours.push({uuid:"jour-"+numero,id:"d-"+numero,dow:"Ven",num:String(numero+3),mois:"Août",titre:"Étape du voyage "+numero,rail1:"",rail2:"",regarder:[],lieux:[]});
    var preparations=[
      {id:"prep-1",journee_id:"jour-1",maj_le:"2026-08-06T18:00:00Z",carnet_story:"Une ancienne proposition à relire avant de devenir notre souvenir.",carnet_story_source:"legacy",carnet_story_validated:false,carnet_terminee:false,afficher_programme_prevu:false,carnet_faits_confirmes:[],carnet_photos_selectionnees:[{photo_id:"photo-1",ordre:0,principale:true,focal_x:.5,focal_y:.5,legende_carnet:"Premier panorama"}]},
      {id:"prep-2",journee_id:"jour-2",maj_le:"2026-08-05T18:00:00Z",carnet_story:"Une journée paisible au bord du lac.",carnet_story_source:"manual",carnet_story_validated:true,carnet_terminee:true,afficher_programme_prevu:false,carnet_faits_confirmes:[],carnet_photos_selectionnees:[]}
    ];
    if(new URLSearchParams(location.search).has("sans-prete"))preparations[1].carnet_terminee=false;
    if(new URLSearchParams(location.search).has("rehydrate"))preparations[0].carnet_faits_confirmes=[
      {source_type:"lieu",source_id:"ancien-duomo",libelle:"Duomo di Modena",ordre:0},
      {source_type:"lieu",source_id:"ancien-wiligelmo",libelle:"Les panneaux de Wiligelmo",ordre:1},
      {source_type:"lieu",source_id:"ancien-pescheria",libelle:"Porta della Pescheria",ordre:2},
      {source_type:"lieu",source_id:"ancien-ghirlandina",libelle:"Ghirlandina",ordre:3}
    ];
    window.APPELS_BDD=[];window.ECHEC_FINALISATION=false;window.LATENCE_BDD=0;
    function requete(table){var action="select",payload=null;
      function executer(){return new Promise(function(resolve){setTimeout(function(){window.APPELS_BDD.push({table:table,action:action,payload:payload});if(table==="carnet_journees"&&(action==="update"||action==="upsert")&&payload&&payload.carnet_terminee&&window.ECHEC_FINALISATION){window.ECHEC_FINALISATION=false;resolve({data:null,error:{message:"Réseau temporairement indisponible"}});return;}resolve({data:{id:"prep-1",carnet_terminee:!!(payload&&payload.carnet_terminee)},error:null});},window.LATENCE_BDD);});}
      var q={upsert:function(v){action="upsert";payload=v;return q;},update:function(v){action="update";payload=v;return q;},select:function(){return q;},single:executer,delete:function(){action="delete";return q;},eq:function(){return q;},insert:function(v){action="insert";payload=v;return executer();},then:function(ok,ko){return executer().then(ok,ko);}};return q;}
    var fauxSupabase={from:requete,functions:{invoke:function(_nom,options){window.DERNIER_PAYLOAD_IA=options.body;return Promise.resolve({data:{texte:"Nous avions découvert Modène sous une lumière douce, en commençant par le Duomo et ses sculptures pleines de détails. Les panneaux de Wiligelmo avaient retenu notre attention et chacun avait cherché les scènes gravées dans la pierre. Cette promenade simple nous avait offert un beau moment en famille, entre curiosité, sourires et impressions partagées. Nous étions repartis heureux d’avoir pris le temps d’observer la ville sans nous presser, avec le sentiment d’en garder un souvenir vraiment personnel."}});}}};
    var controleur=CarnetPreparationEcran.creer({panel:document.getElementById("panel"),supabase:fauxSupabase,voyageId:"voyage-test",utilisateurId:utilisateur,jours:jours,photosParJournee:{"jour-1":photos},textesLegacy:[],preparations:preparations,urlPhoto:function(path){return Promise.resolve(photos.find(function(p){return p.storage_path===path;}).url);},urlMiniature:function(path){return Promise.resolve(photos.find(function(p){return p.storage_path===path;}).url);},creerControleUpload:function(){var b=document.createElement("button");b.className="photos-bouton-ajouter";b.type="button";b.textContent="Ajouter des photos";return b;},observationReperee:function(){return false;},generer:function(){return Promise.resolve({pages:4,poids_mo:.4});}});
    controleur.rendre(document.getElementById("panel"));
  </script>
</body>
</html>
