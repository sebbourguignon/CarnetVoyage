# Deploiement continu depuis GitHub — l'app reste servie telle quelle ;
# le seul assemblage concerne la fonction Node de génération PDF.
#
# Branche main -> production (salo2026.netlify.app), a associer au
# domaine existant lors de la connexion du site.
# Toute autre branche -> deploy preview automatique
# (https://<branche>--<nom-du-site>.netlify.app), qui pointe tout seul
# vers le projet Supabase dev : app/index.html choisit son environnement
# par nom d'hote (HOTE_PRODUCTION), rien a configurer ici pour ca.

[build]
  publish = "app"

[functions]
  directory = "netlify/functions"
  included_files = ["supabase/functions/generer-carnet/BodoniModa_Variable.ts", "supabase/functions/generer-carnet/IBMPlexSans_Variable.ts"]

[functions.generer-carnet]
  background = true
