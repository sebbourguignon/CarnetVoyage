.install-banner-fermer:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* ---------- barre d'onglets ---------- */
.tabbar{
  display:flex;background:var(--paper);
  border-top:2px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar a{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-decoration:none;color:var(--ink-soft);
  padding:10px 2px 9px;
}
.tab-ico{
  display:flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:9px;
  transition:background .15s ease;
}
.tab-ico svg{width:21px;height:21px;display:block}
.tab-lbl{
  font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.02em;text-transform:uppercase;line-height:1.15;
  white-space:nowrap;
}
.tabbar a[aria-current="page"]{color:var(--rosso)}
.tabbar a[aria-current="page"] .tab-ico{background:rgba(178,58,46,.13)}
.tabbar a[aria-current="page"] .tab-lbl{font-weight:600}
.tabbar a:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
/* mode public : deux onglets seulement — Accueil et Agenda. Les trois
   autres liens disparaissent ; flex:1 1 0 sur .tabbar a rééquilibre
   seul la largeur des deux restants, aucune règle de mise en page
   supplémentaire nécessaire. */
body.mode-public .tabbar a[data-tab="chasse"],
body.mode-public .tabbar a[data-tab="carnet"],
body.mode-public .tabbar a[data-tab="reserver"],
body.mode-public .tabbar a[data-tab="urgences"]{display:none}
/* onglet Admin : réservé aux comptes membres_famille.role="admin" du
   voyage, ajouté par demarrerCarnet() via body.classList.toggle("est-admin",…) */
.tabbar a[data-tab="admin"]{display:none}
body.est-admin .tabbar a[data-tab="admin"]{display:flex}

/* ---------- colophon : mention finale, esprit marque d'imprimeur ---------
   Un seul exemplaire dans la page, placé après tous les <section class="panel">
   et avant .footer-stack. Comme un seul panel est visible à la fois (les
   autres portent [hidden]), ce colophon unique apparaît naturellement en bas
   du panel actif, quel que soit l'onglet — pas besoin de le dupliquer dans
   chaque panel ni d'y toucher depuis les fonctions de rendu JS. Visible en
   mode public comme en mode famille.
   padding-bas : dégage seulement la barre d'onglets elle-même (~63px), pas
   var(--tabbar-clear) — ce jeton inclut la nav séquentielle (46px de plus)
   qui n'existe que dans la vue détail, jamais derrière le colophon. Reprendre
   var(--tabbar-clear) ici créait un vide visible d'une soixantaine de pixels
   entre le texte et la barre, même une fois scrollé tout en bas. */
.colophon{
  max-width:960px;margin:0 auto;text-align:center;
  padding:8px 22px calc(70px + var(--install-banner-h, 0px) + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);
}
.colophon-marque{
  display:inline-block;vertical-align:baseline;
  width:18px;height:18px;margin:0 6px 0 0;color:var(--pietra);
}
.colophon-marque svg{display:block;width:100%;height:100%}
.colophon-texte{
  margin:0;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--pietra);
}
/* copie posée en pied de la vue détail (voir ouvrirDetail) : ce
   colophon-ci vit dans le flux normal de .detail-inner, qui réserve déjà
   sa propre marge basse (tabbar + nav séquentielle, voir --tabbar-clear
   ci-dessus) — pas besoin de la redemander en double ici. */
body:has(.detail.open) > .colophon{border-top:0}
.colophon-detail{padding-bottom:8px;margin-top:22px;border-top:1px solid var(--rule)}
.colophon-pt{margin:0 6px}
.colophon-saut{display:none}
@media(max-width:480px){
  .colophon-texte{line-height:1.9}
  .colophon-pt{display:none}
  .colophon-saut{display:block}
}

@media(max-width:680px){
  .day{grid-template-columns:1fr;gap:14px;padding:4px 0 30px}
  .thread li{grid-template-columns:52px 1fr;gap:10px}
  .filters{position:static}
}

/* ---------- easter eggs (non annoncés — voir script) ---------- */
/* mode éclipse : couche superposée à toute l'app, jamais aux variables de
   couleur — voir declencherEclipseCachee(). Écartée du clic (pointer-events
   none) pour que l'appli reste utilisable pendant l'effet. */
.eclipse-cachee-overlay{
  position:fixed;inset:0;z-index:35;pointer-events:none;
  backdrop-filter:brightness(1) saturate(1);
  -webkit-backdrop-filter:brightness(1) saturate(1);
}

/* chihuahua caché : silhouette qui traverse le bas de l'écran, au-dessus de
   .footer-stack (barre d'onglets + nav séquentielle) — z-index supérieur,
   décalage vertical calculé en JS sur la hauteur réelle de .footer-stack
   (voir declencherChihuahuaCache) puisqu'elle varie selon le contexte
   (nav séquentielle visible ou non, bannière d'installation). */
.chihuahua-cache{
  position:fixed;left:0;bottom:64px;
  z-index:22;width:130px;height:61px;pointer-events:none;
}
.chihuahua-cache svg{display:block;width:100%;height:100%}

/* côte de baleine cachée : suspendue en haut de l'écran, centrée — voir
   declencherCoteDeBaleine(). Comme .eclipse-cachee-overlay, écartée du
   clic pour ne jamais gêner le reste de l'interface pendant l'effet. */
.baleine-cachee{
  position:fixed;left:50%;top:0;margin-left:-30px;
  z-index:22;width:60px;height:100px;pointer-events:none;
  transform:translateY(-120%);transform-origin:top center;
}
.baleine-cachee svg{display:block;width:100%;height:100%}

<!-- SDK Supabase (UMD, CDN, aucun bundler) : voir chargement des données
     plus bas, juste avant demarrerCarnet(). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="illustrations.js"></script>
<script src="carnet-pdf/highlight-registry.js"></script>
<script src="carnet-pdf/modele.js"></script>
<script src="carnet-pdf/preparation.js"></script>
<script src="carnet-pdf/adaptateur.js"></script>
<script src="carnet-pdf/client.js"></script>
<script>
  /* Diagnostic de version visible depuis la console du navigateur. La
     valeur de référence est le commit qui contient la correction UI ; les
     builds suivants restent explicitement des descendants de cette base. */
  window.__carnetBuild = {sha:"__CARNET_COMMIT_REF__",branch:"__CARNET_BRANCH__",buildTime:"__CARNET_BUILD_TIME__"};
/* ==========================================================================
   MOTEUR DE RENDU — généricisé depuis Italie2026/index.html.
   Le contenu (JOURS/BADGES/CARNET) ne vient plus d'un fichier donnees.js
   statique mais de Supabase, chargé de façon asynchrone par
   chargerEtDemarrer() tout en bas de ce fichier. demarrerCarnet() reprend
   tel quel le corps de l'ancienne IIFE, en recevant JOURS/BADGES/CARNET
   en paramètres plutôt qu'en globales.
   ========================================================================== */
function demarrerCarnet(JOURS, BADGES, CARNET, slugVoyage, supabaseClient, sessionFamille, URGENCES, voyageId, utilisateurId, progressionInitiale, estAdmin, photosInitiales, textesCarnetInitiaux, preparationsCarnetInitiales, supabaseUrl){
  "use strict";

  /* --- constantes de filtres : propriété du moteur de rendu, pas du
     contenu d'un voyage (mêmes libellés quel que soit le voyage), donc
     définies ici plutôt qu'en base — contrairement à JOURS/BADGES/CARNET/
     URGENCES qui varient par voyage. Reprises telles quelles de l'ancien
     donnees.js (Italie2026), qui les définissait à tort au même niveau que
     le contenu alors qu'elles n'en dépendent pas. */
  var FILTRES = [
    { cle: "all",        libelle: "Tout" },
    { cle: "ville",      libelle: "Villes & monuments" },
    { cle: "nature",     libelle: "Nature & paysages" },
    { cle: "lac",        libelle: "Lac & repos" },
    { cle: "route",      libelle: "Route" },
    { cle: "star",       libelle: "Temps forts" }
  ];
  var FILTRES_CHASSE = [
    { cle: "all",       libelle: "Tout" },
    { cle: "atrouver",  libelle: "À trouver" },
    { cle: "niveau3",   libelle: "Niveau 3" }
  ];

  /* --- accès famille : vraie authentification Supabase Auth, pas un
     mot de passe local ---------------------------------------------------
     Le contenu marqué visibilite="famille" (journées, observations,
     quiz_questions) est filtré par les policies RLS côté Supabase : une
     personne non connectée, ou connectée mais absente de la table
     membres_famille pour ce voyage, ne reçoit tout simplement pas ces
     lignes dans la réponse — ce n'est donc pas ce fichier qui décide quoi
     cacher. `sessionFamille` (passé par chargerEtDemarrer, calculé via
     supabaseClient.auth.getSession()) ne sert qu'à piloter l'affichage :
     bascule des deux onglets famille (quiz, chasse) et de l'icône du
     verrou. supabase-js conserve la session dans son propre localStorage
     (mécanisme du SDK, indépendant de STOCKAGE_ACCES_FAMILLE de l'ancienne
     version) : un rechargement de page la retrouve sans nouvelle saisie. */
  var modeFamille = !!sessionFamille;
  document.body.classList.toggle("mode-public", !modeFamille);
  document.body.classList.toggle("est-admin", !!estAdmin);

  /* --- fréquentation famille : une ligne "visite" par chargement, pour
     un membre famille connecté seulement (jamais un visiteur public,
     qui n'a pas d'utilisateurId). Mesure best-effort, même philosophie
     que la progression de quiz plus haut : pas de garantie de dernière
     écriture si l'onglet est tué sans repasser en arrière-plan, terrain
     oblige — on ne complexifie pas pour ce cas rare. Consultée depuis
     l'onglet Admin, voir construireBlocFrequentation. */
  var enregistrerOngletVisite = function(){};
  if(utilisateurId){
    (function(){
      var idVisite = null;
      var debut = Date.now();
      var onglets = [{ onglet: "aujourdhui", le: new Date().toISOString() }];
      supabaseClient.from("visites")
        .insert({ voyage_id: voyageId, utilisateur_id: utilisateurId, onglets_vus: onglets })
        .select("id").single()
        .then(function(res){ if(!res.error && res.data) idVisite = res.data.id; });

      function coeur(){
        if(!idVisite) return;
        supabaseClient.from("visites").update({
          derniere_activite_le: new Date().toISOString(),
          duree_secondes: Math.round((Date.now() - debut) / 1000),
          onglets_vus: onglets
        }).eq("id", idVisite).then(function(){});
      }
      setInterval(function(){ if(document.visibilityState === "visible") coeur(); }, 25000);
      document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") coeur(); });
      window.addEventListener("pagehide", coeur);

      enregistrerOngletVisite = function(nom){
        onglets.push({ onglet: nom, le: new Date().toISOString() });
      };
    })();
  }

  /* --- {{chien}} → pastille -------------------------------------------- */
  var PASTILLE_CHIEN = '<span class="dog">Chien ok</span>';
  function fmt(s){
    return String(s == null ? "" : s).split("{{chien}}").join(PASTILLE_CHIEN);
  }
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(html != null) n.innerHTML = fmt(html);
    return n;
  }
  function sansHtml(s){ return String(s == null ? "" : s).replace(/<[^>]+>/g, ""); }
  function texteJour(j){ return sansHtml(j.titre); }
  function idCourt(j){ return j.id.slice(2); } /* "d-0806" -> "0806" */

  /* --- titre de page dynamique : construit à chaque changement de vue,
     uniquement à partir de CARNET et des champs de la journée affichée —
     jamais de libellé nouveau. Le nom d'onglet est lu dans la barre elle-
     même (.tab-lbl) plutôt que redupliqué en dur, pour rester la même
     chaîne que ce que l'utilisateur voit déjà. */
  function titreCarnet(){
    return (sansHtml(CARNET.titre) + " " + sansHtml(CARNET.titreSuite)).trim();
  }
  function libelleOnglet(nom){
    var lien = tabbar.querySelector('a[data-tab="' + nom + '"] .tab-lbl');
    return lien ? lien.textContent : "";
  }
  function titrerOnglet(nom){
    document.title = libelleOnglet(nom) + " · " + titreCarnet();
  }
  function titrerJour(j){
    document.title = j.dow + " " + j.num + " " + j.mois + " — " + texteJour(j) + " · " + titreCarnet();
  }

  /* --- pictogrammes : même facture que la barre d'onglets (trait 1,6 px,
     viewBox 24, stroke="currentColor", extrémités arrondies) — du SVG
     inline, aucune bibliothèque, aucun émoji. Décoratifs : le libellé
     accolé porte déjà le sens, d'où aria-hidden sur chaque icône. --- */
  function icone(interieur){
    return '<svg class="iico" viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
           'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ' +
           'aria-hidden="true">' + interieur + '</svg>';
  }
  var ICONES = {
    parking:  icone('<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.5 16V8h3.2a2.4 2.4 0 0 1 0 4.8H9.5"/>'),
    ztl:      icone('<circle cx="12" cy="12" r="8.5"/><path d="M7.5 12h9"/>'),
    reserver: icone('<path d="M6.5 4h11v16l-5.5-4-5.5 4Z"/>'),
    emporter: icone('<path d="M8.5 8V6.2a3.5 3.5 0 0 1 7 0V8"/><rect x="4.5" y="8" width="15" height="12" rx="2.4"/>'),
    chien:    icone('<path d="M7 9c-1.5-1.5-3-1-3 .8 0 1.6 1.3 2.6 2.6 3M17 9c1.5-1.5 3-1 3 .8 0 1.6-1.3 2.6-2.6 3"/>' +
                    '<circle cx="12" cy="13" r="6"/>' +
                    '<circle cx="9.6" cy="12.3" r=".5" fill="currentColor" stroke="none"/>' +
                    '<circle cx="14.4" cy="12.3" r=".5" fill="currentColor" stroke="none"/>' +
                    '<path d="M10.3 15.6q1.7 1.1 3.4 0"/>'),
    fil:      icone('<line x1="6" y1="5" x2="6" y2="19"/>' +
                    '<circle cx="6" cy="6.5" r="1.3" fill="currentColor" stroke="none"/>' +
                    '<circle cx="6" cy="12" r="1.3" fill="currentColor" stroke="none"/>' +
                    '<circle cx="6" cy="17.5" r="1.3" fill="currentColor" stroke="none"/>' +
                    '<line x1="10" y1="6.5" x2="19" y2="6.5"/><line x1="10" y1="12" x2="17" y2="12"/><line x1="10" y1="17.5" x2="18" y2="17.5"/>'),
    options:  icone('<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>'),
    quiz:     icone('<circle cx="12" cy="12" r="8.5"/><path d="M9.3 9.2a2.9 2.9 0 1 1 4.1 2.6c-1 .5-1.2 .9-1.2 1.9"/><circle cx="12" cy="16.9" r="1" fill="currentColor" stroke="none"/>'),
    regarder: icone('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/>'),
    attention: icone('<path d="M12 3.5 21 19.5H3Z" stroke-linejoin="round"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/>'),

     de currentColor, donc l'état obtenu/verrouillé (voir .chasse-badge

  function iconeBadgeTrait(interieur){

  function iconeBadgePrimitive(nom, viewBox, cx, cy, s){

    return '<svg class="badge-ico" viewBox="' + viewBox + '" width="20" height="20" aria-hidden="true">' +

  var ICONES_BADGE = {

          carres += '<rect x="' + (x0 + c * (w + gap)).toFixed(2) + '" y="' + (y0 + r * (h + gap)).toFixed(2) +

  /* --- chasse au trésor : chaque entrée de `regarder` devient cochable,
     état conservé en localStorage (aucun serveur, aucune dépendance).
     Identifiant stable d'une entrée = "<id du jour>-r<index>", dérivé de
     sa position dans donnees.js plutôt que stocké dans les données :
     insérer ou retirer une entrée au milieu d'un jour décale les index
     suivants et réinitialise leur coche, mais c'est la seule règle assez
     simple pour rester fiable sans champ id à maintenir à la main. ---- */
  var ENTREES_REGARDER = [];
  var ENTREES_REGARDER_PAR_ID = {};
  var ID_PAR_JOUR_OU = {};
  JOURS.forEach(function(j){
    (j.regarder || []).forEach(function(r, i){
      var entree = { id: j.id + "-r" + i, jourId: j.id, entree: r };
      ENTREES_REGARDER.push(entree);
      ENTREES_REGARDER_PAR_ID[entree.id] = entree;
      ID_PAR_JOUR_OU[j.id + "||" + r.ou] = entree.id;
    });
  });
  /* résout une condition de badge { jour, ou } vers l'id interne d'une
     entrée regarder — voir le schéma de BADGES dans donnees.js. */
  function idPourCondition(cond){ return ID_PAR_JOUR_OU[cond.jour + "||" + cond.ou]; }

  var STOCKAGE_REGARDER = slugVoyage + "-carnet-regarder-v1";
  function chargerEtatRegarderLocal(){
    try{
      var brut = window.localStorage.getItem(STOCKAGE_REGARDER);
      return brut ? JSON.parse(brut) : {};
    }catch(e){ return {}; }
  }
  /* fusion locale/serveur par simple union : une entrée cochée sur un
     appareil (local ou déjà envoyée à Supabase) le reste partout, jamais
     de décochage à la fusion — même logique que fusionnerProgressionQuiz,
     en plus simple puisqu'il n'y a pas de correction à distance ici. */
  function fusionnerProgressionRegarder(local, progression){
    var etat = Object.assign({}, local || {});
    var distant = (progression && progression.observations_cochees) || {};
    Object.keys(distant).forEach(function(id){ if(distant[id]) etat[id] = true; });
    return etat;
  }
  var etatRegarder = fusionnerProgressionRegarder(chargerEtatRegarderLocal(), progressionInitiale);
  function sauvegarderEtatRegarder(){
    try{ window.localStorage.setItem(STOCKAGE_REGARDER, JSON.stringify(etatRegarder)); }catch(e){}
  }
  /* pousse l'ensemble des cases cochées vers Supabase — même volume et
     même stratégie best-effort que corrigerReponseQuiz : hors
     connexion, le localStorage a déjà fait foi, et le prochain clic en
     ligne retentera. Nécessaire pour que le classement (voir plus bas)
     puisse lire la progression des autres membres de la famille. */
  function synchroniserObservations(){
    if(!modeFamille || !utilisateurId || !voyageId) return;
    var cocheesReseau = {};
    Object.keys(etatRegarder).forEach(function(id){ if(etatRegarder[id]) cocheesReseau[id] = true; });
    supabaseClient.from("progression").upsert({
      voyage_id: voyageId,
      utilisateur_id: utilisateurId,
      observations_cochees: cocheesReseau,
      maj_le: new Date().toISOString()
    }, { onConflict: "voyage_id,utilisateur_id" }).then(function(res){
      if(res.error){ console.error("Échec de synchronisation de la chasse :", res.error); return; }
      rafraichirClassement();
    });
  }
  /* pondération : niveau 1 (visible sans chercher) à 3 (il faut vraiment
     le chercher) → 1, 3 ou 5 points. niveau absent des données = 1. Les
     valeurs de niveau elles-mêmes ne sont pas renseignées ici — voir le
     schéma en tête de donnees.js. */
  var POINTS_PAR_NIVEAU = { 1: 1, 2: 3, 3: 5 };
  function niveauEntree(id){
    var e = ENTREES_REGARDER_PAR_ID[id];
    return e ? (e.entree.niveau || 1) : 1;
  }
  function pointsEntree(id){ return POINTS_PAR_NIVEAU[niveauEntree(id)] || 1; }
  function scoreTotal(){
    return ENTREES_REGARDER.reduce(function(acc, e){ return acc + (estCoche(e.id) ? pointsEntree(e.id) : 0); }, 0);
  }
  function scoreMaximum(){
    return ENTREES_REGARDER.reduce(function(acc, e){ return acc + pointsEntree(e.id); }, 0);
  }

  /* --- quiz : réponses envoyées à Supabase (table progression), corrigées
     à distance depuis admin/ (pas d'écran de correction ici, voir README
     « Quiz et correction à distance »). ---------------------------------
     etatQuiz reste la source pour le rendu, comme dans Italie2026, mais
     ses clés sont maintenant l'id de question (uuid), et son contenu est
     la fusion entre le cache local (réponses, y compris posées hors
     connexion) et progressionInitiale (chargé depuis Supabase au démarrage,
     seule source de la correction : quiz_resultats + quiz_corrige). */
  var STOCKAGE_QUIZ = slugVoyage + "-carnet-quiz-v1";
  function chargerEtatQuizLocal(){
    try{
      var brut = window.localStorage.getItem(STOCKAGE_QUIZ);
      return brut ? JSON.parse(brut) : {};
    }catch(e){ return {}; }
  }
  function fusionnerProgressionQuiz(local, progression){
    var etat = local || {};
    if(progression){
      var reponses = progression.quiz_etat || {};
      var resultats = progression.quiz_resultats || {};
      Object.keys(reponses).forEach(function(qid){
        etat[qid] = etat[qid] || {};
        etat[qid].reponse = reponses[qid].reponse;
      });
      Object.keys(resultats).forEach(function(qid){
        etat[qid] = etat[qid] || {};
        etat[qid].corrige = true;
        etat[qid].indexCorrect = resultats[qid];
        etat[qid].correcte = (etat[qid].reponse === resultats[qid]);
      });
    }
    return etat;
  }
  var etatQuiz = fusionnerProgressionQuiz(chargerEtatQuizLocal(), progressionInitiale);
  function sauvegarderEtatQuiz(){
    try{ window.localStorage.setItem(STOCKAGE_QUIZ, JSON.stringify(etatQuiz)); }catch(e){}
  }
  /* auto-correction : chacun ayant désormais un vrai compte, plus besoin
     qu'un adulte prenne le téléphone de chacun pour valider après coup
     (voir CLAUDE.md/l'ancien onglet Admin) — repondre_quiz (fonction
     security definer, migration 0013) compare la réponse à la bonne
     réponse (quiz_reponses, jamais exposée au client) et met à jour
     progression (quiz_etat, quiz_resultats, quiz_score, quiz_corrige) en
     une seule opération côté serveur, puis renvoie l'index correct pour
     un affichage immédiat. Best-effort : hors connexion, l'appel échoue
     silencieusement, la réponse reste "en attente" localement et sera
     retentée au prochain chargement en ligne (voir la relance juste après
     migrerDepuisItalie2026 plus haut). */
  function corrigerReponseQuiz(id){
    if(!modeFamille || !utilisateurId || !voyageId) return Promise.resolve();
    var e = etatQuiz[id];
    if(!e || e.reponse == null || e.corrige) return Promise.resolve();
    return supabaseClient.rpc("repondre_quiz", { cible_question_id: id, cible_reponse: e.reponse }).then(function(res){
      if(res.error){ console.error("Échec de correction du quiz :", res.error); return; }
      etatQuiz[id] = { reponse: e.reponse, corrige: true, indexCorrect: res.data, correcte: (e.reponse === res.data) };
      sauvegarderEtatQuiz();
      rafraichirQuiz();
      /* le score du membre connecté vient de changer côté serveur
         (repondre_quiz écrit progression.quiz_score) : le podium doit le
         refléter sans attendre un rechargement complet de page — voir
         remplirClassement/rafraichirClassement. */
      rafraichirClassement();
    });
  }
  /* sélectionner un choix ne corrige pas tout de suite, et la réponse
     reste modifiable tant qu'elle n'est pas corrigée : on laisse le
     temps de répondre aux trois questions, de changer d'avis (reclic
     sur un autre choix), avant de valider explicitement — voir
     remplirBlocQuiz (bouton .quiz-valider, un seul pour la journée) et
     validerReponsesJour ci-dessous. */
  function choisirReponseQuiz(id, choixIndex){
    if(etatQuiz[id] && etatQuiz[id].corrige) return;
    etatQuiz[id] = { reponse: choixIndex, corrige: false };
    sauvegarderEtatQuiz();
    rafraichirQuiz();
  }
  /* valide et corrige d'un coup toutes les questions déjà répondues mais
     pas encore corrigées de la journée, sans retour possible ensuite :
     repondre_quiz (RPC) écrit chaque résultat en base à cet instant
     précis. Celles restées sans réponse ne sont pas concernées. */
  function validerReponsesJour(j){
    (j.quiz || []).forEach(function(q){
      var e = etatQuiz[q.id];
      if(e && e.reponse != null && !e.corrige) corrigerReponseQuiz(q.id);
    });
  }

  function estCoche(id){ return !!etatRegarder[id]; }
  function basculerCoche(id){
    etatRegarder[id] = !etatRegarder[id];
    sauvegarderEtatRegarder();
    synchroniserObservations();
    rafraichirRegarder();
  }

  /* --- migration ponctuelle depuis les sauvegardes locales d'Italie2026 --
     Même domaine (salo2026.netlify.app) : les clés localStorage
     "carnet-regarder-v1" et "carnet-quiz-v1" de l'ancien carnet autonome
     restent présentes dans le navigateur après le passage à CarnetVoyage.
     La chasse au trésor partage déjà exactement le même schéma d'id
     ("<ancre>-r<index>", voir ENTREES_REGARDER ci-dessus) : fusion
     directe. Le quiz, lui, indexait par "<ancre>-q<index>" côté
     Italie2026 contre l'uuid de la question ici — l'index de q dans
     j.quiz (préservé par la resynchronisation de contenu, voir
     outils/mettre-a-jour-voyage.js) sert de pont entre les deux.
     Ne s'exécute qu'une fois connecté (personne à qui rattacher la
     progression avant), ne complète que les trous (jamais n'écrase une
     réponse ou une coche déjà présente côté CarnetVoyage), et se marque
     faite pour ne jamais rejouer sur cet appareil. */
  var STOCKAGE_MIGRATION_ITALIE2026 = slugVoyage + "-carnet-migration-italie2026-v1";
  function migrerDepuisItalie2026(){
    if(!modeFamille || !utilisateurId) return;
    try{
      if(window.localStorage.getItem(STOCKAGE_MIGRATION_ITALIE2026) === "1") return;
    }catch(e){ return; }

    var brutRegarder, brutQuiz;
    try{
      brutRegarder = window.localStorage.getItem("carnet-regarder-v1");
      brutQuiz = window.localStorage.getItem("carnet-quiz-v1");
    }catch(e){ return; }

    var aMigre = false;

    if(brutRegarder){
      var legacyRegarder;
      try{ legacyRegarder = JSON.parse(brutRegarder); }catch(e){ legacyRegarder = null; }
      if(legacyRegarder){
        Object.keys(legacyRegarder).forEach(function(id){
          if(legacyRegarder[id] && !etatRegarder[id]){ etatRegarder[id] = true; aMigre = true; }
        });
      }
    }

    if(brutQuiz){
      var legacyQuiz;
      try{ legacyQuiz = JSON.parse(brutQuiz); }catch(e){ legacyQuiz = null; }
      if(legacyQuiz){
        JOURS.forEach(function(j){
          (j.quiz || []).forEach(function(q, i){
            var e = legacyQuiz[j.id + "-q" + i];
            if(e && e.reponse != null && !etatQuiz[q.id]){
              etatQuiz[q.id] = { reponse: e.reponse, corrige: false };
              aMigre = true;
            }
          });
        });
      }
    }

    if(aMigre){
      sauvegarderEtatRegarder();
      sauvegarderEtatQuiz();
      synchroniserObservations();
      Object.keys(etatQuiz).forEach(function(id){ corrigerReponseQuiz(id); });
    }
    try{ window.localStorage.setItem(STOCKAGE_MIGRATION_ITALIE2026, "1"); }catch(e){}
  }
  migrerDepuisItalie2026();
  /* réponses répondues mais jamais corrigées (posées hors connexion lors
     d'une visite précédente) : on retente à chaque démarrage en ligne,
     même logique de rattrapage que la migration ci-dessus. */
  Object.keys(etatQuiz).forEach(function(id){
    if(etatQuiz[id] && etatQuiz[id].reponse != null && !etatQuiz[id].corrige) corrigerReponseQuiz(id);
  });

  /* un même jour peut être affiché deux fois à la fois (onglet Aujourd'hui
     et vue détail) : on resynchronise tous les rendus visibles plutôt que
     de reconstruire quoi que ce soit. */
  function majProgressionRegarder(wrap, j){
    var total = (j.regarder || []).length;
    var coches = 0;
    (j.regarder || []).forEach(function(r, i){ if(estCoche(j.id + "-r" + i)) coches++; });
    var barre = wrap.querySelector(".regarder-progress-bar");
    var label = wrap.querySelector(".regarder-progress-label");
    if(barre) barre.style.transform = "scaleX(" + (total ? coches / total : 0) + ")";
    if(label) label.textContent = coches + (total === 1 ? " / 1 objectif repéré" : " / " + total + " objectifs repérés");
  }
  function rafraichirRegarder(){
    Array.prototype.forEach.call(document.querySelectorAll(".regarder-item"), function(item){
      var id = item.getAttribute("data-regarder-id");
      var coche = estCoche(id);
      item.classList.toggle("checked", coche);
      var input = item.querySelector(".regarder-checkbox");
      if(input) input.checked = coche;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".regarder[data-jour-regarder]"), function(wrap){
      var j = trouverJour(wrap.getAttribute("data-jour-regarder"));
      if(j) majProgressionRegarder(wrap, j);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".chasse-jour[data-jour-chasse]"), function(wrap){
      var j = trouverJour(wrap.getAttribute("data-jour-chasse"));
      if(j) majEnteteChasseJour(wrap, j);
    });
    majBlocAujourdhuiChasse();
    majBlocChasseTab();
    majResumeChasseAccueil();
    appliquerVisibiliteChasse();
  }

  /* --- photos famille : ajout, compression cote client, galerie par jour
     (voir supabase/migrations/0018). Granularite par journee (pas par
     lieu) : une photo se rattache a j.uuid, l'uuid reel de la ligne
     journees, distinct de j.id (l'ancre texte utilisee partout ailleurs
     dans ce fichier comme identifiant d'affichage). Visibilite "perso"
     par defaut, "partagee" seulement si l'auteur le choisit explicitement
     -- jamais par defaut, pour ne jamais forcer un partage non consenti
     dans le futur carnet familial genere en PDF. Reserve aux comptes
     famille : RLS (migration 0018) refuserait de toute facon l'ecriture
     a un visiteur non connecte. -------------------------------------- */
  var PHOTOS_PAR_JOURNEE = {};
  (photosInitiales || []).forEach(function(p){
    (PHOTOS_PAR_JOURNEE[p.journee_id] = PHOTOS_PAR_JOURNEE[p.journee_id] || []).push(p);
  });

  /* --- texte de carnet par journee (voir supabase/migrations/0020) ------
     Par defaut, un paragraphe assemble depuis des champs deja verifies
     (titre, accroche, rail1, lieux/fil) -- jamais de donnee inventee,
     juste de la mise en forme. Chaque membre peut le remplacer par son
     propre texte pour SON carnet perso (une ligne carnet_textes = une
     surcharge ; son absence = texte automatique, jamais une valeur
     vide stockee). Le carnet familial, lui, n'a pas de proprietaire par
     journee : il utilise toujours texteAutoJournee, voir generer-carnet. */
  var TEXTES_CARNET_PAR_JOURNEE = {};
  (textesCarnetInitiaux || []).forEach(function(t){ TEXTES_CARNET_PAR_JOURNEE[t.journee_id] = t; });
  var CONTROLEUR_PREPARATION_CARNET = null;

  function texteAutoJournee(j){
    var morceaux = [sansHtml(j.titre)];
    if(j.rail1) morceaux[0] += " — " + j.rail1;
    var suite = [];
    if(j.accroche) suite.push(sansHtml(j.accroche));
    var lieuxNoms = (j.lieux || []).map(function(l){ return l.nom; }).filter(Boolean);
    if(lieuxNoms.length){
      suite.push("Au programme : " + lieuxNoms.join(", ") + ".");
    } else if(j.fil && j.fil.length){
      suite.push("Au programme : " + j.fil.map(function(f){ return sansHtml(f.texte); }).join(" "));
    }
    return morceaux[0] + (suite.length ? ". " + suite.join(" ") : ".");
  }

  function texteCarnetJournee(j){
    var surcharge = TEXTES_CARNET_PAR_JOURNEE[j.uuid];
    return (surcharge && surcharge.texte) || texteAutoJournee(j);
  }

  function sauvegarderTexteCarnet(j, texte){
    if(!modeFamille || !utilisateurId || !voyageId) return Promise.resolve();
    return supabaseClient.from("carnet_textes").upsert({
      voyage_id: voyageId, journee_id: j.uuid, membre_id: utilisateurId, texte: texte,
      maj_le: new Date().toISOString()
    }, { onConflict: "journee_id,membre_id" }).select().single().then(function(res){
      if(res.error){ console.error("Échec d'enregistrement du texte de carnet :", res.error); return; }
      TEXTES_CARNET_PAR_JOURNEE[j.uuid] = res.data;
    });
  }

  function reinitialiserTexteCarnet(j){
    if(!TEXTES_CARNET_PAR_JOURNEE[j.uuid]) return Promise.resolve();
    return supabaseClient.from("carnet_textes").delete().eq("id", TEXTES_CARNET_PAR_JOURNEE[j.uuid].id).then(function(res){
      if(res.error){ console.error("Échec de réinitialisation du texte de carnet :", res.error); return; }
      delete TEXTES_CARNET_PAR_JOURNEE[j.uuid];
    });
  }

  var URLS_SIGNEES_PHOTOS = {};
  function urlSigneePhoto(storagePath){
    if(!URLS_SIGNEES_PHOTOS[storagePath]){
      URLS_SIGNEES_PHOTOS[storagePath] = supabaseClient.storage.from("photos")
        .createSignedUrl(storagePath, 3600)
        .then(function(res){ return (res.data && res.data.signedUrl) || null; });
    }
    return URLS_SIGNEES_PHOTOS[storagePath];
  }
  var URLS_MINIATURES_CARNET = {};
  function urlMiniatureCarnet(storagePath){
    if(!URLS_MINIATURES_CARNET[storagePath]){
      URLS_MINIATURES_CARNET[storagePath] = supabaseClient.storage.from("photos")
        .createSignedUrl(storagePath, 3600, { transform: { width: 320, height: 240, resize: "cover", quality: 60 } })
        .then(function(res){ return (res.data && res.data.signedUrl) || null; });
    }
    return URLS_MINIATURES_CARNET[storagePath];
  }
  function urlSigneePhotoPourExport(storagePath){
    return supabaseClient.storage.from("photos").createSignedUrl(storagePath, 1800)
      .then(function(res){
        if(res.error) throw res.error;
        return (res.data && res.data.signedUrl) || null;
      });
  }

  /* redimensionne a 2000px de large max et reencode en JPEG qualite 0.8 --
     suffisant pour un rendu ecran/impression, divise le poids par 3 a 5
     par rapport a une photo de telephone non compressee. Necessaire pour
     rester dans le plan gratuit Supabase (1 Go de Storage, voir
     conversation de conception) plutot qu'un confort reseau : sans ca,
     quelques jours de voyage a plusieurs membres suffisent a le saturer. */
  function compresserPhoto(fichier){
    return new Promise(function(resolve, reject){
      var lecteur = new FileReader();
      lecteur.onerror = reject;
      lecteur.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var ratio = Math.min(1, 2000 / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob){
            if(blob) resolve(blob); else reject(new Error("compression impossible"));
          }, "image/jpeg", 0.8);
        };
        img.src = lecteur.result;
      };
      lecteur.readAsDataURL(fichier);
    });
  }

  function idRandom(){
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function televerserPhoto(j, fichier, majBouton){
    if(!modeFamille || !utilisateurId || !voyageId) return Promise.resolve();
    if(majBouton) majBouton("Compression…");
    return compresserPhoto(fichier).then(function(blob){
      var chemin = voyageId + "/" + utilisateurId + "/" + idRandom() + ".jpg";
      if(majBouton) majBouton("Envoi…");
      return supabaseClient.storage.from("photos").upload(chemin, blob, { contentType: "image/jpeg" })
        .then(function(resUpload){
          if(resUpload.error) throw resUpload.error;
          return supabaseClient.from("photos").insert({
            voyage_id: voyageId,
            journee_id: j.uuid,
            membre_id: utilisateurId,
            storage_path: chemin
          }).select().single();
        })
        .then(function(resInsert){
          if(resInsert.error) throw resInsert.error;
          (PHOTOS_PAR_JOURNEE[j.uuid] = PHOTOS_PAR_JOURNEE[j.uuid] || []).push(resInsert.data);
          rafraichirPhotos(j.id);
        });
    }).catch(function(err){
      console.error("Échec de l'ajout de la photo :", err);
      window.alert("La photo n'a pas pu être envoyée — réessayez quand le réseau sera meilleur.");
    }).then(function(){
      if(majBouton) majBouton(null);
    });
  }

  function basculerVisibilitePhoto(photo, j){
    var nouvelle = photo.visibilite === "partagee" ? "perso" : "partagee";
    return supabaseClient.from("photos").update({ visibilite: nouvelle }).eq("id", photo.id).then(function(res){
      if(res.error){ console.error("Échec de mise à jour de la visibilité :", res.error); return; }
      photo.visibilite = nouvelle;
      rafraichirPhotos(j.id);
    });
  }

  function legenderPhoto(photo, j, nouvelleLegende){
    var texte = nouvelleLegende.trim();
    return supabaseClient.from("photos").update({ legende: texte || null }).eq("id", photo.id).then(function(res){
      if(res.error){ console.error("Échec d'enregistrement du commentaire :", res.error); return; }
      photo.legende = texte || null;
      rafraichirPhotos(j.id);
    });
  }

  function supprimerPhoto(photo, j){
    if(!window.confirm("Supprimer cette photo ?")) return Promise.resolve();
    return supabaseClient.storage.from("photos").remove([photo.storage_path]).then(function(){
      return supabaseClient.from("photos").delete().eq("id", photo.id);
    }).then(function(res){
      if(res.error){ console.error("Échec de suppression de la photo :", res.error); return; }
      var liste = PHOTOS_PAR_JOURNEE[j.uuid] || [];
      var idx = liste.indexOf(photo);
      if(idx > -1) liste.splice(idx, 1);
      rafraichirPhotos(j.id);
    });
  }

  /* actionsCompletes distingue les deux endroits ou la galerie s'affiche :
     - vue journee (detail) : false -- juste regarder/ajouter/supprimer,
       le reste (commenter, partager) alourdirait une page deja dense ;
     - onglet Carnet : true -- c'est desormais le seul endroit ou
       commenter et partager une photo (voir conversation de conception). */
  function contenuGaleriePhotos(conteneur, j, actionsCompletes){
    conteneur.innerHTML = "";
    var photos = PHOTOS_PAR_JOURNEE[j.uuid] || [];
    if(!photos.length){
      conteneur.appendChild(el("p", "photos-vide", "Aucune photo pour ce jour pour l'instant."));
      return;
    }
    var grille = el("div", "photos-grille");
    photos.forEach(function(p){
      var figure = el("figure", "photos-item" + (p.membre_id === utilisateurId ? " mine" : ""));
      var img = document.createElement("img");
      img.alt = p.legende || "";
      img.loading = "lazy";
      urlSigneePhoto(p.storage_path).then(function(url){ if(url) img.src = url; });
      figure.appendChild(img);

      /* commentaire : affiche s'il existe, quel qu'en soit l'auteur (les
         enfants doivent voir les commentaires des autres, pas seulement
         les leurs) ; seul l'auteur de la photo peut l'ajouter/le modifier
         -- c'est une legende de la photo, pas un fil de discussion. */
      if(p.legende){
        figure.appendChild(el("figcaption", "photos-item-legende", sansHtml(p.legende)));
      }

      if(p.membre_id === utilisateurId){
        var actions = el("div", "photos-item-actions");

        if(actionsCompletes){
          var boutonCommenter = el("button", "photos-item-icone", ICONES.commentaire);
          boutonCommenter.type = "button";
          boutonCommenter.setAttribute("aria-label", p.legende ? "Modifier le commentaire" : "Commenter");
          boutonCommenter.title = p.legende ? "Modifier le commentaire" : "Commenter";
          boutonCommenter.addEventListener("click", function(){
            var existante = figure.querySelector(".photos-item-legende");
            if(existante) figure.removeChild(existante);
            var champ = document.createElement("textarea");
            champ.className = "photos-item-legende-champ";
            champ.value = p.legende || "";
            champ.placeholder = "Un mot sur cette photo…";
            champ.rows = 2;
            figure.insertBefore(champ, actions);
            champ.focus();
            champ.addEventListener("blur", function(){ legenderPhoto(p, j, champ.value); });
            champ.addEventListener("keydown", function(ev){
              if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); champ.blur(); }
            });
          });
          actions.appendChild(boutonCommenter);

          var boutonPartage = el("button", "photos-item-icone" + (p.visibilite === "partagee" ? " actif" : ""), ICONES.partager);
          boutonPartage.type = "button";
          boutonPartage.setAttribute("aria-label", p.visibilite === "partagee" ? "Partagée avec la famille — cliquer pour ne plus partager" : "Partager avec la famille");
          boutonPartage.title = boutonPartage.getAttribute("aria-label");
          boutonPartage.addEventListener("click", function(){ basculerVisibilitePhoto(p, j); });
          actions.appendChild(boutonPartage);
        }

        var boutonSupprimer = el("button", "photos-item-icone", ICONES.supprimer);
        boutonSupprimer.type = "button";
        boutonSupprimer.setAttribute("aria-label", "Supprimer cette photo");
        boutonSupprimer.title = "Supprimer cette photo";
        boutonSupprimer.addEventListener("click", function(){ supprimerPhoto(p, j); });
        actions.appendChild(boutonSupprimer);

        figure.appendChild(actions);
      }
      grille.appendChild(figure);
    });
    conteneur.appendChild(grille);
  }

  /* un même jour peut être affiché deux fois à la fois (vue détail et
     onglet Carnet) : on reconstruit les deux plutôt que de suivre les
     deltas un par un, le volume (quelques dizaines de photos sur tout
     un voyage) rend ça largement assez rapide pour rester imperceptible. */
  function rafraichirPhotos(jourId){
    var j = trouverJour(jourId);
    if(!j) return;
    Array.prototype.forEach.call(document.querySelectorAll(".photos[data-jour-photos='" + jourId + "'] .photos-grille-conteneur"), function(conteneur){
      contenuGaleriePhotos(conteneur, j, false);
    });
    if(modeFamille) rendrePanelCarnet();
  }

  /* bouton + input d'ajout de photo, reutilise a deux endroits (vue
     journee et onglet Carnet, voir conversation de conception) : la
     vue journee ne garde qu'ajouter/supprimer, l'onglet Carnet est
     desormais l'endroit pour tout le reste (texte, commentaires,
     partage). */
  function construireControleUpload(j){
    var wrap = document.createElement("div");
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;
    input.className = "photos-input-cache";
    input.style.display = "none";
    var boutonAjouter = el("button", "photos-bouton-ajouter", "Ajouter une photo");
    boutonAjouter.type = "button";
    boutonAjouter.addEventListener("click", function(){ input.click(); });
    input.addEventListener("change", function(){
      if(!input.files || !input.files.length) return;
      var fichiers = Array.prototype.slice.call(input.files);
      input.value = "";
      var texteInitial = boutonAjouter.textContent;
      /* une a la fois : la compression + l'upload sont deja asynchrones
         par photo (voir televerserPhoto), les lancer toutes en parallele
         saturerait inutilement une connexion mobile sur le terrain --
         mieux vaut une file d'attente visible ("2/5") qu'un blocage
         silencieux. */
      var total = fichiers.length;
      function suivante(index){
        if(index >= total){
          boutonAjouter.textContent = texteInitial;
          boutonAjouter.disabled = false;
          return;
        }
        var suffixe = total > 1 ? " (" + (index + 1) + "/" + total + ")" : "";
        televerserPhoto(j, fichiers[index], function(etat){
          boutonAjouter.textContent = (etat || "Envoi…") + suffixe;
          boutonAjouter.disabled = true;
        }).then(function(){ suivante(index + 1); });
      }
      suivante(0);
    });
    wrap.appendChild(boutonAjouter);
    wrap.appendChild(input);
    return wrap;
  }

  /* vue journee : uniquement ajouter/regarder/supprimer, pas le texte de
     carnet ni les commentaires/partage — desormais dans l'onglet Carnet
     (voir construireSectionCarnetJour), pour ne pas alourdir cette page
     deja dense en informations pratiques. */
  function construireBlocPhotos(j){
    if(!modeFamille || !utilisateurId) return null;
    var bloc = el("div", "block photos");
    bloc.setAttribute("data-jour-photos", j.id);
    bloc.appendChild(el("h3", null, "Photos du jour"));
    bloc.appendChild(construireControleUpload(j));

    var conteneur = el("div", "photos-grille-conteneur");
    bloc.appendChild(conteneur);
    contenuGaleriePhotos(conteneur, j, false);

    return bloc;
  }

  /* --- texte du carnet pour ce jour : pre-rempli avec texteAutoJournee,
     modifiable a la main (voir migration 0020 / sauvegarderTexteCarnet).
     Un badge indique si le texte affiche est l'automatique ou une
     surcharge, avec un bouton pour revenir a l'automatique -- jamais de
     perte silencieuse du texte auto derriere une surcharge oubliee. */
  /* confirmation d'enregistrement, transitoire : reponse a "a quel moment
     je suis sur que c'est enregistre ?" (voir conversation de conception)
     -- affichee juste apres la resolution de l'appel Supabase, jamais
     avant (pas d'optimisme silencieux qui mentirait en cas d'echec
     reseau, deja loggue en erreur par ailleurs). */
  function afficherConfirmationEnregistrement(statutEl){
    statutEl.textContent = "Enregistré ✓";
    statutEl.classList.add("visible");
    clearTimeout(statutEl._minuteur);
    statutEl._minuteur = setTimeout(function(){ statutEl.classList.remove("visible"); }, 2200);
  }

  function construireTexteCarnetJour(j){
    var wrap = el("div", "carnet-texte-jour");
    wrap.appendChild(el("p", "carnet-texte-jour-label", "Texte du carnet pour ce jour (utilisé dans votre carnet PDF personnel)"));

    var champ = document.createElement("textarea");
    champ.className = "carnet-texte-jour-champ";
    champ.rows = 3;
    champ.value = texteCarnetJournee(j);

    var statut = el("span", "carnet-texte-jour-statut", "");

    var estSurcharge = !!TEXTES_CARNET_PAR_JOURNEE[j.uuid];
    var boutonReinit = el("button", "carnet-texte-jour-reinit", "Revenir au texte automatique");
    boutonReinit.type = "button";
    boutonReinit.hidden = !estSurcharge;

    champ.addEventListener("blur", function(){
      var valeur = champ.value.trim();
      if(!valeur || valeur === texteAutoJournee(j)){
        reinitialiserTexteCarnet(j).then(function(){
          boutonReinit.hidden = true;
          afficherConfirmationEnregistrement(statut);
        });
        return;
      }
      sauvegarderTexteCarnet(j, valeur).then(function(){
        boutonReinit.hidden = false;
        afficherConfirmationEnregistrement(statut);
      });
    });
    boutonReinit.addEventListener("click", function(){
      reinitialiserTexteCarnet(j).then(function(){
        champ.value = texteAutoJournee(j);
        boutonReinit.hidden = true;
      });
    });

    /* amelioration IA (Edge Function "generer-texte-ia", voir
       supabase/functions) : part du texte deja present dans le champ
       (souvenirs/formulation de la famille) plutot que de toujours
       repartir de zero -- seul le texte automatique non modifie est
       traite comme "rien a ameliorer", donc generation depuis les faits.
       Jamais applique automatiquement : la reponse se pose dans le
       champ, c'est le blur du textarea qui l'enregistre comme n'importe
       quelle saisie manuelle. Sur demande explicite seulement (bouton),
       pas a l'ouverture du bloc : chaque appel est facture. */
    var boutonIA = el("button", "carnet-texte-jour-ia", "Améliorer avec l'IA");
    boutonIA.type = "button";
    boutonIA.addEventListener("click", function(){
      var texteInitial = boutonIA.textContent;
      boutonIA.disabled = true;
      boutonIA.textContent = "Génération…";
      var texteSaisi = champ.value.trim();
      var texteAAmeliorer = (texteSaisi && texteSaisi !== texteAutoJournee(j)) ? texteSaisi : "";
      supabaseClient.functions.invoke("generer-texte-ia", {
        body: { voyage_id: voyageId, journee_id: j.uuid, texte_actuel: texteAAmeliorer }
      }).then(function(res){
        if(res.error) throw res.error;
        var texte = res.data && res.data.texte;
        if(!texte) throw new Error("réponse vide");
        champ.value = texte;
        return sauvegarderTexteCarnet(j, texte).then(function(){
          boutonReinit.hidden = false;
          afficherConfirmationEnregistrement(statut);
        });
      }).catch(function(err){
        console.error("Échec de génération IA :", err);
        window.alert("La génération n'a pas fonctionné — réessayez plus tard, ou écrivez le texte à la main.");
      }).then(function(){
        boutonIA.disabled = false;
        boutonIA.textContent = texteInitial;
      });
    });

    wrap.appendChild(champ);
    var actionsTexte = el("div", "carnet-texte-jour-actions");
    actionsTexte.appendChild(boutonReinit);
    actionsTexte.appendChild(boutonIA);

  /* --- onglet Carnet : generation du PDF a emporter (Edge Function
     "generer-carnet", voir conception) --------------------------------
     Deux modes, meme reutilisation que la conception l'a fixe :
     - "perso" : uniquement les photos du membre connecte, quelle que
       soit leur visibilite -- chacun peut se faire son propre souvenir.
     - "famille" : les photos marquees "partagee" par n'importe quel
       membre -- jamais par defaut, uniquement celles dont l'auteur a
       explicitement accepte qu'elles y figurent (voir construireBlocPhotos).
     Generation disponible a tout moment, meme partielle -- pas de notion
     de voyage "termine" (voir conversation de conception). L'Edge
     Function elle-meme est un chantier separe : ce panneau reste
     fonctionnel (compte les photos, affiche l'etat) meme avant qu'elle
     existe, avec un message clair si l'appel echoue plutot qu'un bouton
     qui ne fait rien. */
  function statistiquesPhotos(){
    var joursAvecPhotos = 0, total = 0, partageesTotal = 0;
    Object.keys(PHOTOS_PAR_JOURNEE).forEach(function(uuid){
      var liste = PHOTOS_PAR_JOURNEE[uuid] || [];
      if(liste.length) joursAvecPhotos++;
      total += liste.length;
      partageesTotal += liste.filter(function(p){ return p.visibilite === "partagee"; }).length;
    });
    var mesPhotos = 0;
    Object.keys(PHOTOS_PAR_JOURNEE).forEach(function(uuid){
      (PHOTOS_PAR_JOURNEE[uuid] || []).forEach(function(p){ if(p.membre_id === utilisateurId) mesPhotos++; });
    });
    return { joursAvecPhotos: joursAvecPhotos, total: total, partageesTotal: partageesTotal, mesPhotos: mesPhotos };
  }

  /* --- disque solaire de l'éclipse (12 août) ----------------------------
     Composant partagé par l'accueil (bloc à venir) et le détail du 12 août
     — même schéma aux deux endroits, seule la taille du conteneur diffère.
     Couleurs écrites en dur (pas de var(--...)) : le composant pose son
     propre fond de ciel, il ne doit rien hériter du contexte qui l'entoure.
     Identifiants de dégradé/masque générés à chaque appel : l'accueil et
     le détail du jour peuvent être présents dans le DOM en même temps
     (onglets superposés, juste masqués), et des id SVG dupliqués cassent
     silencieusement le dégradé et le masque du second exemplaire — c'était
     le bug du disque plein et du "20 H 20" illisible sur la vue du jour.
     Schéma statique : Soleil à 5° de hauteur, 91 % d'obscuration (valeurs
     du carnet). Le décalage Lune/Soleil est calé pour qu'un recouvrement
     de deux disques égaux donne 91 % d'aire commune ; le sens du passage
     de la Lune reste indicatif, pas une éphéméride exacte. */
  var compteurSchemaEclipse = 0;
  function svgSchemaEclipse(){
    compteurSchemaEclipse++;
    var idDusk = "eclDusk" + compteurSchemaEclipse;
    var idGlow = "eclGlow" + compteurSchemaEclipse;
    var idMask = "eclMask" + compteurSchemaEclipse;
    return (
      '<figure class="eclipse-disc">' +
        '<svg viewBox="0 0 400 190" role="img" aria-label="' +
          "Schéma du maximum de l'éclipse : 91 % d'obscuration, Soleil à environ 5° au-dessus de l'horizon, à 20 h 20." +
        '">' +
          '<defs>' +
            '<linearGradient id="' + idDusk + '" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#1F2A3D" stop-opacity="1"/>' +
              '<stop offset="100%" stop-color="#1F2A3D" stop-opacity="0"/>' +
            '</linearGradient>' +
            '<radialGradient id="' + idGlow + '" cx="50%" cy="74%" r="55%">' +
              '<stop offset="0%" stop-color="#9C7A2E" stop-opacity=".32"/>' +
              '<stop offset="100%" stop-color="#9C7A2E" stop-opacity="0"/>' +
            '</radialGradient>' +
            '<mask id="' + idMask + '">' +
              '<rect x="0" y="0" width="400" height="190" fill="black"/>' +
              '<circle cx="200" cy="118" r="30" fill="white"/>' +
              '<circle cx="203" cy="115" r="30" fill="black"/>' +
            '</mask>' +
          '</defs>' +
          '<rect x="0" y="0" width="400" height="190" fill="url(#' + idDusk + ')"/>' +
          '<circle cx="200" cy="140" r="90" fill="url(#' + idGlow + ')"/>' +
          '<rect x="0" y="150" width="400" height="40" fill="#0F4A4E" fill-opacity=".08"/>' +
          '<line x1="20" y1="150" x2="380" y2="150" stroke="#1A1A18" stroke-opacity=".22"/>' +
          '<line x1="56" y1="118" x2="56" y2="150" stroke="#8E8A7C" stroke-dasharray="2,4"/>' +
          '<line x1="56" y1="118" x2="168" y2="118" stroke="#8E8A7C" stroke-dasharray="2,4"/>' +
          '<text x="40" y="122" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#595650">5°</text>' +
          '<circle cx="200" cy="118" r="30" fill="none" stroke="#9C7A2E" stroke-opacity=".25"/>' +
          '<circle cx="200" cy="118" r="30" fill="#9C7A2E" mask="url(#' + idMask + ')"/>' +
          '<text x="200" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="16" letter-spacing=".08em" fill="#fff">20 H 20</text>' +
          '<text x="200" y="70" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="16" fill="#B23A2E">91 %</text>' +

  /* --- easter egg : mode éclipse ----------------------------------------
     Trois appuis sur le disque d'éclipse de l'accueil, en moins de 1,5 s,
     assombrissent et désaturent toute l'application pendant ~15 s (couche
     superposée, jamais les variables de couleur — voir .eclipse-cachee-
     overlay dans le CSS). Un second triple-appui pendant l'effet
     l'interrompt et restaure instantanément.
     Le disque est un enfant du lien .accueil-eclipse (href #jour-0812) :
     un appui isolé doit quand même ouvrir le 12 août, mais seulement après
     un court délai d'arbitrage (~350 ms) pendant lequel un deuxième puis
     un troisième appui peuvent encore arriver pour déclencher le mode
     éclipse à la place. stopPropagation() n'est donc utilisé que pour le
     triple appui lui-même — jamais pour un appui isolé ou double, qui
     laissent la navigation suivre son cours (avec délai). */
  var appuisEclipseCachee = [];
  var delaiAppuiEclipseCachee = null;
  var animationEclipseCachee = null;
  var overlayEclipseCachee = null;

  /* toujours rattachée à "finish" ET "cancel" : que l'effet se termine de
     lui-même ou soit coupé (second triple-appui, ou toute autre raison),
     l'état partagé revient à zéro — jamais d'overlay ni de compteur
     laissés en suspens. Idempotente : les deux évènements peuvent se
     déclencher l'un après l'autre sans effet de bord. */
  function nettoyerEclipseCachee(){
    if(overlayEclipseCachee && overlayEclipseCachee.parentNode) overlayEclipseCachee.remove();
    animationEclipseCachee = null;
    overlayEclipseCachee = null;
  }

  function declencherEclipseCachee(){
    var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if(animationEclipseCachee){
      animationEclipseCachee.cancel();
      return;
    }

    var overlay = document.createElement("div");
    overlay.className = "eclipse-cachee-overlay";
    overlay.setAttribute("aria-hidden", "true");
    document.body.appendChild(overlay);
    overlayEclipseCachee = overlay;

    function trame(offset, creux){
      return creux
        ? { offset: offset, backdropFilter: "brightness(.55) saturate(.35) contrast(1.12)", backgroundColor: "rgba(31,42,61,.14)" }
        : { offset: offset, backdropFilter: "brightness(1) saturate(1)", backgroundColor: "rgba(31,42,61,0)" };
    }
    /* réduit : même passage par le creux, mais quasi instantané (bref
       plutôt que supprimé) — descente et remontée compressées à ~12 %/18 %
       de la durée totale, un bref palier au lieu des 6 s + 3 s + 6 s
       habituels. */
    var trames = reduit
      ? [ trame(0, false), trame(.12, true), trame(.82, true), trame(1, false) ]
      : [ trame(0, false), trame(.4, true), trame(.6, true), trame(1, false) ];

    animationEclipseCachee = overlay.animate(trames, {
      duration: reduit ? 700 : 15000,
      easing: "cubic-bezier(0.77,0,0.175,1)"
    });
    animationEclipseCachee.addEventListener("finish", nettoyerEclipseCachee);
    animationEclipseCachee.addEventListener("cancel", nettoyerEclipseCachee);
  }

  function surAppuiDisqueEclipseCachee(e){
    e.preventDefault();
    var lien = e.currentTarget.closest("a");
    var maintenant = Date.now();
    appuisEclipseCachee = appuisEclipseCachee.filter(function(t){ return maintenant - t < 1500; });
    appuisEclipseCachee.push(maintenant);

    if(appuisEclipseCachee.length >= 3){
      e.stopPropagation();
      clearTimeout(delaiAppuiEclipseCachee);
      delaiAppuiEclipseCachee = null;
      appuisEclipseCachee = [];
      declencherEclipseCachee();
      return;
    }

    if(appuisEclipseCachee.length === 1){
      delaiAppuiEclipseCachee = setTimeout(function(){
        delaiAppuiEclipseCachee = null;
        appuisEclipseCachee = [];
        if(lien) location.hash = lien.hash;
      }, 350);
    } else {
      /* deuxième appui dans la fenêtre : on annule la navigation en
         attente, le temps de voir si un troisième appui complète le
         triple-appui avant les 1,5 s. */
      clearTimeout(delaiAppuiEclipseCachee);
      delaiAppuiEclipseCachee = null;
    }
  }

  /* --- illustration héros de l'accueil : le lac de Garde, cœur du séjour
     (14 jours sur 22 s'y passent) — composition fixe, fond vers premier
     plan : montagnes/aiguilles, collines/créneaux, lac/voile, cyprès/
     olivier. Catégorie lac, mode profond (voir composerBandeau), quatre
     plans plutôt que les trois des bandeaux de journée puisque le format
     1000×560 est nettement plus haut. Seul le ciel change selon le moment
     du voyage — le reste de la composition ne bouge pas. */
  function svgIllustrationAccueil(ciel){
    var opts = {
      hauteur: 560,
      plans: [
        { base: 360, amplitude: 60 },
        { base: 460, amplitude: 75 },
        { base: 560, amplitude: 90 },
        { base: 660, amplitude: 110 }
      ],
      dosage: [78, 58, 38, 18],
      dephasage: [0.18, 0.58, 0.34, 0.47],
      xMin: 0.25, xMax: 0.75,
      cielY: 340, cielEchelle: 2.0
    };
    var noms = [ciel, "montagnes", "aiguilles", "collines", "creneaux", "lac", "voile", "cypres", "olivier"];
    return composerBandeau(noms, "lac", true, opts);
  }
  /* avant le départ et pendant le voyage : l'éclipse, seule composition
     que ce carnet puisse représenter. Après le 23 août, l'événement est
     passé : le soleil prend sa place, rien d'autre ne change. */
  function cielAccueil(){

    return (!r.exact && !r.avant) ? "soleil" : "eclipse";
  }

  /* --- en-tête et pied de l'onglet Agenda --------------------------------- */
  /* jours et km calculés depuis JOURS (kmCumules/formatNombre, définies
     plus bas — même source que le bloc de chiffres de l'accueil) plutôt
     qu'écrits en dur : les deux affichages ne peuvent plus diverger. */
  document.getElementById("c-eyebrow").innerHTML = fmt(CARNET.eyebrow) + " · " + JOURS.length + " jours · " + formatNombre(kmCumules()) + " km";
  document.getElementById("c-titre").innerHTML   = fmt(CARNET.titre) + "<br>" + fmt(CARNET.titreSuite);
  document.getElementById("c-sous").innerHTML    = fmt(CARNET.sousTitre);

  /* --- pratique du jour : grille libellé/valeur, tous les champs sont
     optionnels. chien prend une pastille colorée plutôt qu'un texte brut. */
  var CHIEN_CLASSES = { "facile": "facile", "à gérer": "agerer", "difficile": "difficile" };
  function construirePratiqueJour(p){
    var champs = [
      ["parking", "Parking"],
      ["ztl", "ZTL"],
      ["reserver", "À réserver"],
      ["emporter", "À emporter"]
    ];
    var dl = el("dl", "pratique");
    champs.forEach(function(c){

      dd.appendChild(el("span", "pratique-chien " + (CHIEN_CLASSES[p.chien] || ""), niveau + " " + p.chien));
      dl.appendChild(dd);
    }
    return dl.children.length ? dl : null;
  }

  /* --- où manger : midi/soir facultatifs, plat en pied de bloc. Le tel
     devient un lien tel:, jamais reformaté — les numéros sont déjà au
     format international dans les données. La mention de fraîcheur est
     fixe, indépendante des données : elle s'affiche dès qu'un jour a un
     champ manger, quelle que soit la date de consultation. ------------- */
  var MANGER_AVERTISSEMENT = "Adresses relevées en juillet 2026 — en août, beaucoup d'établissements italiens ferment. Appelez avant de vous déplacer.";
  function construireRepasManger(repas, libelle){

    item.appendChild(el("p", "manger-nom", repas.nom));

  function construireMangerJour(m){

    if(m.soir) grille.appendChild(construireRepasManger(m.soir, "Dîner"));
