<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre grand tour d'Italie — Salò 2026</title>
<meta property="og:title" content="Notre grand tour d'Italie — Salò 2026">
<meta name="twitter:title" content="Notre grand tour d'Italie — Salò 2026">
<meta property="og:url" content="https://salo2026.netlify.app/">
<meta property="og:image" content="https://salo2026.netlify.app/og-image.png">
<meta name="twitter:image" content="https://salo2026.netlify.app/og-image.png">
<!-- Carnet familial privé, partagé par lien direct (pas de référencement
     public voulu) : URLs ci-dessus en absolu pour les robots d'aperçu de
     WhatsApp/iMessage, qui ne résolvent pas les chemins relatifs. -->
<meta name="robots" content="noindex, nofollow">
<!-- Nom sous l'icône à l'écran d'accueil : le <title> est dynamique
     (onglet ou journée ouverte), iOS s'en servirait sinon pour le
     raccourci — un seul mot tient sous l'icône. -->
<meta name="apple-mobile-web-app-title" content="Salò">

<!-- Mode autonome (ajout à l'écran d'accueil) : masque la barre d'adresse
     Safari. En contrepartie iOS ne fournit plus de bouton retour — la
     page doit rester entièrement navigable par elle-même (ancres de
     l'onglet Agenda, barre précédent/suivant .day-nav-sticky, bouton
     retour interne history.back()), ce qui est déjà le cas ici. Les
     liens vers l'extérieur (tel:, Google Maps via lienExterne()) portent
     déjà target="_blank" rel="noopener" : ils s'ouvrent hors de l'app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A7D80">

<!-- Icônes d'écran d'accueil : le « S » en Bodoni Moda (option retenue le
     28 juillet 2026 face au croissant d'éclipse). iOS ignore manifest.json
     pour l'icône et lit apple-touch-icon ; le manifest sert Android. URLs
     relatives au fichier (jamais en /icones/... depuis la racine) : le
     dossier icones/ doit voyager avec carnet.html quel que soit l'endroit
     où la page est servie, racine ou sous-chemin. -->
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/favicon.png" type="image/png">
<link rel="manifest" href="manifest.json">

<!--
  GABARIT. Ne contient aucun contenu de voyage : tout est dans donnees.js.
  Ce fichier porte les styles, le moteur de rendu et les interactions.

  Navigation : trois onglets fixes en bas (Aujourd'hui, Agenda, Urgences)
  et une vue détail plein écran par journée, adressable par ancre
  (#jour-MMJJ) pour que le bouton retour du navigateur fonctionne.

  Palette : choix arrêté, ne pas modifier sans demander.
  Polices : volet typographique de la direction Officina Bodoniana
  (Bodoni Moda en affichage, IBM Plex Sans/Mono conservés) — voir DESIGN.md.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
/* ---------- jetons ---------- */
:root{
  --paper:#F3F1EA;
  --paper-deep:#E9E6DD;
  --card:#DDD7C7;
  --ink:#1A1A18;
  --ink-soft:#595650;
  --pietra:#8E8A7C;
  --lago:#0F4A4E;
  --lago-mid:#2A7D80;
  --rosso:#B23A2E;
  --sole:#9C7A2E;
  --oliva:#67794F;
  --blu:#1F2A3D;
  --rule:rgba(26,26,24,.14);
  --rule-soft:rgba(26,26,24,.07);
  --tabbar-clear:calc(128px + var(--install-banner-h, 0px));

  /* catégorie de journée → couleur. Reprend le mappage déjà en usage
     dans .kind/.tick/TEINTE_PAR_CATEGORIE (illustrations.js) : ce n'est
     pas un nouveau choix, juste son extension à d'autres éléments. */
  --cat-route: var(--pietra);
  --cat-route-light: color-mix(in srgb, var(--pietra) 15%, var(--paper) 85%);
  --cat-ville: var(--lago);
  --cat-ville-light: color-mix(in srgb, var(--lago) 12%, var(--paper) 88%);
  --cat-nature: var(--oliva);
  --cat-nature-light: color-mix(in srgb, var(--oliva) 14%, var(--paper) 86%);
  --cat-lac: var(--lago-mid);
  --cat-lac-light: color-mix(in srgb, var(--lago-mid) 14%, var(--paper) 86%);
  --cat-evenement: var(--sole);
  --cat-evenement-light: color-mix(in srgb, var(--sole) 16%, var(--paper) 84%);

  /* variante "synthèse" : lavis très léger (8%) pour le fond du bandeau
     de synthèse de tête de journée — plus discret que -light, qui sert
     déjà ailleurs à des fonds plus présents (cartes de l'onglet Agenda). */
  --cat-route-synth: color-mix(in srgb, var(--pietra) 8%, var(--paper) 92%);
  --cat-ville-synth: color-mix(in srgb, var(--lago) 8%, var(--paper) 92%);
  --cat-nature-synth: color-mix(in srgb, var(--oliva) 8%, var(--paper) 92%);
  --cat-lac-synth: color-mix(in srgb, var(--lago-mid) 8%, var(--paper) 92%);
  --cat-evenement-synth: color-mix(in srgb, var(--sole) 8%, var(--paper) 92%);

  /* variante profonde : mélange à --ink pour garantir un contraste
     suffisant au texte blanc du bandeau de tête (chantier 2), même pour
     --pietra qui est la plus claire des cinq couleurs de catégorie.
     72/28 plutôt que 60/40 : à 60/40 la couleur de catégorie disparaît
     presque, le fond du bandeau devenant un gris-brun générique peu
     distinctif d'une catégorie à l'autre. Le texte blanc en réserve
     garde une marge large (5.4:1 au pire cas, --pietra ; 12:1 au mieux,
     --lago) au-dessus du minimum WCAG de 4.5:1. */
  --cat-route-deep: color-mix(in srgb, var(--pietra) 72%, var(--ink) 28%);
  --cat-ville-deep: color-mix(in srgb, var(--lago) 72%, var(--ink) 28%);
  --cat-nature-deep: color-mix(in srgb, var(--oliva) 72%, var(--ink) 28%);
  --cat-lac-deep: color-mix(in srgb, var(--lago-mid) 72%, var(--ink) 28%);
  --cat-evenement-deep: color-mix(in srgb, var(--sole) 72%, var(--ink) 28%);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* .panel n'a plus besoin de dégager toute la hauteur de la barre d'onglets
   en propre : le colophon qui suit systématiquement chaque panel (voir plus
   bas) porte désormais cette réserve dans son propre padding-bas. Ici, un
   simple espace d'air avant le filet du colophon. */
.panel{max-width:960px;margin:0 auto;padding:0 22px 12px}
.panel[hidden]{display:none}
.detail-inner{max-width:960px;margin:0 auto;padding:0 22px calc(var(--tabbar-clear) + env(safe-area-inset-bottom))}
/* vue détail : clair supplémentaire pour la barre de navigation séquentielle
   sticky (46px, voir .day-nav-sticky), qui s'ajoute à la barre d'onglets
   au-dessus de laquelle elle est ancrée. */
.detail-inner{padding-bottom:calc(var(--tabbar-clear) + 46px + env(safe-area-inset-bottom))}

/* ---------- en-tête ---------- */
.masthead{padding:54px 0 26px;border-bottom:2px solid var(--ink)}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--rosso);font-weight:600;margin:0 0 16px;
}
h1{
  font-family:"Bodoni Moda",Georgia,serif;
  font-weight:600;
  font-size:clamp(2.6rem,7vw,4.6rem);
  line-height:.95;letter-spacing:-.01em;
  margin:0 0 6px;
}
h1 em{font-style:italic;color:var(--lago)}
.sub{
  font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft);
  margin:14px 0 0;
}

/* ---------- en-tête des onglets secondaires ---------- */
.panel-head{padding:38px 0 22px;border-bottom:2px solid var(--ink)}
.panel-head h2{
  font-family:"Bodoni Moda",Georgia,serif;
  font-weight:600;font-size:clamp(2.1rem,6vw,3rem);
  line-height:.98;letter-spacing:-.01em;margin:0;
}
.countdown{margin:26px 0 4px}
.countdown-big{
  font-family:"Bodoni Moda",Georgia,serif;
  font-weight:600;font-size:clamp(1.75rem,5.5vw,2.3rem);
  line-height:1.05;letter-spacing:-.008em;margin:0;
}
.countdown-big.soon{color:var(--rosso)}

/* ---------- accueil : illustration héros pleine largeur (chantiers 3/4) ----
   Seul bloc du carnet, avec .hero (bandeau de tête d'une journée), où le
   texte est posé sur une image plutôt que sur du papier : titre, dates et
   compte à rebours en réserve blanche dans le ciel vide du haut de
   l'illustration — l'horizon des plans lointains (voir svgIllustrationAccueil)
   est volontairement abaissé pour lui laisser de la place, et le disque de
   l'éclipse/soleil reste plus bas, dégagé de tout texte. Sous 480px, la
   hauteur est fixée à 45 % de l'écran plutôt que dictée par le ratio de
   l'image (1000×560, nettement plus large que haut) : l'illustration doit
   faire image sans repousser tout le contenu utile hors de l'écran — voir
   composerBandeau en mode héros. */
.accueil-hero{
  position:relative;margin:0 -22px 26px;width:calc(100% + 44px);
  overflow:hidden;background:var(--cat-lac-deep);
}
.accueil-hero-illu{display:block}
.accueil-hero-illu svg{display:block;width:100%;height:auto}
.accueil-hero::after{
  content:"";position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(rgba(15,15,14,.6), rgba(15,15,14,0));
  pointer-events:none;
}
.accueil-hero-texte{
  position:absolute;z-index:1;left:0;right:0;top:0;padding:22px 22px 20px;color:#fff;
}
.accueil-hero-titre{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(1.9rem,6vw,2.8rem);line-height:1;letter-spacing:-.008em;margin:0 0 8px;
}
.accueil-hero-titre em{font-style:italic;opacity:.85}
.accueil-hero-dates{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  color:rgba(255,255,255,.78);margin:0 0 10px;
}
.accueil-hero-compte{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(1.2rem,3.6vw,1.5rem);line-height:1.1;margin:0;
}

/* verrou de l'accès famille : posé sur l'illustration d'accueil, jamais
   dans le pied de page — c'est le seul point d'entrée/sortie du mode
   famille. Fond sombre semi-transparent pour rester lisible quelle que
   soit la zone de l'illustration derrière (ciel clair ou nuit d'éclipse).
   Icône seule, aucun libellé visible : "Connexion" sur une page publique
   inviterait des questions et laisserait croire à un compte. */
.accueil-hero-verrou{
  position:absolute;z-index:2;top:14px;right:14px;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:999px;background:rgba(15,15,14,.5);color:#fff;cursor:pointer;
}
.accueil-hero-verrou .iico{width:18px;height:18px}
.accueil-hero-verrou:hover{background:rgba(15,15,14,.72)}
.accueil-hero-verrou:focus-visible{outline:2px solid #fff;outline-offset:2px}

@media(max-width:480px){
  .accueil-hero{height:45vh;margin:0 -22px 22px}
  .accueil-hero-illu{position:absolute;inset:0;height:100%}
  .accueil-hero-illu svg{width:100%;height:100%}
}

/* ---------- accueil : contenu sous le héros (chantier 4) ----------
   Le voyage en chiffres : une rangée de tuiles, chiffre en Bodoni,
   libellé en petites capitales mono — même esprit que .reserve-date. */
.accueil-chiffres{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:18px 14px;margin:22px 0 30px;padding:20px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.accueil-chiffre{display:flex;flex-direction:column;gap:8px}
/* les deux <p> gardent leur marge de paragraphe par défaut du navigateur
   si on ne l'annule pas : c'est elle, pas le gap du flex, qui écartait
   la valeur de son libellé. */
.accueil-chiffre .n{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(1.5rem,5vw,2rem);line-height:1;letter-spacing:-.008em;color:var(--ink);
  margin:0;
}
.accueil-chiffre .l{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--pietra);
  margin:0;
}

/* schéma d'itinéraire : illustration du parcours en boucle, sous le bloc
   chiffres. Pas une carte géographique, pas un ruban chronologique — un
   tracé stylisé fermé, avec les primitives d'illustrations.js posées en
   retrait le long du chemin (voir segmentsItineraire/svgParcours). Un
   seul dessin, un seul viewBox qui se met à l'échelle seul : aucune
   variante mobile pour le tracé lui-même. */
.itineraire-block{margin:0 0 30px}
.itineraire-schema{position:relative}
.itineraire-schema svg{display:block;width:100%;height:auto}
.itin-decor{opacity:.9}
.itin-path{fill:none;stroke:var(--pietra);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.itin-node{fill:var(--ink)}
.itin-node.majeur{fill:var(--cat-lac)}

/* libellés des étapes : posés en HTML par-dessus l'illustration plutôt
   qu'en <text> dans le SVG, pour une taille en px réels, indépendante
   de l'échelle du dessin (un <text> en unités de viewBox deviendrait
   illisible une fois le schéma réduit à la largeur d'un téléphone).
   Chaque libellé est un lien positionné en pourcentage des coordonnées
   du nœud (ITIN_POS/W et H, voir construireEtiquettesItineraire) ; la
   zone tactile fait 44 px minimum et reste centrée sur le nœud, seul le
   texte visible est décalé — vers l'extérieur de la boucle — pour ne
   pas se chevaucher avec ses voisins. */
.itin-labels{position:absolute;inset:0}
.itin-label{
  position:absolute;display:flex;min-width:44px;min-height:44px;
  padding:4px;box-sizing:border-box;text-decoration:none;color:var(--ink);
}
.itin-label:hover .itin-label-nom,.itin-label:focus-visible .itin-label-nom{color:var(--rosso)}
.itin-label:focus-visible{outline:2px solid var(--rosso);outline-offset:2px;border-radius:8px}
.itin-label-nom{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:13px;
  line-height:1.25;white-space:nowrap;
}
.itin-label.majeur .itin-label-nom{font-size:17px;font-weight:700;color:var(--lago)}
.itin-label-duree{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--pietra);letter-spacing:.02em;white-space:nowrap;
}
@media(min-width:481px){
  /* au-delà de 480 px, le tracé a assez de place : la mention des
     14 jours rejoint le nom de Salò sur la même ligne. */
  .itin-label-duree{display:inline}
  .itin-label-duree::before{content:" · "}
}
.itin-label.dir-top{align-items:flex-end;justify-content:center;transform:translate(-50%,calc(-100% - 6px))}
.itin-label.dir-top .itin-label-nom,.itin-label.dir-top .itin-label-duree{text-align:center}
.itin-label.dir-bottom{align-items:flex-start;justify-content:center;transform:translate(-50%,6px)}
.itin-label.dir-bottom .itin-label-nom,.itin-label.dir-bottom .itin-label-duree{text-align:center}
.itin-label.dir-left{align-items:center;justify-content:flex-end;transform:translate(calc(-100% - 6px),-50%)}
.itin-label.dir-left .itin-label-nom,.itin-label.dir-left .itin-label-duree{text-align:right}
.itin-label.dir-right{align-items:center;justify-content:flex-start;transform:translate(6px,-50%)}
.itin-label.dir-right .itin-label-nom,.itin-label.dir-right .itin-label-duree{text-align:left}

/* pied du bloc itinéraire : le bouton Google Maps, séparé du schéma par
   un filet fin, centré — porte de sortie secondaire, le schéma reste
   le contenu principal du bloc. */
.itineraire-pied{
  margin-top:18px;padding-top:18px;border-top:1px solid var(--rule);
  display:flex;justify-content:center;
}
.itineraire-bouton{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:44px;width:100%;padding:11px 20px;
  font-family:"IBM Plex Mono",monospace;font-size:.84rem;font-weight:600;letter-spacing:.02em;
  color:var(--ink);text-decoration:none;
  border:1.5px solid var(--cat-route);border-radius:999px;background:transparent;
}
.itineraire-bouton .iico{flex:0 0 auto;color:var(--cat-route)}
.itineraire-bouton:hover{background:var(--cat-route-light)}
.itineraire-bouton:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
@media(min-width:481px){
  .itineraire-bouton{width:auto}
}

/* étape en cours : même filet rouge que .note, réservé à l'instant présent */
.accueil-etape{
  border-left:2px solid var(--rosso);padding:12px 16px;margin:0 0 24px;
  background:rgba(178,58,46,.045);
}
.accueil-etape .t{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--rosso);font-weight:700;margin:0 0 5px;
}
.accueil-etape p{margin:0;color:var(--ink);font-size:.95rem;line-height:1.5}

/* synthèse chasse au trésor sur l'accueil : bloc tactile menant à
   l'onglet Chasse — score dominant, jauge de progression avec seuils de
   badges, aperçu des badges débloqués. Fond teinté oliva (ni l'ambre du
   bloc éclipse ni le rouge d'alerte) pour se distinguer des autres blocs
   de l'accueil tout en restant dans la palette. Plus de flèche : c'est le
   bloc entier qui est tactile. Contrainte : ne jamais dépasser la hauteur
   de .accueil-eclipse, rester sous 200px à 380px de large. */
.accueil-chasse-resume{
  display:block;text-decoration:none;color:inherit;
  margin:0 0 26px;padding:10px 18px 10px;border:1px solid var(--oliva);
  background:color-mix(in srgb, var(--oliva) 7%, var(--paper) 93%);
}
.accueil-chasse-resume-tete{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--oliva);font-weight:700;margin:0 0 3px;
}
.accueil-chasse-resume:hover .accueil-chasse-resume-tete{color:var(--rosso)}
.accueil-chasse-resume-score{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(2.1rem,8vw,2.7rem);line-height:1;margin:0 0 2px;color:var(--ink);
}
.accueil-chasse-resume-score .sur{
  font-family:"IBM Plex Mono",monospace;font-size:.32em;letter-spacing:.03em;
  color:var(--pietra);font-weight:500;margin-left:5px;
}
.accueil-chasse-resume-detail{
  margin:0 0 4px;font-size:.78rem;letter-spacing:.02em;
  font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);
}
/* jauge : piste toujours visible (fond teinté plus soutenu que le bloc,
   pas juste un filet) pour rester lisible à 0 %. La plupart des badges se
   débloquent sur des conditions précises, pas sur un score : aucun repère
   de seuil n'a de position légitime sur cet axe, d'où une barre pleine
   sans marque, doublée de la ligne "prochain badge" ci-dessous. */
.accueil-chasse-resume-jauge{
  height:7px;margin:0 0 6px;border-radius:4px;overflow:hidden;
  background:color-mix(in srgb, var(--oliva) 22%, var(--paper) 78%);
}
.accueil-chasse-resume-jauge-remplissage{
  height:100%;border-radius:4px;background:var(--oliva);min-width:4px;
}
.accueil-chasse-resume-prochain{margin:0 0 4px}
.accueil-chasse-resume-prochain-label{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--pietra);margin:0 0 2px;
}
.accueil-chasse-resume-prochain-corps{display:flex;align-items:flex-start;gap:8px}
/* décalage optique : caractère d'x du nom mesuré à ~12,8px du haut de sa
   ligne (line-height 1.3, resserré pour tenir le bloc sous 200px) —
   l'icône de 14px descend d'autant pour caler son centre dessus plutôt
   que sur le haut de la ligne. */
.accueil-chasse-resume-prochain-icone{flex:0 0 auto;width:14px;height:14px;margin-top:5px;color:var(--oliva)}
.accueil-chasse-resume-prochain-icone svg{display:block;width:14px;height:14px}
.accueil-chasse-resume-prochain-texte{
  display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;row-gap:0;
  min-width:0;line-height:1.3;
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-soft);
}
.accueil-chasse-resume-prochain-nom{margin:0;font-size:.92rem;font-weight:600;color:var(--ink)}
.accueil-chasse-resume-prochain-reste{margin:0}
.accueil-chasse-resume-badges{
  display:flex;align-items:center;gap:8px;
}
.accueil-chasse-resume-badges-icones{display:flex;gap:5px}
.accueil-chasse-resume-badge-icone{
  flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;
  justify-content:center;border:1.5px solid var(--pietra);border-radius:999px;
  color:var(--pietra);background:var(--paper);
}
.accueil-chasse-resume-badge-icone svg{width:12px;height:12px}
.accueil-chasse-resume-badge-icone.obtenu{border-color:var(--oliva);color:var(--oliva)}
.accueil-chasse-resume-badges-texte{
  font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-soft);
}
.accueil-chasse-resume:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* bloc chasse au trésor : score + badges. Contenu complet, réservé à
   l'onglet Chasse (chantier « chasse dans son propre onglet »). */
.accueil-chasse{margin:0 0 26px;padding:18px 20px;border:1px solid var(--rule)}
.accueil-chasse-tete{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin:0 0 10px}
.accueil-chasse-label{
  display:flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lago);font-weight:700;margin:0;
}
.accueil-chasse-score{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(1.6rem,5vw,2.1rem);line-height:1;margin:0 0 4px;color:var(--ink);
}
.accueil-chasse-score .unite{
  font-family:"IBM Plex Mono",monospace;font-size:.5em;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:500;
}
.accueil-chasse-score .sur{
  font-family:"IBM Plex Mono",monospace;font-size:.46em;color:var(--pietra);font-weight:500;margin-left:2px;
}
.accueil-chasse-sub{margin:0;font-size:.86rem;color:var(--ink-soft)}
/* badges : liste de cartes, pas des pastilles muettes — le resume reste
   lisible verrouillé aussi, c'est lui qui donne envie de chercher. */
.accueil-chasse-badges{margin-top:6px}
.accueil-chasse-badges:empty{margin-top:0}
.chasse-badge{
  display:flex;align-items:flex-start;gap:11px;
  padding:11px 0;border-top:1px solid var(--rule-soft);
}
.chasse-badge:first-child{border-top:0;padding-top:0}
.chasse-badge-icone{
  flex:0 0 auto;width:34px;height:34px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--rule);border-radius:999px;color:var(--pietra);
}
.chasse-badge-icone svg{width:20px;height:20px}
.chasse-badge.obtenu .chasse-badge-icone{border-color:var(--sole);color:var(--sole)}
.chasse-badge-texte{flex:1 1 auto;min-width:0}
.chasse-badge-nom{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:.98rem;
  line-height:1.2;margin:0 0 3px;color:var(--pietra);
}
.chasse-badge.obtenu .chasse-badge-nom{color:var(--ink)}
.chasse-badge-resume{font-size:.82rem;line-height:1.4;color:var(--ink-soft);margin:0}

/* vue par journée de l'onglet Chasse : quelles observations restent à
   cocher, jour par jour — réutilise .regarder tel quel (voir
   construireRegarderJour), juste précédé d'un en-tête de journée propre
   à cette liste plutôt que du titre « À regarder » (déjà évident ici). */
.chasse-jour{margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule-soft)}
.chasse-jour:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.chasse-jour-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px 14px;
  width:100%;text-align:left;background:none;border:0;padding:5px 0;margin:0;
  font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;
}
.chasse-jour-tete-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.chasse-jour-date{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pietra);
}
.chasse-jour-titre{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:1.05rem;
  color:var(--ink);line-height:1.2;
}
.chasse-jour-head:hover .chasse-jour-titre{color:var(--rosso)}
.chasse-jour-head:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.chasse-jour-tete-etat{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.chasse-jour-progres{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;
  color:var(--ink-soft);white-space:nowrap;
}
.chasse-jour-chevron{
  flex:0 0 auto;width:14px;height:14px;color:var(--pietra);
  transition:transform .2s ease;
}
.chasse-jour.open .chasse-jour-chevron{transform:rotate(180deg)}
/* dépliage : grid-template-rows 0fr→1fr plutôt que height/max-height —
   anime jusqu'à la hauteur réelle du contenu sans la connaître à l'avance.
   min-height:0 sur l'intérieur est ce qui permet au contenu de descendre
   sous sa taille naturelle quand la piste de grille vaut 0fr. */
.chasse-jour-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.chasse-jour.open .chasse-jour-collapse{grid-template-rows:1fr}
.chasse-jour-collapse-inner{overflow:hidden;min-height:0;padding-top:0;transition:padding-top .25s ease}
.chasse-jour.open .chasse-jour-collapse-inner{padding-top:10px}
.chasse-jour.hidden{display:none}
/* filtres de la liste "Par journée" : une entrée masquée par le filtre
   actif disparaît (pas seulement estompée, voir .checked plus haut,
   qui reste un état différent) ; une journée sans entrée visible se
   masque entièrement plutôt que d'afficher un en-tête vide. */
.regarder-item.chasse-item-masque{display:none}

/* bloc « Aujourd'hui » : seule chose qu'on veut voir en ouvrant l'onglet
   sur place, pendant le séjour — les objectifs déjà cochés du jour
   disparaissent d'eux-mêmes (voir .regarder-item.checked ci-dessous),
   pas besoin de reconstruire le bloc à chaque coche. */
.chasse-aujourdhui-reste{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--rosso);margin:0 0 16px;
}
.chasse-aujourdhui .regarder-item.checked{display:none}

.chasse-partage{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:.76rem;font-weight:600;
  padding:8px 12px;border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.chasse-partage .iico{color:var(--pietra)}
.chasse-partage:hover{border-color:var(--lago);color:var(--lago)}
.chasse-partage:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

.accueil-demain{opacity:.82}
.accueil-demain .card{padding-top:14px;padding-bottom:14px}

/* rappel à réserver / accès à la liste : ligne tactile pleine largeur */
.accueil-lien{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:17px 18px;margin:0 0 30px;border:1px solid var(--rule);
  text-decoration:none;color:inherit;
}
.accueil-lien .txt{font-size:.95rem;line-height:1.4;color:var(--ink)}
.accueil-lien .txt b{color:var(--rosso)}
.accueil-lien .chev{flex:0 0 auto;color:var(--pietra);font-size:1.1rem}
.accueil-lien:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* bloc éclipse : seul bloc de l'accueil dans la couleur evenement, visible
   avant le 12 août seulement (états A et B). Reprend le disque SVG partagé
   (svgSchemaEclipse) tel quel, sans variante réduite. */
.accueil-eclipse{
  display:block;text-decoration:none;color:inherit;
  margin:0 0 30px;padding:18px 20px 4px;border:1px solid var(--cat-evenement);
}
.accueil-eclipse-label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--sole);font-weight:700;margin:0 0 6px;
}
.accueil-eclipse-compte{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(1.3rem,4vw,1.7rem);line-height:1.1;margin:0;color:var(--ink);
}
.accueil-eclipse .eclipse-disc{margin:10px 0 4px}
.accueil-eclipse-sub{margin:0 0 14px;font-size:.86rem;color:var(--ink-soft);line-height:1.5}
.accueil-eclipse-sub b{color:var(--ink)}
.accueil-eclipse:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* ---------- outils de l'onglet Agenda (mode Plans B, recherche) ---------- */
.jours-outils{display:flex;flex-direction:column;gap:12px;margin:22px 0 0}
.jours-outils:empty{margin:0}
.recherche-bar{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);
}
.recherche-icone{flex:0 0 auto;width:17px;height:17px;color:var(--pietra)}
.recherche-input{
  flex:1 1 auto;min-width:0;border:0;background:none;outline:0;padding:2px 0;
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.98rem;color:var(--ink);
}
.recherche-input::placeholder{color:var(--pietra)}
.recherche-input::-webkit-search-cancel-button{display:none}
.recherche-clear{
  flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:0;
  background:var(--rule-soft);color:var(--ink-soft);font-size:1.1rem;line-height:1;
  cursor:pointer;
}
.recherche-clear:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.recherche-compte{
  margin:0;padding:0 2px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
}
.card-match{
  margin:8px 0 0;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--rosso);
}
.planb-toggle{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:7px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:600;
  padding:10px 15px;border:1px solid var(--rosso);border-radius:999px;
  background:transparent;color:var(--rosso);cursor:pointer;
}
.planb-toggle[aria-pressed="true"]{background:var(--rosso);color:#fff}
.planb-toggle:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.detail-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.detail-toolbar .back{margin:22px 0 6px}

/* Plan B mis en avant : quand le mode est actif, le bloc remonte juste
   sous le bandeau de tête, avec un traitement plus appuyé qu'en place
   normale (bordure pleine + fond teinté au lieu du simple filet). */
.planb-avant{
  border:2px solid var(--rosso);background:rgba(178,58,46,.06);
  padding:16px 18px;margin:0 0 24px;
}
.planb-avant .eyebrow-planb{
  display:flex;align-items:center;gap:7px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rosso);font-weight:700;margin:0 0 10px;
}
.planb-avant .planb{border:0;background:none;padding:0;color:var(--ink)}

/* Plan B dans la carte de la liste : présent dans le DOM, révélé
   seulement quand le mode est actif (pas de re-rendu de la liste). */
.card-planb{
  display:none;margin:12px 0 0;padding-top:12px;
  border-top:1px dashed var(--rule);font-size:.88rem;color:var(--ink-soft);
}
.card-planb b{color:var(--rosso)}
body.mode-planb .card-planb{display:block}

/* ---------- frise du rythme ---------- */
.spine-block{padding:26px 0 20px;border-bottom:1px solid var(--rule)}
.spine-label{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--pietra);
  margin:0 0 12px;
}
.spine{
  display:flex;align-items:flex-end;gap:3px;height:92px;
  overflow-x:auto;padding:16px 0 20px;position:relative;
}
.spine::-webkit-scrollbar{height:4px}
.spine::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.tick{
  flex:1 1 auto;min-width:16px;position:relative;
  background:none;border:0;padding:0;cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;height:100%;
}
.tick .bar{
  width:100%;border-radius:1px;
  background:var(--lago-mid);opacity:.5;
  transition:opacity .18s ease,transform .18s ease;
}
.tick:hover .bar,.tick:focus-visible .bar{opacity:1;transform:scaleY(1.06);transform-origin:bottom}
.tick:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.tick[data-kind="nature"] .bar{background:var(--oliva)}
.tick[data-kind="ville"] .bar{background:var(--lago)}
.tick[data-kind="route"] .bar{background:var(--pietra)}
.tick[data-kind="lac"] .bar{background:var(--lago-mid)}
.tick[data-kind="evenement"] .bar{background:var(--sole);opacity:.9}
.tick .num{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--pietra);
  position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
}
.tick.star .bar{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ---------- filtres ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:7px;
  padding:20px 0 4px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:5;
  margin-bottom:0;
}
.filters::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:linear-gradient(var(--paper),rgba(243,241,234,0));pointer-events:none}
.filters button{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:7px 13px;margin-bottom:14px;
  border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--ink-soft);cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.filters button:hover{border-color:var(--ink);color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- liste des journées ---------- */
.pinned{padding:22px 0 4px;border-bottom:1px solid var(--rule)}
.pinned-label{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--rosso);
  margin:0 0 10px;font-weight:600;
}
.list{padding-top:4px}

.card{
  display:block;padding:18px 0 18px 14px;text-decoration:none;color:inherit;
  border-bottom:1px solid var(--rule-soft);
  border-left:3px solid transparent;
}
.card.hidden{display:none}
.card[data-kind="route"]{border-left-color:var(--cat-route)}
.card[data-kind="ville"]{border-left-color:var(--cat-ville)}
.card[data-kind="nature"]{border-left-color:var(--cat-nature)}
.card[data-kind="lac"]{border-left-color:var(--cat-lac)}
.card[data-kind="evenement"]{border-left-color:var(--cat-evenement)}
.card:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
.card .cdate{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--pietra);margin:0 0 6px;
}
/* repère "aujourd'hui" dans la liste : pastille discrète accolée à la
   date, réservée à #list (voir construireCarte) — la liste est le seul
   endroit du carnet qui ne sait pas déjà quel jour on est. */
.card-today-badge{
  display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:var(--rosso);
}
.card-today-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--rosso)}
/* pastille « Anniversaire » : même position que card-today-badge, mais
   dans la couleur de la catégorie evenement et avec sa propre icône SVG
   (voir ICONES.anniversaire) plutôt qu'un simple point. */
.card-anniversaire-badge{
  display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:var(--cat-evenement);
}
.card-anniversaire-badge .iico{width:11px;height:11px}
.card h3{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(1.3rem,3.6vw,1.6rem);line-height:1.15;
  font-weight:600;letter-spacing:-.006em;margin:0 0 5px;
}
.card.flag h3::after{content:" ★";color:var(--rosso);font-size:.62em;vertical-align:super}
.card.eclipse h3::after{content:" ◐";color:var(--sole);font-size:.7em}
.card .ctag{color:var(--ink-soft);font-size:.92rem;font-style:italic;margin:0 0 10px}
.card .cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.card .cdist{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);
}
.pinned .card{border-bottom:0;padding-top:0}

.kind{
  display:inline-block;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;color:#fff;
}
.kind.nature{background:var(--oliva)}
.kind.ville{background:var(--lago)}
.kind.route{background:var(--pietra)}
.kind.lac{background:var(--lago-mid)}
.kind.evenement{background:var(--sole)}

.chapter{margin:22px 0 0;padding:30px 0 4px;border-top:2px solid var(--ink)}
.chapter.hidden{display:none}
.chapter p{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(3rem,9vw,5rem);line-height:.85;letter-spacing:-.01em;
  color:var(--rosso);margin:0;font-weight:500;
}
.chapter h4{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:1.75rem;line-height:1.15;font-weight:600;margin:8px 0 0;
}

.panel-foot{
  margin-top:22px;padding-top:18px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.05em;color:var(--pietra);line-height:1.8;
}
.reinit-chasse{
  display:block;margin-top:12px;padding:0;border:0;background:none;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
  color:var(--pietra);text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.reinit-chasse:hover{color:var(--rosso)}
.reinit-chasse:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* ---------- à réserver : agrégation de pratique.reserver -------------- */
.reserve-list{padding-top:4px}
.reserve-card{
  display:grid;grid-template-columns:60px 1fr;gap:16px;align-items:start;
  padding:16px 0;text-decoration:none;color:inherit;
  border-bottom:1px solid var(--rule-soft);
}
.reserve-card:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
.reserve-date{display:flex;flex-direction:column;line-height:1}
.reserve-date .dow,.reserve-date .mois{
  font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--pietra);
}
.reserve-date .num{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:700;
  font-size:1.9rem;line-height:1;letter-spacing:-.01em;color:var(--ink);margin:2px 0;
}
.reserve-body h3{
  font-family:"Bodoni Moda",Georgia,serif;font-size:1.05rem;font-weight:600;
  line-height:1.2;margin:0 0 5px;color:var(--ink);
}
.reserve-body p{margin:0;font-size:.9rem;color:var(--ink-soft);line-height:1.5}

/* journées sans action : repliées, disclosure native, aucun JS de bascule */
.reserve-collapsed{margin-top:22px;padding-top:16px;border-top:2px solid var(--ink)}
.reserve-collapsed summary{
  cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;
  padding:4px 0;
}
.reserve-collapsed summary:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.reserve-collapsed[open] summary{margin-bottom:6px}
.reserve-collapsed .reserve-card{opacity:.68}

/* ---------- urgences : page austère, zones tactiles larges ---------- */
.urg-section{margin:0 0 34px}
.urg-section > h3{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--pietra);margin:0 0 14px;font-weight:600;
}
.urg-alerte{color:var(--rosso)}

/* 112 : premier élément de la page, sans avoir à faire défiler */
.urg-hero{margin:26px 0 36px;padding:24px 20px;border:2px solid var(--rosso)}
.urg-hero a{display:block;text-decoration:none}
.urg-hero .num{
  display:block;font-family:"Bodoni Moda",Georgia,serif;font-weight:700;
  font-size:clamp(3.6rem,20vw,5.2rem);line-height:.85;
  color:var(--rosso);letter-spacing:-.01em;
}
.urg-hero p{margin:12px 0 0;font-size:1rem;color:var(--ink-soft)}
.urg-hero b{color:var(--ink)}
.urg-hero a:focus-visible{outline:2px solid var(--rosso);outline-offset:4px}

/* ligne pleine largeur : numeros */
.urg-line{border-bottom:1px solid var(--rule-soft)}
.urg-line:last-child{border-bottom:0}
.urg-line-head{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:15px 0 6px;
  text-decoration:none;color:var(--ink);
}
.urg-line-head .n{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.4rem;
  color:var(--rosso);flex:0 0 auto;white-space:nowrap;
}
.urg-line-head.alerte .n{color:var(--rosso)}
.urg-line-head .l{font-size:1rem;flex:1 1 160px;min-width:0}
a.urg-line-head:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
.urg-line .urg-remark{margin:0 0 14px;font-size:.88rem;font-style:italic;color:var(--ink-soft)}

/* carte : veterinaires, consulaire, assuranceAuto */
.urg-card{padding:20px 0;border-bottom:1px solid var(--rule-soft)}
.urg-card:last-child{border-bottom:0}
.urg-card h4{font-size:1.08rem;margin:0 0 6px;font-weight:600}
.urg-card .meta{margin:0 0 4px;font-size:.92rem;color:var(--ink-soft)}
.urg-card .meta b{color:var(--ink);font-weight:600}
.urg-card .urg-remark{font-size:.9rem;font-style:italic;color:var(--ink-soft);margin:8px 0 0}

/* numéro en clair, tappable, gros caractères : lisible et recopiable */
.urg-tel{
  display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:1.3rem;color:var(--rosso);text-decoration:none;
  padding:8px 0;margin:0 0 4px;letter-spacing:.01em;
}
a.urg-tel:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

.urg-card .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.urg-card .actions a,.urg-card .actions .action{
  display:inline-flex;align-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:.88rem;font-weight:600;
  color:var(--ink);text-decoration:none;border:1px solid var(--rule);
  padding:12px 16px;
}
.urg-card .actions a:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.urg-card .actions .alerte{color:var(--rosso);border-color:var(--rosso)}

/* lignes secondaires dans une carte : lignes[] de assuranceAuto */
.urg-lignes{margin:10px 0 0}
.urg-subline{
  display:flex;flex-direction:column;gap:5px;
  padding:14px 0;border-top:1px solid var(--rule-soft);
  text-decoration:none;color:var(--ink);
}
.urg-subline .l{font-size:.92rem;font-weight:600}
.urg-subline .n{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.3rem;
  color:var(--rosso);letter-spacing:.01em;
}
.urg-subline .h{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-soft)}
.urg-subline:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}

/* documents : liste à cocher visuelle, non interactive */
.urg-check{list-style:none;margin:0;padding:0}
.urg-check li{
  position:relative;padding:11px 0 11px 30px;font-size:.94rem;color:var(--ink);
  border-bottom:1px solid var(--rule-soft);
}
.urg-check li:last-child{border-bottom:0}
.urg-check li::before{
  content:"☐";position:absolute;left:0;top:9px;color:var(--pietra);font-size:1.1rem;
}

/* mémo : en pied de panneau, nettement plus discret que les autres sections */
.urg-memo-wrap{margin-top:4px;padding-top:20px;border-top:2px solid var(--ink)}
.urg-memo-wrap > h3{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pietra);margin:0 0 10px;font-weight:600;
}
.urg-memo{list-style:none;margin:0;padding:0}
.urg-memo li{position:relative;padding:7px 0 7px 16px;font-size:.84rem;color:var(--pietra)}
.urg-memo li::before{content:"—";position:absolute;left:0}

/* ---------- journée (détail plein écran / onglet Aujourd'hui) ---------- */
.day{
  display:grid;grid-template-columns:1fr;gap:26px;
  padding:8px 0 38px;
}

/* bandeau de tête plein : seul bloc sombre du carnet (chantier 2).
   Fond profond selon la catégorie ; l'illustration (si présente) et le
   texte partagent le même bloc, le texte posé en réserve blanche dans
   la bande de ciel vide que laissent toujours les silhouettes. */
.hero{
  grid-column:1 / -1;position:relative;
  margin:0 -22px 24px;width:calc(100% + 44px);
  overflow:hidden;background:var(--cat-route-deep);
}
.day[data-kind="route"] .hero{background:var(--cat-route-deep)}
.day[data-kind="ville"] .hero{background:var(--cat-ville-deep)}
.day[data-kind="nature"] .hero{background:var(--cat-nature-deep)}
.day[data-kind="lac"] .hero{background:var(--cat-lac-deep)}
.day[data-kind="evenement"] .hero{background:var(--cat-evenement-deep)}
.hero-illu{display:block}
.hero-illu svg{display:block;width:100%;height:auto}
.hero-text{padding:26px 22px 22px}
.hero:not(.hero-flat) .hero-text{position:absolute;left:0;right:0;top:0}
.hero.hero-flat .hero-text{position:static}
.hero-date{
  display:flex;align-items:baseline;gap:10px;margin:0 0 6px;
}
.hero-date .dow,.hero-date .mon{
  font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75);
}
.hero-date .num{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:700;
  font-size:clamp(2.6rem,11vw,3.4rem);line-height:.9;letter-spacing:-.01em;
  color:#fff;
}
.hero-title{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(1.6rem,5.5vw,2.1rem);line-height:1.12;
  font-weight:600;letter-spacing:-.008em;margin:0;color:#fff;
}
.day.flag .hero-title::after{content:" ★";color:var(--rosso);font-size:.62em;vertical-align:super}
.day.eclipse .hero-title::after{content:" ◐";color:var(--sole);font-size:.7em}

.tagline{color:var(--ink-soft);font-size:.95rem;margin:0 0 20px;font-style:italic}

/* bandeau de synthèse : une ligne de métadonnées qui s'écoule (flex-wrap),
   pas une grille à colonnes fixes — une grille pensée pour 380px ne pouvait
   qu'étirer du vide une fois la page large. Chaque item (icône + texte
   courant) est de même niveau, séparé du suivant par un filet vertical
   fin ; la ligne s'arrête où le contenu s'arrête, aucun vide n'est
   possible par construction. Fond lavis (~8%) et filet gauche dans la
   couleur de catégorie du jour (mêmes cinq couleurs que .hero/.kind),
   conservés, avec un padding réduit puisqu'il n'y a plus qu'une ligne
   à loger en hauteur. */
.day-synth{
  margin:0 0 22px;padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;
  background:var(--cat-route-synth);border-left:3px solid var(--cat-route);
  font-size:.88rem;line-height:1.3;color:var(--ink);
}
.day[data-kind="route"] .day-synth{background:var(--cat-route-synth);border-left-color:var(--cat-route)}
.day[data-kind="ville"] .day-synth{background:var(--cat-ville-synth);border-left-color:var(--cat-ville)}
.day[data-kind="nature"] .day-synth{background:var(--cat-nature-synth);border-left-color:var(--cat-nature)}
.day[data-kind="lac"] .day-synth{background:var(--cat-lac-synth);border-left-color:var(--cat-lac)}
.day[data-kind="evenement"] .day-synth{background:var(--cat-evenement-synth);border-left-color:var(--cat-evenement)}

.day-synth-item{
  display:inline-flex;align-items:center;gap:5px;padding:0 10px;
  color:inherit;text-decoration:none;
}
.day-synth-item:first-child{padding-left:0}
.day-synth-item + .day-synth-item{border-left:1px solid var(--rule)}
.day-synth-item .iico{flex:0 0 auto;width:12px;height:12px;color:var(--pietra)}
.day-synth-sub{color:var(--ink-soft);margin-left:2px}

.day-synth-item.chien.facile{color:var(--oliva)}
.day-synth-item.chien.agerer{color:var(--sole)}
.day-synth-item.chien.difficile{color:var(--rosso)}
/* appui long secret (voir script) : pas de menu contextuel iOS sur l'icône */
.day-synth-item.chien{-webkit-touch-callout:none}

.day-synth-item.voir,.day-synth-item.reserver{
  font-weight:500;background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;
}
.day-synth-item.voir:focus-visible,.day-synth-item.reserver:focus-visible{
  outline:2px solid var(--rosso);outline-offset:2px;
}
.day-synth-item.ztl{color:var(--rosso);font-weight:600}
.day-synth-item.ztl .iico{color:var(--rosso)}
.day-synth-item.anniversaire{color:var(--cat-evenement);font-weight:600}
.day-synth-item.anniversaire .iico{color:var(--cat-evenement)}

.eclipse-disc{
  margin:4px 0 22px;padding:20px 0 8px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.eclipse-disc svg{display:block;width:100%;height:auto}
.eclipse-disc figcaption{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--pietra);text-align:center;margin-top:8px;
}

.block{margin:0 0 18px}
/* titre de section : niveau lecture (Bodoni, encre), pas niveau libellé.
   Écart asymétrique (32px au-dessus, 12 en dessous, via margin — le
   collapsing avec la marge du bloc précédent évite un double espace) :
   le titre doit se lire comme la porte d'entrée du bloc qui suit, pas
   comme une légende technique flottant entre deux blocs. */
.block > h3{
  /* flex-wrap:wrap + le trait en flex-basis:100% : quand le titre est
     court, tout tient sur une ligne et le trait la prolonge à droite ;
     quand le titre est trop long et retombe sur deux lignes (ex.
     "Alternatives au deuxième musée"), le trait — forcé sur sa propre
     ligne — passe proprement dessous au lieu de se retrouver écrasé en
     un moignon à côté de la première ligne seulement. */
  display:flex;flex-wrap:wrap;align-items:center;
  column-gap:9px;row-gap:6px;
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:1.15rem;font-weight:600;color:var(--ink);
  letter-spacing:-.006em;line-height:1.25;
  margin:32px 0 12px;
}
.block > h3 .iico{flex:0 0 auto;color:var(--pietra)}
.block > h3::after{
  content:"";flex:1 1 100%;height:1px;
  background:var(--pietra);
}
/* l'icône et le trait restent dans la couleur de catégorie ; le texte,
   lui, reste --ink quelle que soit la journée. */
.day[data-kind="route"] .block > h3 .iico{color:var(--cat-route)}
.day[data-kind="route"] .block > h3::after{background:var(--cat-route)}
.day[data-kind="ville"] .block > h3 .iico{color:var(--cat-ville)}
.day[data-kind="ville"] .block > h3::after{background:var(--cat-ville)}
.day[data-kind="nature"] .block > h3 .iico{color:var(--cat-nature)}
.day[data-kind="nature"] .block > h3::after{background:var(--cat-nature)}
.day[data-kind="lac"] .block > h3 .iico{color:var(--cat-lac)}
.day[data-kind="lac"] .block > h3::after{background:var(--cat-lac)}
.day[data-kind="evenement"] .block > h3 .iico{color:var(--cat-evenement)}
.day[data-kind="evenement"] .block > h3::after{background:var(--cat-evenement)}

.thread{list-style:none;margin:0;padding:0;border-left:2px solid var(--lago)}
.thread li{
  display:grid;grid-template-columns:64px 1fr;gap:14px;
  padding:0 0 13px 16px;font-size:.95rem;
}
.thread li:last-child{padding-bottom:0}
.thread .t{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
  color:var(--lago);padding-top:3px;letter-spacing:.02em;
}
/* ligne verticale du fil horodaté : teintée par la catégorie du jour */
.day[data-kind="route"] .thread{border-left-color:var(--cat-route)}
.day[data-kind="route"] .thread .t{color:var(--cat-route)}
.day[data-kind="ville"] .thread{border-left-color:var(--cat-ville)}
.day[data-kind="ville"] .thread .t{color:var(--cat-ville)}
.day[data-kind="nature"] .thread{border-left-color:var(--cat-nature)}
.day[data-kind="nature"] .thread .t{color:var(--cat-nature)}
.day[data-kind="lac"] .thread{border-left-color:var(--cat-lac)}
.day[data-kind="lac"] .thread .t{color:var(--cat-lac)}
.day[data-kind="evenement"] .thread{border-left-color:var(--cat-evenement)}
.day[data-kind="evenement"] .thread .t{color:var(--cat-evenement)}

/* le fil sait quelle heure il est (jour courant uniquement) : étapes
   passées atténuées, étape en cours mise en évidence, repère "maintenant"
   inséré à la bonne position — avant la première étape, entre deux, ou
   après la dernière selon l'heure. */
.thread li.passee{opacity:.45}
.thread li.encours .t{color:var(--rosso);font-weight:700}
.thread li.encours span:last-child{color:var(--ink);font-weight:600}
.thread li.now-marker{padding-bottom:8px}
.thread li.now-marker .t{
  color:var(--rosso);font-size:1rem;line-height:1;padding-top:2px;
}
.thread li.now-marker .now-label{
  display:flex;align-items:center;gap:8px;padding-top:3px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rosso);font-weight:700;
}
.thread li.now-marker .now-label::after{content:"";flex:1 1 auto;height:1px;background:var(--rosso)}

.opts{list-style:none;margin:0;padding:0;font-size:.93rem}
.opts li{padding:0 0 7px 20px;position:relative;color:var(--ink-soft)}
.opts li::before{
  content:"+";position:absolute;left:2px;top:0;
  font-family:"IBM Plex Mono",monospace;color:var(--oliva);font-weight:600;
}
.opts b{color:var(--ink);font-weight:600}

/* pratique du jour : grille libellé/valeur compacte, juste après le fil */
.pratique{
  display:grid;grid-template-columns:auto 1fr;gap:7px 16px;align-items:center;
  margin:0 0 18px;padding:14px 16px;
  background:var(--card);border:1px solid var(--rule);font-size:.88rem;
}
.pratique dt{
  display:flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
}
.pratique dt .iico{flex:0 0 auto}
.pratique dd{margin:0;color:var(--ink)}
.pratique-chien{
  display:inline-flex;align-items:center;gap:5px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:2px;color:#fff;
}
.pratique-chien.facile{background:var(--oliva)}
.pratique-chien.agerer{background:var(--sole)}
.pratique-chien.difficile{background:var(--rosso)}

/* où manger : déjeuner/dîner côte à côte (empilés sous 480 px), le plat
   local à part en pied de bloc, mêmes libellés petites capitales mono
   que pratique. */
.manger-repas{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 14px;
}
@media(max-width:480px){
  .manger-repas{grid-template-columns:1fr}
}
.manger-repas-item{
  padding:14px 16px;background:var(--card);border:1px solid var(--rule);
}
.manger-repas-label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;
}
.manger-nom{font-size:.98rem;font-weight:600;color:var(--ink);margin:0}
.manger-ou{font-size:.8rem;color:var(--ink-soft);margin:3px 0 0}
.manger-tel{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.8rem;
  color:var(--rosso);text-decoration:none;margin:7px 0 0;
}
.manger-tel:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.manger-note{font-size:.84rem;color:var(--ink-soft);line-height:1.5;margin:7px 0 0}
.manger-plat-label{
  display:flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 5px;
}
.manger-plat-texte{font-size:.9rem;color:var(--ink);margin:0 0 12px}
.manger-avertissement{font-size:.78rem;color:var(--pietra);line-height:1.5;margin:0}

/* liens de navigation : petites puces tactiles sous pratique, chacune
   ouvrant Plans dans un nouvel onglet. Facultatif — voir donnees.js. */
.carte-liens{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}
.carte-puce{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600;
  padding:11px 15px;border:1px solid var(--rule);border-radius:999px;
  color:var(--ink);text-decoration:none;
}
.carte-puce .iico{flex:0 0 auto;color:var(--pietra)}
.carte-puce:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* sur place : fiches de lieu, accordéon replié par défaut. Le nom et le
   bouton Maps restent accessibles sans déplier — c'est le geste le plus
   fréquent en marchant, voir construireItemLieu. Jusqu'à dix fiches par
   journée : rangées compactes une fois repliées pour ne pas devenir un mur
   (voir donnees.js, champ lieux). */
.lieu-liste{display:flex;flex-direction:column}
.lieu-item{border-bottom:1px solid var(--rule-soft)}
.lieu-item:last-child{border-bottom:0}
.lieu-head{display:flex;align-items:stretch;gap:2px}
.lieu-nom-btn{
  flex:1 1 auto;display:flex;align-items:center;gap:9px;min-width:0;
  min-height:44px;padding:8px 4px 8px 0;
  background:none;border:0;text-align:left;cursor:pointer;
  font-family:inherit;font-size:.98rem;font-weight:600;color:var(--ink);
}
.lieu-nom-btn:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.lieu-chevron{flex:0 0 auto;width:14px;height:14px;color:var(--pietra);transition:transform .2s ease}
.lieu-item.open .lieu-chevron{transform:rotate(180deg)}
.lieu-nom{min-width:0}
.lieu-maps{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  min-height:44px;padding:0 6px 0 10px;
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;
  letter-spacing:.02em;color:var(--pietra);text-decoration:none;
}
.lieu-maps:hover,.lieu-maps:focus-visible{color:var(--rosso)}
.lieu-maps:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.lieu-maps .iico{flex:0 0 auto}
/* dépliage : même technique grid-template-rows 0fr→1fr que .chasse-jour-
   collapse, ici appliquée par fiche plutôt que par journée entière. */
.lieu-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.lieu-item.open .lieu-collapse{grid-template-rows:1fr}
.lieu-collapse-inner{overflow:hidden;min-height:0;padding-top:0;transition:padding-top .25s ease}
.lieu-item.open .lieu-collapse-inner{padding-top:0;padding-bottom:14px}
/* corps identique au fil de la journée (.thread li, .95rem) : c'est le
   même texte lu en plein soleil, il ne doit pas paraître secondaire. */
.lieu-quoi{font-size:.95rem;line-height:1.7;color:var(--ink);margin:0 0 8px}
.lieu-pratique{font-size:.85rem;line-height:1.6;color:var(--ink-soft);margin:0}

/* à regarder : contenu de lecture, pas une liste technique — on lui
   donne de l'air (grand interligne, respiration entre les entrées).
   Chasse au trésor : chaque entrée est cochable (case custom sur un
   <input> réel, masqué mais toujours focusable/tactile — voir
   .regarder-checkbox), état conservé en localStorage. */
.regarder-progress{
  height:4px;border-radius:2px;overflow:hidden;
  background:var(--rule-soft);margin:0 0 6px;
}
.regarder-progress-bar{
  height:100%;width:0;background:var(--lago);transition:width .2s ease;
}
.day[data-kind="route"] .regarder-progress-bar{background:var(--cat-route)}
.day[data-kind="ville"] .regarder-progress-bar{background:var(--cat-ville)}
.day[data-kind="nature"] .regarder-progress-bar{background:var(--cat-nature)}
.day[data-kind="lac"] .regarder-progress-bar{background:var(--cat-lac)}
.day[data-kind="evenement"] .regarder-progress-bar{background:var(--cat-evenement)}
.regarder-progress-label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px;
}

.regarder-item{
  display:flex;align-items:flex-start;gap:12px;margin:0 0 22px;cursor:pointer;
}
.regarder-item:last-child{margin-bottom:0}
.regarder-checkbox{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;
}
.regarder-box{
  flex:0 0 auto;width:19px;height:19px;margin-top:4px;position:relative;
  border:1.5px solid var(--pietra);border-radius:3px;background:var(--paper);
  transition:background .15s ease,border-color .15s ease;
}
.regarder-box::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);
  opacity:0;transition:opacity .1s ease;
}
.regarder-checkbox:checked + .regarder-box{background:var(--lago);border-color:var(--lago)}
.regarder-checkbox:checked + .regarder-box::after{opacity:1}
.regarder-checkbox:focus-visible + .regarder-box{outline:2px solid var(--rosso);outline-offset:2px}
.regarder-content{flex:1 1 auto;min-width:0}
.regarder-item.checked .ou{opacity:.6}
.regarder-item.checked .quoi{color:var(--pietra)}
.regarder-item .ou{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lago);margin:0 0 6px;
}
.regarder-item .quoi{font-size:1rem;line-height:1.75;color:var(--ink);margin:0}
/* points de l'entrée : discret, à peine plus voyant que le libellé —
   assez visible pour savoir ce qu'elle vaut avant de la chercher, pas
   assez pour rivaliser avec le texte de lecture. */
.regarder-pts{color:var(--pietra);letter-spacing:.04em;font-weight:500}
.regarder-item.checked .regarder-pts{color:var(--pietra)}
/* mode public : « À regarder » reste lisible, mais n'est plus une case à
   cocher — la case (masquée + custom) disparaît, le contenu reprend
   toute la largeur. */
body.mode-public .regarder-checkbox,
body.mode-public .regarder-box{display:none}
body.mode-public .regarder-item{cursor:default}

/* quiz : réponse modifiable librement tant que la question n'est pas
   corrigée (voir choisirReponseQuiz), donc pas de case à décocher comme
   .regarder-item — un bouton par choix, désactivé seulement après
   correction. Les couleurs bonne/mauvaise n'apparaissent qu'après
   correction (mot de passe), jamais avant. */
.quiz-item{margin:0 0 26px}
.quiz-item:last-child{margin-bottom:0}
/* une fois corrigée, la question perd ses boutons et son interaction :
   elle n'a plus besoin de l'espace d'une zone tactile. .corrige retombe
   à une ligne dense (voir .quiz-compact) séparée de la suivante par un
   filet plutôt que par une marge, pour tenir plusieurs questions
   corrigées sur un écran de téléphone. */
.quiz-item.corrige{margin:0}
.quiz-item.corrige + .quiz-item.corrige{border-top:1px dashed var(--rule)}
.quiz-question{font-size:1rem;line-height:1.5;color:var(--ink);margin:0 0 12px;font-weight:500}
.quiz-choix{display:flex;flex-direction:column;gap:8px}
.quiz-choix-item{
  text-align:left;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.92rem;
  line-height:1.4;padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;
  background:var(--paper);color:var(--ink);cursor:pointer;
}
.quiz-choix-item:hover:not(:disabled){border-color:var(--ink)}
.quiz-choix-item:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.quiz-choix-item:disabled{cursor:default}
.quiz-choix-item.choisi{border-color:var(--lago);background:var(--cat-ville-light)}
.quiz-choix-item.bonne{
  border-color:var(--oliva);font-weight:600;
  background:color-mix(in srgb, var(--oliva) 14%, var(--paper) 86%);
}
.quiz-choix-item.mauvaise{border-color:var(--rosso);background:rgba(178,58,46,.08)}

/* question corrigée, état compact : un bouton pleine largeur (repli/
   dépli, voir quizDeplies) plutôt qu'une ligne inerte, pour rester
   réversible sans ajouter d'élément séparé. */
.quiz-compact{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:8px 0;margin:0;cursor:pointer;font:inherit;color:inherit;
}
.quiz-compact:hover .quiz-compact-question{color:var(--rosso)}
.quiz-compact:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.quiz-compact-question{
  display:block;font-size:.86rem;line-height:1.3;color:var(--ink);margin:0 0 3px;
}
.quiz-resume{
  margin:0;font-family:"IBM Plex Mono",monospace;font-size:.78rem;line-height:1.3;letter-spacing:.02em;
}
.quiz-resume .mauvaise{color:var(--rosso);text-decoration:line-through;text-decoration-color:rgba(178,58,46,.5)}
.quiz-resume .bonne{color:var(--oliva);font-weight:600}
.quiz-resume .fleche{color:var(--pietra)}
/* relecture : les trois propositions réapparaissent, verrouillées, sous
   le même bouton compact — pas de bloc titre séparé. */
.quiz-choix-lecture{margin-top:10px}
.quiz-choix-lecture .quiz-choix-item{cursor:default}

/* compteur d'en-tête : même facture que .regarder-progress-label —
   mono, petit, discret — posé à côté du titre « Quiz » une fois la
   journée corrigée. */
.quiz-compteur{
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.03em;
  color:var(--ink-soft);font-weight:400;
}
.quiz-pied{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;
}
.quiz-score{margin:0;font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-soft)}

/* boîte de mot de passe de l'accès famille — la correction du quiz, elle,
   se fait à distance (admin/) : plus de boîte de mot de passe par journée
   dans le carnet lui-même, voir demarrerCarnet ci-dessous. */
.famille-pw-overlay{
  position:fixed;inset:0;z-index:60;background:rgba(26,26,24,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.famille-pw-boite{
  width:100%;max-width:340px;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:10px;padding:22px;
  box-shadow:0 12px 32px rgba(26,26,24,.25);
}
.famille-pw-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px}
.famille-pw-titre{margin:0;font-size:.95rem;line-height:1.4}
.famille-pw-fermer{
  flex:none;width:30px;height:30px;margin:-5px -5px 0 0;padding:0;border:0;
  border-radius:6px;background:none;color:var(--pietra);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.famille-pw-fermer .iico{width:15px;height:15px}
.famille-pw-fermer:hover{color:var(--rosso)}
.famille-pw-fermer:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.famille-pw-champ{
  display:flex;align-items:center;gap:4px;border:1.5px solid var(--rule);
  border-radius:8px;padding:0 4px 0 12px;background:var(--paper);
}
.famille-pw-champ:focus-within{border-color:var(--ink)}
.famille-pw-input{
  flex:1;min-width:0;border:0;background:none;outline:none;
  font-family:"IBM Plex Mono",monospace;font-size:.95rem;color:var(--ink);padding:11px 0;
}
.famille-pw-oeil{
  flex:none;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;padding:0;border:0;border-radius:6px;
  background:none;color:var(--pietra);cursor:pointer;
}
.famille-pw-oeil:hover{color:var(--ink)}
.famille-pw-oeil:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}
.famille-pw-oeil.actif{color:var(--rosso)}
.famille-pw-erreur{
  margin:10px 0 0;font-family:"IBM Plex Mono",monospace;font-size:.78rem;
  color:var(--rosso);
}
.famille-pw-actions{display:flex;justify-content:flex-end;margin-top:16px}
.famille-pw-valider{
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.04em;
  padding:9px 14px;border-radius:6px;cursor:pointer;
  background:var(--ink);border:1.5px solid var(--ink);color:var(--paper);
}
.famille-pw-valider:hover{background:var(--rosso);border-color:var(--rosso)}
.famille-pw-valider:disabled{opacity:.6;cursor:default}
.famille-pw-valider:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

.planb{
  background:var(--card);border-left:2px solid var(--pietra);
  padding:12px 16px;font-size:.92rem;color:var(--ink-soft);
}
.planb b{color:var(--ink)}

.note{
  border-left:2px solid var(--rosso);padding:11px 16px;
  font-size:.88rem;color:var(--ink-soft);background:rgba(178,58,46,.045);
  margin-bottom:10px;
}
.note:last-child{margin-bottom:0}
.note b{color:var(--rosso)}
.note.sun{border-color:var(--sole);background:rgba(156,122,46,.07)}
.note.sun b{color:#72591F}

.dog{
  display:inline-block;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--oliva);border:1px solid rgba(103,121,79,.4);
  padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:2px;
}

/* ---------- vue détail plein écran ---------- */
.detail{
  position:fixed;inset:0;z-index:15;
  background:var(--paper);overflow-y:auto;
  visibility:hidden;transform:translateX(100%);
  transition:transform .25s ease;
}
.detail.open{visibility:visible;transform:translateX(0)}
.detail:not(.open){pointer-events:none}
.back{
  display:inline-flex;align-items:center;gap:6px;
  margin:22px 0 6px;padding:8px 4px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;color:var(--ink-soft);cursor:pointer;
}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* navigation séquentielle : barre fine sticky, ancrée juste au-dessus de
   la barre d'onglets (voir .footer-stack ci-dessous). Un seul
   emplacement pour ce contrôle — plus de doublon en bas de contenu.
   Visible uniquement en vue détail : basculé par ouvrirDetail() /
   fermerDetail() dans le script, via l'attribut hidden. Fond teinté de
   la couleur de catégorie de la journée courante (data-kind, même
   convention que .day/.card), pour se distinguer de la barre d'onglets
   sans entrer en concurrence avec elle. */
.day-nav-sticky{
  display:flex;height:46px;flex:none;
  border-top:2px solid var(--ink);
  background:var(--paper-deep);
}
.day-nav-sticky[hidden]{display:none}
.day-nav-sticky[data-kind="route"]{background:var(--cat-route-synth)}
.day-nav-sticky[data-kind="ville"]{background:var(--cat-ville-synth)}
.day-nav-sticky[data-kind="nature"]{background:var(--cat-nature-synth)}
.day-nav-sticky[data-kind="lac"]{background:var(--cat-lac-synth)}
.day-nav-sticky[data-kind="evenement"]{background:var(--cat-evenement-synth)}
.day-nav-sticky-link{
  flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;
  padding:0 16px;text-decoration:none;color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.day-nav-sticky-next{justify-content:flex-end;text-align:right}
.day-nav-sticky-link:hover{color:var(--rosso)}
.day-nav-sticky-link:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
.day-nav-sticky-link[aria-disabled="true"]{color:var(--pietra)}

/* ---------- pied fixe : barre séquentielle + barre d'onglets empilées.
   La hauteur de la barre d'onglets n'est jamais calculée en dur : c'est
   l'empilement flex qui s'en charge. Seule la barre d'onglets (dernier
   élément) porte le safe-area-inset-bottom, pour ne jamais le compter
   deux fois. */
.footer-stack{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;
  box-shadow:0 -12px 20px -16px rgba(26,26,24,.4);
  /* iOS Safari détache parfois les éléments position:fixed pendant le
     scroll inertiel (ils défilent avec la page puis se recalent) faute
     d'être sur leur propre calque de composition. On force ce calque. */
  -webkit-transform:translateZ(0);transform:translateZ(0);
  will-change:transform;
}

/* ---------- bannière d'installation (iOS Safari, hors mode autonome) ----
   Discrète, empilée au-dessus de la barre d'onglets dans .footer-stack ;
   sa hauteur réelle (variable selon le retour à la ligne du texte) est
   mesurée en JS et reportée dans --install-banner-h pour que .panel et
   .detail-inner dégagent la place nécessaire (voir --tabbar-clear). */
.install-banner{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--rule);
}
.install-banner[hidden]{display:none}
.install-banner-icone{flex:0 0 auto;width:18px;height:18px;color:var(--pietra)}
.install-banner-icone svg{display:block;width:18px;height:18px}
.install-banner-txt{
  flex:1 1 auto;margin:0;font-size:.78rem;line-height:1.35;color:var(--ink-soft);
}
.install-banner-txt b{color:var(--ink);font-weight:600}
.install-banner-fermer{
  flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:0;
  background:none;color:var(--pietra);font-size:1.15rem;line-height:1;cursor:pointer;
}
.install-banner-fermer:hover{color:var(--rosso)}
.install-banner-fermer:focus-visible{outline:2px solid var(--rosso);outline-offset:2px}

/* ---------- barre d'onglets ---------- */
.tabbar{
  display:flex;background:var(--paper);
  border-top:2px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar a{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-decoration:none;color:var(--ink-soft);
  padding:10px 2px 9px;
}
.tab-ico{
  display:flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:9px;
  transition:background .15s ease;
}
.tab-ico svg{width:21px;height:21px;display:block}
.tab-lbl{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.02em;text-transform:uppercase;line-height:1.15;
  white-space:nowrap;
}
.tabbar a[aria-current="page"]{color:var(--rosso)}
.tabbar a[aria-current="page"] .tab-ico{background:rgba(178,58,46,.13)}
.tabbar a[aria-current="page"] .tab-lbl{font-weight:600}
.tabbar a:focus-visible{outline:2px solid var(--rosso);outline-offset:-2px}
/* mode public : deux onglets seulement — Accueil et Agenda. Les trois
   autres liens disparaissent ; flex:1 1 0 sur .tabbar a rééquilibre
   seul la largeur des deux restants, aucune règle de mise en page
   supplémentaire nécessaire. */
body.mode-public .tabbar a[data-tab="chasse"],
body.mode-public .tabbar a[data-tab="reserver"],
body.mode-public .tabbar a[data-tab="urgences"]{display:none}

/* ---------- colophon : mention finale, esprit marque d'imprimeur ---------
   Un seul exemplaire dans la page, placé après tous les <section class="panel">
   et avant .footer-stack. Comme un seul panel est visible à la fois (les
   autres portent [hidden]), ce colophon unique apparaît naturellement en bas
   du panel actif, quel que soit l'onglet — pas besoin de le dupliquer dans
   chaque panel ni d'y toucher depuis les fonctions de rendu JS. Visible en
   mode public comme en mode famille.
   padding-bas : dégage seulement la barre d'onglets elle-même (~63px), pas
   var(--tabbar-clear) — ce jeton inclut la nav séquentielle (46px de plus)
   qui n'existe que dans la vue détail, jamais derrière le colophon. Reprendre
   var(--tabbar-clear) ici créait un vide visible d'une soixantaine de pixels
   entre le texte et la barre, même une fois scrollé tout en bas. */
.colophon{
  max-width:960px;margin:0 auto;text-align:center;
  padding:8px 22px calc(70px + var(--install-banner-h, 0px) + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);
}
.colophon-marque{
  display:inline-block;vertical-align:baseline;
  width:18px;height:18px;margin:0 6px 0 0;color:var(--pietra);
}
.colophon-marque svg{display:block;width:100%;height:100%}
.colophon-texte{
  margin:0;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--pietra);
}
.colophon-pt{margin:0 6px}
.colophon-saut{display:none}
@media(max-width:480px){
  .colophon-texte{line-height:1.9}
  .colophon-pt{display:none}
  .colophon-saut{display:block}
}

@media(max-width:680px){
  .day{grid-template-columns:1fr;gap:14px;padding:4px 0 30px}
  .thread li{grid-template-columns:52px 1fr;gap:10px}
  .filters{position:static}
}

/* ---------- easter eggs (non annoncés — voir script) ---------- */
/* mode éclipse : couche superposée à toute l'app, jamais aux variables de
   couleur — voir declencherEclipseCachee(). Écartée du clic (pointer-events
   none) pour que l'appli reste utilisable pendant l'effet. */
.eclipse-cachee-overlay{
  position:fixed;inset:0;z-index:35;pointer-events:none;
  backdrop-filter:brightness(1) saturate(1);
  -webkit-backdrop-filter:brightness(1) saturate(1);
}

/* chihuahua caché : silhouette qui traverse le bas de l'écran, au-dessus de
   .footer-stack (barre d'onglets + nav séquentielle) — z-index supérieur,
   décalage vertical calculé en JS sur la hauteur réelle de .footer-stack
   (voir declencherChihuahuaCache) puisqu'elle varie selon le contexte
   (nav séquentielle visible ou non, bannière d'installation). */
.chihuahua-cache{
  position:fixed;left:0;bottom:64px;
  z-index:22;width:130px;height:61px;pointer-events:none;
}
.chihuahua-cache svg{display:block;width:100%;height:100%}

/* côte de baleine cachée : suspendue en haut de l'écran, centrée — voir
   declencherCoteDeBaleine(). Comme .eclipse-cachee-overlay, écartée du
   clic pour ne jamais gêner le reste de l'interface pendant l'effet. */
.baleine-cachee{
  position:fixed;left:50%;top:0;margin-left:-30px;
  z-index:22;width:60px;height:100px;pointer-events:none;
  transform:translateY(-120%);transform-origin:top center;
}
.baleine-cachee svg{display:block;width:100%;height:100%}
</style>
</head>
<body>

<section class="panel" id="panel-aujourdhui" data-panel="aujourdhui" hidden></section>

<section class="panel" id="panel-jours" data-panel="jours" hidden>
  <header class="masthead">
    <p class="eyebrow" id="c-eyebrow"></p>
    <h1 id="c-titre"></h1>
    <p class="sub" id="c-sous"></p>
  </header>

  <div class="jours-outils" id="jours-outils">
    <div class="recherche-bar">
      <svg class="recherche-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="20" y2="20"/></svg>
      <input type="search" id="recherche-input" class="recherche-input" placeholder="Rechercher…" aria-label="Rechercher dans les journées" autocomplete="off">
      <button type="button" id="recherche-clear" class="recherche-clear" aria-label="Effacer la recherche" hidden>×</button>
    </div>
    <p class="recherche-compte" id="recherche-compte" hidden></p>
  </div>

  <section class="spine-block">
    <p class="spine-label" id="c-frise-legende"></p>
    <div class="spine" id="spine"></div>
  </section>

  <nav class="filters" id="filters" aria-label="Filtrer les journées"></nav>

  <div id="pinned-today"></div>

  <div class="list" id="list"></div>
</section>

<section class="panel" id="panel-chasse" data-panel="chasse" hidden></section>

<section class="panel" id="panel-reserver" data-panel="reserver" hidden></section>

<section class="panel" id="panel-urgences" data-panel="urgences" hidden></section>

<footer class="colophon">
  <p class="colophon-texte"><span class="colophon-marque" id="colophon-marque" aria-hidden="true"></span>Fait maison par Papa<span class="colophon-pt">·</span><br class="colophon-saut">Relu par Réglisse · Été 2026</p>
</footer>

<section class="detail" id="detail" aria-hidden="true">
  <div class="detail-inner" id="detail-inner"></div>
</section>

<div class="footer-stack">
  <div class="install-banner" id="install-banner" hidden>
    <span class="install-banner-icone" aria-hidden="true"></span>
    <p class="install-banner-txt">Ajoutez ce carnet à l'écran d'accueil : appuyez sur <b>Partager</b>, puis <b>Sur l'écran d'accueil</b>.</p>
    <button type="button" class="install-banner-fermer" id="install-banner-fermer" aria-label="Fermer ce message">×</button>
  </div>

  <nav class="day-nav-sticky" id="day-nav-sticky" aria-label="Navigation entre les journées" hidden></nav>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <a href="#aujourdhui" data-tab="aujourdhui">
      <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></span>
      <span class="tab-lbl">Accueil</span>
    </a>
    <a href="#jours" data-tab="jours">
      <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V9M12 19V5M18 19v-7"/></svg></span>
      <span class="tab-lbl">Agenda</span>
    </a>
    <a href="#chasse" data-tab="chasse">
      <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6.2"/><path d="M8.6 14.5 6.5 21l5.5-2.6L17.5 21l-2.1-6.5"/></svg></span>
      <span class="tab-lbl">Chasse</span>
