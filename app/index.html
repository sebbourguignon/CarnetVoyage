  /* --- onglet Accueil -------------------------------------------------- */
  function joursEntre(a, b){
    var A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((B - A) / 86400000);
  }

  /* --- le voyage en chiffres : tout calculé depuis JOURS, rien d'écrit
     en dur. --------------------------------------------------------- */
  /* jours à Salò : pas de champ dédié dans le schéma des journées — le
     deuxième repère de chapitre ("Chapitre II — Quatorze jours autour du
     lac", voir donnees.js) délimite exactement la période sans changement
     d'hébergement, le troisième marque son terme. Se déduit donc des
     séparateurs de chapitre déjà posés, sans donnée nouvelle. */
  function joursAuLac(){
    var salo = plageSalo();
    return salo ? salo.fin - salo.debut : 0;
  }
  function formatNombre(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  /* seuls les rail1 au format exact "NNN km" comptent — "Sur place",
     "10 min", "Bassin sud" sont ignorés plutôt que devinés. */
  function kmCumules(){
    var total = 0;
    JOURS.forEach(function(j){
      var m = /^(\d+)\s*km$/.exec(String(j.rail1 || "").trim());
      if(m) total += parseInt(m[1], 10);
    });
    return total;
  }
  /* haltes : les journées de transfert, repérées par la flèche de leur
     titre ("Rueil-Malmaison → Lyon"...) — six, comme le trajet du carnet.
     Appelée "haltes" plutôt que "étapes" dans le libellé affiché : le mot
     désigne déjà les étapes horodatées du fil ailleurs dans l'appli. */
  function nombreEtapes(){
    return JOURS.filter(function(j){ return /→/.test(j.titre || ""); }).length;
  }
  function nombreChosesAVoir(){
    return JOURS.reduce(function(a, j){ return a + (j.regarder ? j.regarder.length : 0); }, 0);
  }
  function construireChiffreVoyage(n, libelle){
    var cell = el("div", "accueil-chiffre");
    cell.appendChild(el("p", "n", String(n)));
    cell.appendChild(el("p", "l", libelle));
    return cell;
  }

  /* --- easter egg : le compteur ------------------------------------------
     Appui sur le nombre de km cumulés (lui seul, pas les quatre autres
     chiffres) : le nombre défile de 0 jusqu'à sa valeur réelle en ~2 s,
     ralenti sur la fin. La largeur de la cellule est figée avant de lancer
     le décompte : le nombre garde son séparateur de milliers (formatNombre)
     à chaque image, mais sa largeur affichée varie quand même avec le
     nombre de chiffres (0, 12, 3 905...) — sans quoi cette variation ferait
     tressauter toute la rangée pendant l'animation. Ignoré tant qu'un
     décompte est déjà en cours pour cette cellule. */
  var compteurKmEnCours = false;
  function declencherCompteurKm(cellule, nombreEl, valeurFinale){
    if(compteurKmEnCours) return;
    compteurKmEnCours = true;

    cellule.style.width = cellule.getBoundingClientRect().width + "px";

    var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var duree = reduit ? 1 : 800;
    var depart = null;

    function image(horodatage){
      if(depart === null) depart = horodatage;
      var t = Math.min(1, (horodatage - depart) / duree);
      var progres = 1 - Math.pow(1 - t, 3);
      nombreEl.textContent = formatNombre(Math.round(progres * valeurFinale));
      if(t < 1){
        requestAnimationFrame(image);
      } else {
        cellule.style.width = "";
        compteurKmEnCours = false;
      }
    }
    requestAnimationFrame(image);
  }

  function construireChiffresVoyage(){
    var grid = el("div", "accueil-chiffres");
    grid.appendChild(construireChiffreVoyage(JOURS.length, "jours"));

    var kmTotal = kmCumules();
    var celluleKm = construireChiffreVoyage(formatNombre(kmTotal), "km cumulés");
    var nombreKm = celluleKm.querySelector(".n");
    nombreKm.addEventListener("click", function(){ declencherCompteurKm(celluleKm, nombreKm, kmTotal); });
    grid.appendChild(celluleKm);

    grid.appendChild(construireChiffreVoyage(joursAuLac(), "jours à Salò"));
    grid.appendChild(construireChiffreVoyage(nombreEtapes(), "haltes"));
    grid.appendChild(construireChiffreVoyage(nombreChosesAVoir(), "choses à voir"));
    return grid;
  }

  /* --- chasse au trésor : synthèse compacte sur l'accueil, tactile,
     menant à l'onglet Chasse — score dominant, jauge de progression avec
     seuils de badges, aperçu des badges débloqués (ou des trois premiers
     en silhouette si aucun ne l'est encore). Le contenu complet (score,
     badges, partage, réinitialisation) vit dans l'onglet Chasse, voir
     construireBlocChasseComplet plus bas. */
  function construireResumeChasseAccueil(){
    var a = document.createElement("a");
    a.className = "accueil-chasse-resume";
    a.id = "accueil-chasse-resume";
    a.href = "#chasse";
    a.appendChild(el("p", "accueil-chasse-resume-tete", ICONES.regarder + " Chasse au trésor"));
    a.appendChild(el("p", "accueil-chasse-resume-score"));
    a.appendChild(el("p", "accueil-chasse-resume-detail"));
    a.appendChild(el("div", "accueil-chasse-resume-jauge"));
    a.appendChild(el("div", "accueil-chasse-resume-prochain"));
    var badges = el("div", "accueil-chasse-resume-badges");
    badges.appendChild(el("div", "accueil-chasse-resume-badges-icones"));
    badges.appendChild(el("span", "accueil-chasse-resume-badges-texte"));
    a.appendChild(badges);
    majResumeChasseAccueil(a);
    return a;
  }
  function majResumeChasseAccueil(wrap){
    wrap = wrap || document.getElementById("accueil-chasse-resume");
    if(!wrap) return;
    var total = ENTREES_REGARDER.length;
    var coches = ENTREES_REGARDER.filter(function(e){ return estCoche(e.id); }).length;
    var obtenus = BADGES.filter(function(b){ return badgeObtenu(b, etatRegarder); });
    var pts = scoreTotal();
    var max = scoreMaximum();

    wrap.querySelector(".accueil-chasse-resume-score").innerHTML =
      pts + ' <span class="sur">sur ' + max + "</span>";
    wrap.querySelector(".accueil-chasse-resume-detail").textContent =
      coches + " / " + total + " objectifs · " + obtenus.length + (obtenus.length === 1 ? " badge sur " : " badges sur ") + BADGES.length;

    var jauge = wrap.querySelector(".accueil-chasse-resume-jauge");
    jauge.innerHTML = "";
    var remplissage = el("div", "accueil-chasse-resume-jauge-remplissage");
    remplissage.style.width = (max > 0 ? Math.min(100, pts / max * 100) : 0) + "%";
    jauge.appendChild(remplissage);

    var proches = badgesParProximite(etatRegarder);
    var prochain = wrap.querySelector(".accueil-chasse-resume-prochain");
    prochain.innerHTML = "";
    if(proches.length > 0){
      var cible = proches[0];
      var fabriqueIconeCible = ICONES_BADGE[cible.badge.icone];
      prochain.appendChild(el("p", "accueil-chasse-resume-prochain-label", "Prochain badge"));
      var corps = el("div", "accueil-chasse-resume-prochain-corps");
      corps.appendChild(el("span", "accueil-chasse-resume-prochain-icone",
        fabriqueIconeCible ? fabriqueIconeCible() : ICONES.badge));
      var texte = el("div", "accueil-chasse-resume-prochain-texte");
      texte.appendChild(el("p", "accueil-chasse-resume-prochain-nom", cible.badge.nom));
      texte.appendChild(el("p", "accueil-chasse-resume-prochain-reste", texteRestantesBadge(cible.badge, cible.restantes)));
      corps.appendChild(texte);
      prochain.appendChild(corps);
    }

    var iconesWrap = wrap.querySelector(".accueil-chasse-resume-badges-icones");
    var texte = wrap.querySelector(".accueil-chasse-resume-badges-texte");
    iconesWrap.innerHTML = "";
    var tousObtenus = obtenus.length === BADGES.length;
    var aMontrer = tousObtenus ? obtenus.slice(-3) : proches.slice(0, 3).map(function(p){ return p.badge; });
    aMontrer.forEach(function(b){
      var fabriqueIcone = ICONES_BADGE[b.icone];
      var icone = el("span", "accueil-chasse-resume-badge-icone" + (tousObtenus ? " obtenu" : ""),
        fabriqueIcone ? fabriqueIcone() : ICONES.badge);
      icone.title = b.nom;
      icone.setAttribute("aria-label", b.nom);
      iconesWrap.appendChild(icone);
    });
    texte.textContent = tousObtenus ? "" : aMontrer.length + (aMontrer.length === 1 ? " badge à portée" : " badges à portée");
  }
  /* décompte des conditions restantes d'un badge — sert à la fois à la
     ligne "prochain badge" et au choix des icônes "à portée". Pour un
     badge à conditions nommées, le nombre de conditions non cochées ;
     pour seuilNiveau3 / seuilTotal / seuilJourneesCorrigees / seuilPointsQuiz,
     l'écart au seuil. */
  function badgeConditionsTotal(badge){
    if(badge.seuilTotal != null) return badge.seuilTotal;
    if(badge.seuilNiveau3 != null) return badge.seuilNiveau3;
    if(badge.seuilJourneesCorrigees != null) return badge.seuilJourneesCorrigees;
    if(badge.seuilPointsQuiz != null) return badge.seuilPointsQuiz;
    if(badge.seuilPhotos != null) return badge.seuilPhotos;
    return badge.conditions.length;
  }
  function badgeConditionsRestantes(badge, etat){
    if(badge.seuilTotal != null){
      var total = ENTREES_REGARDER.filter(function(e){ return !!etat[e.id]; }).length;
      return Math.max(0, badge.seuilTotal - total);
    }
    if(badge.seuilNiveau3 != null){
      var n3 = ENTREES_REGARDER.filter(function(e){
        return !!etat[e.id] && (e.entree.niveau || 1) === 3;
      }).length;
      return Math.max(0, badge.seuilNiveau3 - n3);
    }
    if(badge.seuilJourneesCorrigees != null){
      return Math.max(0, badge.seuilJourneesCorrigees - journeesQuizCorrigees());
    }
    if(badge.seuilPointsQuiz != null){
      return Math.max(0, badge.seuilPointsQuiz - pointsQuizObtenus());
    }
    if(badge.seuilPhotos != null){
      return Math.max(0, badge.seuilPhotos - statistiquesPhotos().mesPhotos);
    }
    return badge.conditions.filter(function(c){
      var id = idPourCondition(c);
      return !(id && etat[id]);
    }).length;
  }
  /* classe les badges encore verrouillés du plus proche au plus loin :
     le moins de conditions restantes d'abord, le moins de conditions au
     total en cas d'égalité. */
  function badgesParProximite(etat){
    return BADGES.filter(function(b){ return !badgeObtenu(b, etat); })
      .map(function(b){
        return { badge: b, restantes: badgeConditionsRestantes(b, etat), total: badgeConditionsTotal(b) };
      })
      .sort(function(a, b){ return a.restantes - b.restantes || a.total - b.total; });
  }
  function texteRestantes(n){
    return "reste " + n + (n === 1 ? " observation" : " observations");
  }
  /* même chose que texteRestantes, mais adaptée à l'unité du badge ciblé
     (observations, journées de quiz corrigées, ou points de quiz). */
  function texteRestantesBadge(badge, n){
    if(badge.seuilJourneesCorrigees != null){
      return "reste " + n + (n === 1 ? " journée corrigée" : " journées corrigées");
    }
    if(badge.seuilPointsQuiz != null){
      return "reste " + n + (n === 1 ? " point" : " points");
    }
    if(badge.seuilPhotos != null){
      return "reste " + n + (n === 1 ? " photo" : " photos");
    }
    return texteRestantes(n);
  }

  /* --- chasse au trésor : bloc complet (score, badges, partage), réservé
     à l'onglet Chasse — visible dans les trois états (avant/pendant/après)
     puisque la progression ne dépend pas des dates du voyage. Les badges
     (BADGES, constante à part dans donnees.js) s'affichent dans ce même
     bloc — voir majBadges plus bas. */
  function construireBlocChasseComplet(){
    var wrap = el("div", "accueil-chasse");
    wrap.id = "chasse-plein";
    var tete = el("div", "accueil-chasse-tete");
    tete.appendChild(el("p", "accueil-chasse-label", ICONES.regarder + " Progression"));
    tete.appendChild(construireBoutonPartage());
    wrap.appendChild(tete);
    wrap.appendChild(el("p", "accueil-chasse-score"));
    wrap.appendChild(el("p", "accueil-chasse-sub"));
    wrap.appendChild(el("div", "accueil-chasse-badges"));
    majBlocChasseTab(wrap);
    return wrap;
  }
  function majBlocChasseTab(wrap){
    wrap = wrap || document.getElementById("chasse-plein");
    if(!wrap) return;
    var total = ENTREES_REGARDER.length;
    var coches = ENTREES_REGARDER.filter(function(e){ return estCoche(e.id); }).length;
    var pts = scoreTotal();
    wrap.querySelector(".accueil-chasse-score").innerHTML =
      pts + ' <span class="unite">' + (pts === 1 ? "point" : "points") + '</span> <span class="sur">sur ' + scoreMaximum() + "</span>";
    wrap.querySelector(".accueil-chasse-sub").textContent = coches + " / " + total + " objectifs repérés";
    majBadges(wrap.querySelector(".accueil-chasse-badges"), etatRegarder);
  }

  /* --- vue par journée de l'onglet Chasse : accordéon replié par défaut,
     un par journée — plus de cent observations à la file sinon. Réutilise
     construireRegarderJour(j, true) tel quel (mêmes cases, même barre de
     progression) comme contenu du corps dépliable. */
  function progressionJourChasse(j){
    var total = (j.regarder || []).length, coches = 0, pts = 0;
    (j.regarder || []).forEach(function(r, i){
      var id = j.id + "-r" + i;
      if(estCoche(id)){ coches++; pts += pointsEntree(id); }
    });
    return { total: total, coches: coches, pts: pts };
  }
  function majEnteteChasseJour(wrap, j){
    var p = progressionJourChasse(j);
    wrap.querySelector(".chasse-jour-progres").textContent =
      p.coches + " / " + p.total + " · " + p.pts + (p.pts === 1 ? " pt" : " pts");
  }
  function definirAccordionChasse(wrap, ouvrir){
    wrap.classList.toggle("open", ouvrir);
    wrap.querySelector(".chasse-jour-head").setAttribute("aria-expanded", ouvrir ? "true" : "false");
    var collapse = wrap.querySelector(".chasse-jour-collapse");
    if(ouvrir) collapse.removeAttribute("inert");
    else collapse.setAttribute("inert", "");
  }
  function basculerAccordionChasse(wrap){
    definirAccordionChasse(wrap, !wrap.classList.contains("open"));
  }
  /* ouvrirParDefaut : seule la journée en cours (voir jourDuJour) démarre
     dépliée — c'est celle qu'on vient consulter sur place. */
  function construireBlocChasseJour(j, ouvrirParDefaut){
    var wrap = el("div", "chasse-jour");
    wrap.setAttribute("data-jour-chasse", j.id);

    var head = document.createElement("button");
    head.type = "button";
    head.className = "chasse-jour-head";
    var idCorps = "chasse-corps-" + j.id;
    head.setAttribute("aria-controls", idCorps);
    var txt = el("span", "chasse-jour-tete-txt");
    txt.appendChild(el("span", "chasse-jour-date", j.dow + " " + j.num + " " + j.mois));
    txt.appendChild(el("span", "chasse-jour-titre", j.titre));
    head.appendChild(txt);
    var etatTete = el("span", "chasse-jour-tete-etat");
    etatTete.appendChild(el("span", "chasse-jour-progres"));
    etatTete.appendChild(el("span", "chasse-jour-chevron", ICONES.chevron));
    head.appendChild(etatTete);
    head.addEventListener("click", function(){ basculerAccordionChasse(wrap); });
    wrap.appendChild(head);

    var collapse = el("div", "chasse-jour-collapse");
    collapse.id = idCorps;
    var inner = el("div", "chasse-jour-collapse-inner");
    inner.appendChild(construireRegarderJour(j, true));
    collapse.appendChild(inner);
    wrap.appendChild(collapse);

    majEnteteChasseJour(wrap, j);
    definirAccordionChasse(wrap, !!ouvrirParDefaut);
    return wrap;
  }

  /* --- filtres de la liste "Par journée" -----------------------------
     "atrouver" masque les entrées cochées (et donc les journées
     entièrement cochées) ; "niveau3" ne garde que les observations les
     plus difficiles. Une entrée doit passer le filtre ET la recherche
     (voir itemVisibleRechercheChasse, ajoutée avec le champ de
     recherche) pour rester visible. */
  var filtreChasseActif = "all";
  function itemVisibleFiltreChasse(id, niveau){
    if(filtreChasseActif === "atrouver") return !estCoche(id);
    if(filtreChasseActif === "niveau3") return niveau === 3;
    return true;
  }
  /* recherche : normalise à la volée plutôt que de maintenir un index à
     part — une centaine d'entrées, coût négligeable à chaque frappe.
     Réutilise normaliser(), déjà utilisée par la recherche de l'onglet
     Agenda (accents, casse, HTML retiré). */
  var rechercheChasseNorm = "";
  function itemVisibleRechercheChasse(id){
    if(!rechercheChasseNorm) return true;
    var e = ENTREES_REGARDER_PAR_ID[id];
    if(!e) return true;
    return normaliser(e.entree.ou + " " + e.entree.quoi).indexOf(rechercheChasseNorm) !== -1;
  }
  /* recompte, pour chaque journée de la liste, ce que le filtre et la
     recherche actifs laissent voir : masque l'entrée si besoin, masque
     la journée entière si plus aucune entrée n'y est visible, et déplie
     automatiquement les journées qui contiennent encore un résultat. */
  function appliquerVisibiliteChasse(){
    var actif = filtreChasseActif !== "all" || !!rechercheChasseNorm;
    var totalVisible = 0;
    Array.prototype.forEach.call(document.querySelectorAll(".chasse-jour[data-jour-chasse]"), function(wrap){
      var visibles = 0;
      Array.prototype.forEach.call(wrap.querySelectorAll(".regarder-item"), function(item){
        var id = item.getAttribute("data-regarder-id");
        var niveau = parseInt(item.getAttribute("data-niveau"), 10) || 1;
        var visible = itemVisibleFiltreChasse(id, niveau) && itemVisibleRechercheChasse(id);
        item.classList.toggle("chasse-item-masque", !visible);
        if(visible) visibles++;
      });
      wrap.classList.toggle("hidden", visibles === 0);
      if(actif && visibles > 0) definirAccordionChasse(wrap, true);
      totalVisible += visibles;
    });
    var compte = document.getElementById("chasse-recherche-compte");
    if(compte){
      if(rechercheChasseNorm){
        compte.hidden = false;
        compte.textContent = totalVisible + (totalVisible === 1 ? " résultat" : " résultats");
      } else {
        compte.hidden = true;
      }
    }
  }
  function construireOutilsChasse(){
    var wrap = document.createElement("div");
    wrap.className = "jours-outils";
    wrap.innerHTML =
      '<div class="recherche-bar">' +
        '<svg class="recherche-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="20" y2="20"/></svg>' +
        '<input type="search" id="chasse-recherche-input" class="recherche-input" placeholder="Rechercher…" aria-label="Rechercher parmi les observations" autocomplete="off">' +
        '<button type="button" id="chasse-recherche-clear" class="recherche-clear" aria-label="Effacer la recherche" hidden>×</button>' +
      '</div>' +
      '<p class="recherche-compte" id="chasse-recherche-compte" hidden></p>';

    var champ = wrap.querySelector("#chasse-recherche-input");
    var effacer = wrap.querySelector("#chasse-recherche-clear");
    champ.addEventListener("input", function(){
      rechercheChasseNorm = normaliser(champ.value).trim();
      effacer.hidden = !champ.value;
      appliquerVisibiliteChasse();
    });
    effacer.addEventListener("click", function(){
      champ.value = "";
      rechercheChasseNorm = "";
      effacer.hidden = true;
      appliquerVisibiliteChasse();
      champ.focus();
    });
    return wrap;
  }
  function construireFiltresChasse(){
    var bar = el("nav", "filters");
    bar.id = "chasse-filters";
    bar.setAttribute("aria-label", "Filtrer les observations");
    FILTRES_CHASSE.forEach(function(f, i){
      var b = el("button", null, f.libelle);
      b.type = "button";
      b.setAttribute("data-f", f.cle);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      bar.appendChild(b);
    });
    bar.addEventListener("click", function(e){
      var btn = e.target.closest("button");
      if(!btn) return;
      filtreChasseActif = btn.getAttribute("data-f");
      Array.prototype.forEach.call(bar.querySelectorAll("button"), function(b){
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      appliquerVisibiliteChasse();
    });
    return bar;
  }

  /* --- bloc « Aujourd'hui » de l'onglet Chasse : les observations
     restantes de la journée en cours, dépliées, cochables directement —
     réservé aux dates du voyage (jourDuJour().exact). Les entrées cochées
     ne sont pas retirées du DOM : elles se masquent via CSS
     (.chasse-aujourdhui .regarder-item.checked), déjà resynchronisées
     par rafraichirRegarder comme partout ailleurs dans le carnet. */
  function construireBlocAujourdhuiChasse(j){
    if(!j.regarder || !j.regarder.length) return null;
    var wrap = el("div", "block chasse-aujourdhui");
    wrap.setAttribute("data-jour-chasse-auj", j.id);
    wrap.appendChild(el("h3", null, ICONES.regarder + " Aujourd’hui"));
    wrap.appendChild(el("p", "chasse-aujourdhui-reste"));
    j.regarder.forEach(function(r, i){ wrap.appendChild(construireItemRegarder(j, r, i)); });
    majBlocAujourdhuiChasse(wrap, j);
    return wrap;
  }
  function majBlocAujourdhuiChasse(wrap, j){
    wrap = wrap || document.querySelector("[data-jour-chasse-auj]");
    if(!wrap) return;
    if(!j) j = trouverJour(wrap.getAttribute("data-jour-chasse-auj"));
    if(!j) return;
    var restantes = (j.regarder || []).filter(function(r, i){ return !estCoche(j.id + "-r" + i); }).length;
    wrap.querySelector(".chasse-aujourdhui-reste").textContent =
      restantes ? texteRestantes(restantes) : "Tout repéré aujourd’hui.";
  }

  /* --- onglet Chasse : panneau statique, construit une fois au chargement
     (même schéma que rendrePanelReserver / construirePanelUrgences) —
     seul le contenu des cases à cocher change ensuite, via rafraichirRegarder. */
  function rendrePanelChasse(){
    var panel = document.getElementById("panel-chasse");
    panel.appendChild(construireEnteteOnglet("Chasse au trésor"));

    if(modeFamille) panel.appendChild(construireBlocClassement());

    var rAuj = jourDuJour();
    var idJourAuj = rAuj.exact ? rAuj.jour.id : null;
    if(rAuj.exact){
      var blocAuj = construireBlocAujourdhuiChasse(rAuj.jour);
      if(blocAuj) panel.appendChild(blocAuj);
    }

    panel.appendChild(construireBlocChasseComplet());

    var joursAvecRegarder = JOURS.filter(function(j){ return j.regarder && j.regarder.length; });
    if(joursAvecRegarder.length){
      var sec = el("div", "block");
      sec.appendChild(el("h3", null, ICONES.regarder + " Par journée"));
      sec.appendChild(construireOutilsChasse());
      sec.appendChild(construireFiltresChasse());
      joursAvecRegarder.forEach(function(j){ sec.appendChild(construireBlocChasseJour(j, j.id === idJourAuj)); });
      panel.appendChild(sec);
    }

    var pied = el("footer", "panel-foot");
    pied.appendChild(construireBoutonReinitialisation());
    panel.appendChild(pied);
  }

  /* --- badges : cinq façons d'être obtenu — conditions nommées (toutes
     cochées), un seuil de nombre d'entrées de niveau 3 cochées, un seuil
     sur le total d'entrées cochées, un seuil de journées de quiz
     intégralement corrigées, ou un seuil de points de quiz gagnés (voir
     le schéma de BADGES dans donnees.js). Prend un état en paramètre
     plutôt que de lire etatRegarder directement : la vue de partage
     (lecture seule) réutilise la même fonction avec l'état décodé de
     l'expéditeur. Les deux seuils de quiz ne dépendent pas de cet état
     (etatQuiz est local à l'appareil, jamais encodé dans un partage). */
  function badgeObtenu(badge, etat){
    if(badge.seuilTotal != null){
      var total = ENTREES_REGARDER.filter(function(e){ return !!etat[e.id]; }).length;
      return total >= badge.seuilTotal;
    }
    if(badge.seuilNiveau3 != null){
      var n3 = ENTREES_REGARDER.filter(function(e){
        return !!etat[e.id] && (e.entree.niveau || 1) === 3;
      }).length;
      return n3 >= badge.seuilNiveau3;
    }
    if(badge.seuilJourneesCorrigees != null){
      return journeesQuizCorrigees() >= badge.seuilJourneesCorrigees;
    }
    if(badge.seuilPointsQuiz != null){
      return pointsQuizObtenus() >= badge.seuilPointsQuiz;
    }
    if(badge.seuilPhotos != null){
      /* comme les seuils de quiz ci-dessus : seulement MES photos
         (statistiquesPhotos().mesPhotos), jamais le total famille --
         la RLS de la table photos ne laisse voir a un membre que ses
         propres photos et celles marquees "partagee" par les autres,
         donc impossible de calculer un vrai total famille cote client
         sans fonction dediee. */
      return statistiquesPhotos().mesPhotos >= badge.seuilPhotos;
    }
    return badge.conditions.every(function(c){
      var id = idPourCondition(c);
      return !!id && !!etat[id];
    });
  }
  function majBadges(container, etat){
    if(!container) return;
    container.innerHTML = "";
    BADGES.forEach(function(b){
      var carte = el("div", "chasse-badge" + (badgeObtenu(b, etat) ? " obtenu" : ""));
      var fabriqueIcone = ICONES_BADGE[b.icone];
      carte.appendChild(el("span", "chasse-badge-icone", fabriqueIcone ? fabriqueIcone() : ICONES.badge));
      var texte = el("div", "chasse-badge-texte");
      texte.appendChild(el("p", "chasse-badge-nom", b.nom));
      texte.appendChild(el("p", "chasse-badge-resume", b.resume));
      carte.appendChild(texte);
      container.appendChild(carte);
    });
  }

  /* --- classement famille : podium top 3 + liste, quiz + chasse combinés.
     Le quiz vit déjà sur Supabase (progression.quiz_score, posé une fois
     par membre par admin/index.html) ; la chasse vient d'y être ajoutée
     (observations_cochees, voir synchroniserObservations plus haut) —
     c'est ce qui rend ce classement possible pour la première fois.
     Lecture globale autorisée par la policy "lecture progression par la
     famille du voyage" (RLS, tous les membres peuvent lire la progression
     des autres, jamais l'écrire). Construit une fois au chargement du
     panneau puis rempli de façon asynchrone : pas la peine de retenter au
     fil des cases cochées, un rafraîchissement de page suffit à voir
     bouger les autres. */
  function chasseScoreDe(cochees){
    return ENTREES_REGARDER.reduce(function(acc, e){ return acc + (cochees[e.id] ? pointsEntree(e.id) : 0); }, 0);
  }
  function chasseBadgesDe(cochees){
    return BADGES.filter(function(b){
      /* seuils basés sur le quiz (journées corrigées, points) ou sur les
         photos personnelles : hors de portée d'un etat "cochees" seul,
         jamais comptés dans le classement d'un autre membre — seuls les
         badges liés à la chasse le sont. */
      if(b.seuilJourneesCorrigees != null || b.seuilPointsQuiz != null || b.seuilPhotos != null) return false;
      return badgeObtenu(b, cochees);
    }).length;
  }
  /* médaille de podium : même grammaire de dessin que iconeBadgeTrait
     (trait épaisseur 1.5-1.6, currentColor, extrémités arrondies) — un
     disque et un ruban à deux pans, le rang gravé au centre en Bodoni
     plutôt qu'en chiffre plaqué à côté, pour rester dans le vocabulaire
     de traits déjà posé par les badges de la chasse et la barre d'onglets,
     comme demandé plutôt qu'un simple nombre nu. */
  function iconeClassementMedaille(rang){
    return '<svg viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M8.5 15.5 L5.3 28 L12 23.3 L18.7 28 L15.5 15.5"/>' +
      '<circle cx="12" cy="9.5" r="8"/>' +
      '<text x="12" y="13" text-anchor="middle" font-family="\'Bodoni Moda\',Georgia,serif" ' +
      'font-size="9.5" fill="currentColor" stroke="none">' + rang + '</text>' +
      '</svg>';
  }
  /* rempli(t) la zone de classement — utilisé au premier rendu et pour un
     rafraîchissement ciblé après une action qui change le score du membre
     connecté (correction de quiz, coche de la chasse) : voir
     rafraichirClassement plus bas. Le commentaire d'origine ci-dessus
     renonçait à ce rafraîchissement pour ne pas retenter à chaque case
     cochée, mais laissait du coup le PROPRE score du joueur figé jusqu'à
     un rechargement complet de page — corrigé ici, le coût d'une requête
     de plus après une correction de quiz ou une validation de journée
     (jamais à chaque frappe) est négligeable. */
  function remplirClassement(zone){
    zone.innerHTML = "";
    zone.appendChild(el("p", "classement-detail", "Chargement…"));

    return Promise.all([
      supabaseClient.from("progression")
        .select("utilisateur_id, observations_cochees, quiz_score, quiz_corrige")
        .eq("voyage_id", voyageId),
      supabaseClient.from("membres_famille")
        .select("utilisateur_id, prenom")
        .eq("voyage_id", voyageId)
    ]).then(function(res){
      var resProgression = res[0], resMembres = res[1];
      if(resProgression.error || resMembres.error){
        zone.innerHTML = "";
        zone.appendChild(el("p", "classement-detail", "Classement indisponible pour le moment."));
        return;
      }
      var prenomParId = {};
      (resMembres.data || []).forEach(function(m){ prenomParId[m.utilisateur_id] = m.prenom; });
      var lignes = (resProgression.data || []).map(function(p){
        var cochees = p.observations_cochees || {};
        var ptsChasse = chasseScoreDe(cochees);
        var ptsQuiz = p.quiz_corrige ? (p.quiz_score || 0) : 0;
        return {
          id: p.utilisateur_id,
          nom: prenomParId[p.utilisateur_id] || "Un membre de la famille",
          total: ptsChasse + ptsQuiz,
          ptsChasse: ptsChasse,
          ptsQuiz: ptsQuiz,
          badges: chasseBadgesDe(cochees)
        };
      }).sort(function(a, b){ return b.total - a.total; });

      zone.innerHTML = "";
      if(!lignes.length){
        zone.appendChild(el("p", "classement-detail", "Personne n'a encore de score sur ce voyage."));
        return;
      }

      var podium = el("div", "classement-podium");
      lignes.slice(0, 3).forEach(function(ligne, i){
        var marche = el("div", "classement-marche rang-" + (i + 1));
        if(i === 0) marche.appendChild(el("div", "classement-marche-laurier", ICONES_BADGE.laurier()));
        marche.appendChild(el("div", "classement-marche-rang", iconeClassementMedaille(i + 1)));
        marche.appendChild(el("p", "classement-marche-nom", ligne.nom + (ligne.id === utilisateurId ? " (vous)" : "")));
        marche.appendChild(el("p", "classement-marche-pts", ligne.total + " pts"));
        podium.appendChild(marche);
      });
      zone.appendChild(podium);

      if(lignes.length > 3){
        var liste = el("div", "classement-liste");
        lignes.slice(3).forEach(function(ligne, i){
          var l = el("div", "classement-ligne" + (ligne.id === utilisateurId ? " moi" : ""));
          l.appendChild(el("span", "classement-ligne-rang", String(i + 4)));
          l.appendChild(el("span", "classement-ligne-nom", ligne.nom + (ligne.id === utilisateurId ? " (vous)" : "")));
          l.appendChild(el("span", "classement-ligne-pts", ligne.total + " pts"));
          liste.appendChild(l);
        });
        zone.appendChild(liste);
      }
    }).catch(function(err){
      console.error("Échec de chargement du classement :", err);
      zone.innerHTML = "";
      zone.appendChild(el("p", "classement-detail", "Classement indisponible pour le moment."));
    });
  }
  function construireBlocClassement(){
    var bloc = el("div", "block classement");
    bloc.appendChild(el("h3", null, ICONES.badge + " Classement de la famille"));
    var zone = el("div", "classement-zone");
    bloc.appendChild(zone);
    remplirClassement(zone);
    return bloc;
  }
  function rafraichirClassement(){
    Array.prototype.forEach.call(document.querySelectorAll(".classement-zone"), remplirClassement);
  }

  /* --- partage : un texte autoporteur (score, observations, badges), rien
     d'autre — pas de lien ni d'état encodé à faire suivre. navigator.share()
     sur mobile ; à défaut, copie dans le presse-papiers. navigator.clipboard
     exige un contexte sécurisé, absent d'un fichier ouvert en file://, d'où
     le repli execCommand puis, en dernier recours, un prompt() pour copier
     à la main. ----------------------------------------------------------- */
  function texteProgression(){
    var coches = ENTREES_REGARDER.filter(function(e){ return estCoche(e.id); }).length;
    var obtenus = BADGES.filter(function(b){ return badgeObtenu(b, etatRegarder); });
    return "Chasse au trésor du carnet : " +
      scoreTotal() + "/" + scoreMaximum() + " pts · " +
      coches + "/" + ENTREES_REGARDER.length + " · " +
      obtenus.length + "/" + BADGES.length + " badges";
  }
  function copierTexteRepli(texte){
    var zone = document.createElement("textarea");
    zone.value = texte;
    zone.style.position = "fixed";
    zone.style.opacity = "0";
    document.body.appendChild(zone);
    zone.focus();
    zone.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(zone);
    if(ok) signalerPartage("Copié !");
    else window.prompt("Copiez ce texte pour le partager :", texte);
  }
  function copierTexte(texte){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texte).then(
        function(){ signalerPartage("Copié !"); },
        function(){ copierTexteRepli(texte); }
      );
    } else {
      copierTexteRepli(texte);
    }
  }
  function signalerPartage(texte){
    var b = document.getElementById("chasse-partage-btn");
    if(!b) return;
    var original = b.getAttribute("data-texte-origine") || b.innerHTML;
    b.setAttribute("data-texte-origine", original);
    b.innerHTML = texte;
    window.setTimeout(function(){ b.innerHTML = original; }, 2200);
  }
  function partagerProgression(){
    var texte = texteProgression();
    if(navigator.share){
      navigator.share({ text: texte })
        .catch(function(){ copierTexte(texte); });
    } else {
      copierTexte(texte);
    }
  }
  function construireBoutonPartage(){
    var b = document.createElement("button");
    b.type = "button";
    b.id = "chasse-partage-btn";
    b.className = "chasse-partage";
    b.innerHTML = ICONES.partager + " Partager ma progression";
    b.addEventListener("click", partagerProgression);
    return b;
  }

  /* --- héros de l'accueil : titre, dates et compte à rebours en réserve
     sur l'illustration. Pendant le séjour, les dates cèdent la place à
     la date du jour — le reste de l'année, c'est la plage complète du
     voyage qui a du sens. */
  function texteCompteAccueil(r){
    if(r.exact){
      var i = JOURS.indexOf(r.jour);
      return "Jour " + (i + 1) + " sur " + JOURS.length + ".";
    }
    if(r.avant){
      var n = joursEntre(dateAujourdhui(), new Date(dateAujourdhui().getFullYear(), 6, 31));
      return n === 1 ? "Départ demain." : (n > 1 ? "Départ dans " + n + " jours." : "Le départ approche.");
    }
    return "";
  }
  function construireHeroAccueil(r){
    var wrap = el("div", "accueil-hero");
    var illu = el("div", "accueil-hero-illu");
    illu.innerHTML = svgIllustrationAccueil(cielAccueil());
    wrap.appendChild(illu);
    wrap.appendChild(construireVerrouFamille());
    var texte = el("div", "accueil-hero-texte");
    texte.appendChild(el("p", "accueil-hero-titre", fmt(CARNET.titre) + " " + fmt(CARNET.titreSuite)));
    var dates = r.exact ? (r.jour.dow + " " + r.jour.num + " " + r.jour.mois) : fmt(CARNET.sousTitre);
    texte.appendChild(el("p", "accueil-hero-dates", dates));
    var compte = texteCompteAccueil(r);
    if(compte) texte.appendChild(el("p", "accueil-hero-compte", compte));
    wrap.appendChild(texte);
    return wrap;
  }

  /* --- bloc éclipse : visible tant que le 12 août n'est pas passé (états
     A et B). Le compte à rebours et le rappel du maximum reprennent tels
     quels le fil de la journée du 12 août — rien n'est réécrit. */
  function eclipseAVenir(){
    var d = dateAujourdhui();
    return d <= new Date(d.getFullYear(), 7, 12, 23, 59, 59);
  }
  function texteCompteEclipse(){
    var n = joursEntre(dateAujourdhui(), new Date(dateAujourdhui().getFullYear(), 7, 12));
    if(n > 1) return "Éclipse dans " + n + " jours.";
    if(n === 1) return "Éclipse demain.";
    return "L'éclipse, c'est aujourd'hui.";
  }
  function construireBlocEclipseAccueil(){
    if(!eclipseAVenir()) return null;
    var jourEclipse = trouverJour("d-0812");
    if(!jourEclipse) return null;
    var maximum = (jourEclipse.fil || []).filter(function(e){ return e.h === "20 h 20"; })[0];

    var a = document.createElement("a");
    a.className = "accueil-eclipse";
    a.href = "#jour-0812";
    a.appendChild(el("p", "accueil-eclipse-label", ICONES.attention + " Éclipse solaire · mercredi 12 août"));
    a.appendChild(el("p", "accueil-eclipse-compte", texteCompteEclipse()));
    var discWrap = document.createElement("div");
    discWrap.innerHTML = svgSchemaEclipse();
    var disque = discWrap.firstChild;
    /* voir surAppuiDisqueEclipseCachee : le disque arbitre entre appui
       simple (navigation différée) et triple appui (mode éclipse, sans
       navigation) avant de laisser filer le clic vers le lien englobant. */
    disque.addEventListener("click", surAppuiDisqueEclipseCachee);
    a.appendChild(disque);
    if(maximum) a.appendChild(el("p", "accueil-eclipse-sub", "<b>" + maximum.h + "</b> — " + maximum.texte));
    return a;
  }

  /* --- état A : avant le 31 juillet --------------------------------- */
  function construireAccueilAvant(){
    var frag = document.createDocumentFragment();

    var eclipse = construireBlocEclipseAccueil();
    if(eclipse) frag.appendChild(eclipse);

    frag.appendChild(construireChiffresVoyage());
    frag.appendChild(construireBlocItineraire());

    var bJour = el("div", "block");
    bJour.appendChild(el("h3", null, ICONES.fil + " La première journée"));
    bJour.appendChild(construireCarte(JOURS[0]));
    frag.appendChild(bJour);

    return frag;
  }

  /* --- état B : pendant le voyage ------------------------------------
     l'étape en cours réutilise exactement le repérage horaire du fil
     principal (minutesDepuisTexte, voir construireBlocFil) : même règle,
     un seul endroit qui sait lire "7 h 30". */
  function construireEtapeEnCours(j){
    if(!j.fil || !j.fil.length) return null;
    var d = dateAujourdhui(), nowMin = d.getHours() * 60 + d.getMinutes(), curIdx = -1;
    j.fil.forEach(function(e, i){
      var m = minutesDepuisTexte(e.h);
      if(m !== null && m <= nowMin) curIdx = i;
    });
    if(curIdx === -1) return null;
    var etape = j.fil[curIdx];
    var wrap = el("div", "accueil-etape");
    wrap.appendChild(el("p", "t", "En ce moment · " + etape.h));
    wrap.appendChild(el("p", null, etape.texte));
    return wrap;
  }
  function construireAccueilPendant(j){
    var frag = document.createDocumentFragment();

    var enCours = construireEtapeEnCours(j);
    if(enCours) frag.appendChild(enCours);

    frag.appendChild(construireChiffresVoyage());

    if(j.id !== "d-0812"){
      var eclipse = construireBlocEclipseAccueil();
      if(eclipse) frag.appendChild(eclipse);
    }

    var bJour = el("div", "block");
    bJour.appendChild(el("h3", null, ICONES.fil + " Aujourd'hui"));
    bJour.appendChild(construireCarte(j));
    frag.appendChild(bJour);

    var i = JOURS.indexOf(j);
    if(i < JOURS.length - 1){
      var bDemain = el("div", "block accueil-demain");
      bDemain.appendChild(el("h3", null, "Demain"));
      bDemain.appendChild(construireCarte(JOURS[i + 1]));
      frag.appendChild(bDemain);
    }
    return frag;
  }

  /* --- état C : après le 23 août -------------------------------------- */
  function construireAccueilApres(){
    var frag = document.createDocumentFragment();
    frag.appendChild(construireChiffresVoyage());
    frag.appendChild(construireBlocItineraire());

    var a = document.createElement("a");
    a.className = "accueil-lien";
    a.href = "#jours";
    a.appendChild(el("span", "txt", "Revoir les vingt-quatre journées."));
    a.appendChild(el("span", "chev", "→"));
    frag.appendChild(a);
    return frag;
  }

  function rendreAujourdhui(){
    var panel = document.getElementById("panel-aujourdhui");
    panel.innerHTML = "";
    var r = jourDuJour();
    panel.appendChild(construireHeroAccueil(r));
    if(modeFamille) panel.appendChild(construireResumeChasseAccueil());
    if(r.exact) panel.appendChild(construireAccueilPendant(r.jour));
    else if(r.avant) panel.appendChild(construireAccueilAvant());
    else panel.appendChild(construireAccueilApres());
  }

  /* --- réinitialisation : discrète, en pied d'accueil — pas d'écran de
     réglages dédié pour une seule action. confirm() natif, pas de refonte
     du dialogue : c'est une action destructive locale, elle mérite une
     friction, même minime. */
  function construireBoutonReinitialisation(){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "reinit-chasse";
    b.textContent = "Réinitialiser la chasse au trésor";
    b.addEventListener("click", function(){
      var vide = ENTREES_REGARDER.every(function(e){ return !estCoche(e.id); });
      if(vide) return;
      if(window.confirm("Remettre à zéro toute la progression de la chasse au trésor sur cet appareil ? Les objectifs cochés seront décochés.")){
        etatRegarder = {};
        sauvegarderEtatRegarder();
        synchroniserObservations();
        rafraichirRegarder();
      }
    });
    return b;
  }

  /* --- pin "Aujourd'hui" en tête de la liste des jours -------------------- */
  (function rendrePinned(){
    var r = jourDuJour();
    if(!r.exact) return;
    var wrap = el("section", "pinned");
    wrap.appendChild(el("p", "pinned-label", "Aujourd'hui"));
    wrap.appendChild(construireCarte(r.jour));
    document.getElementById("pinned-today").appendChild(wrap);
  })();

  /* --- vue détail plein écran ---------------------------------------------- */
  var detailEl = document.getElementById("detail");
  var detailInner = document.getElementById("detail-inner");

  /* navigation séquentielle : jour précédent / suivant, bornée par le
     début et la fin du séjour (pas de bouton précédent le 31 juillet,
     pas de suivant le 23 août) — bornes affichées en état désactivé
     plutôt que masquées, pour que la barre garde la même mise en page
     sur ces deux journées. Même mécanisme d'ancre que le reste
     (location.hash via <a href>), pour que le bouton retour du
     navigateur continue de fonctionner normalement. */
  var navSticky = document.getElementById("day-nav-sticky");
  function construireLienNavSticky(cible, sens, fleche){
    if(!cible){
      var vide = el("span", "day-nav-sticky-link day-nav-sticky-" + sens, fleche);
      vide.setAttribute("aria-disabled", "true");
      return vide;
    }
    var a = document.createElement("a");
    a.className = "day-nav-sticky-link day-nav-sticky-" + sens;
    a.href = "#jour-" + idCourt(cible);
    var date = cible.dow + " " + cible.num;
    a.innerHTML = sens === "prev" ? ("‹ " + date) : (date + " ›");
    return a;
  }
  function remplirNavSticky(j){
    var i = JOURS.indexOf(j);
    navSticky.innerHTML = "";
    navSticky.setAttribute("data-kind", j.cat);
    navSticky.appendChild(construireLienNavSticky(i > 0 ? JOURS[i - 1] : null, "prev", "‹"));
    navSticky.appendChild(construireLienNavSticky(i < JOURS.length - 1 ? JOURS[i + 1] : null, "next", "›"));
  }

  /* le colophon statique de la page (voir HTML, id="colophon-marque")
     disparaît derrière la vue détail : position:fixed;inset:0 la
     recouvre entièrement. On en pose une copie en pied de .detail-inner,
     avec sa propre icône (getElementById ne peut remplir qu'un seul
     élément portant l'id d'origine). */
  function construireColophonDetail(){
    var footer = document.createElement("footer");
    footer.className = "colophon colophon-detail";
    footer.innerHTML = '<p class="colophon-texte"><span class="colophon-marque" aria-hidden="true">' +
      svgChihuahuaAssis() +
      '</span>Fait maison par Papa<span class="colophon-pt">·</span><br class="colophon-saut">Relu par Réglisse · Été 2026</p>';
    return footer;
  }
  function ouvrirDetail(id){
    var j = trouverJour(id);
    if(!j){ location.hash = "#jours"; return; }
    titrerJour(j);
    detailInner.innerHTML = "";
    var back = el("button", "back", "‹ Retour");
    back.type = "button";
    back.setAttribute("aria-label", "Retour à la liste des jours");
    back.addEventListener("click", function(){ history.back(); });
    detailInner.appendChild(back);
    detailInner.appendChild(construireContenuJour(j));
    detailInner.appendChild(construireColophonDetail());
    remplirNavSticky(j);
    navSticky.hidden = false;
    detailEl.scrollTop = 0;
    detailEl.classList.add("open");
    detailEl.setAttribute("aria-hidden", "false");
  }
  function fermerDetail(){
    detailEl.classList.remove("open");
    detailEl.setAttribute("aria-hidden", "true");
    navSticky.hidden = true;
  }

  /* --- routage par ancre --------------------------------------------------- */
  var PANELS = ["aujourdhui", "jours", "chasse", "carnet", "reserver", "urgences", "admin"];
  var tabbar = document.getElementById("tabbar");
  var lienCarnetGlobal = tabbar && tabbar.querySelector('[data-tab="carnet"]');
  if(lienCarnetGlobal)lienCarnetGlobal.addEventListener("click",function(ev){ev.preventDefault();history.replaceState(null,"","#carnet");ouvrirCarnetDashboard();});
  if(tabbar)Array.prototype.forEach.call(tabbar.querySelectorAll('a:not([data-tab="carnet"])'),function(lien){lien.addEventListener("click",function(){fermerVueCarnet();});});

  function afficherPanel(nom, scrollY){
    PANELS.forEach(function(p){ document.getElementById("panel-" + p).hidden = (p !== nom); });
    Array.prototype.forEach.call(tabbar.querySelectorAll("a"), function(a){
      a.setAttribute("aria-current", a.getAttribute("data-tab") === nom ? "page" : "false");
    });
    enregistrerOngletVisite(nom);
    window.scrollTo(0, scrollY || 0);
  }

  /* --- position de défilement des listes : mémorisée juste avant de
     basculer vers la vue détail, restaurée seulement au retour de cette
     vue détail (jamais sur une arrivée par lien profond ni un simple
     changement d'onglet, qui démarrent toujours en haut). Le signal qui
     distingue les deux cas : detailEl portait déjà la classe "open" au
     moment où route() s'exécute — donc on en sort — ou pas — donc on y
     entre pour la première fois ou on change juste d'onglet. */
  var scrollPositions = { jours: 0, reserver: 0 };
  /* première ouverture de l'onglet Agenda : défile jusqu'à la carte du
     jour, une seule fois par session — et seulement si on n'est pas déjà
     en train de restaurer une position au retour d'une vue détail
     (prioritaire, voir plus haut). */
  var premiereOuvertureJours = true;
  function panelVisible(){
    var trouve = null;
    PANELS.forEach(function(p){ if(!document.getElementById("panel-" + p).hidden) trouve = p; });
    return trouve;
  }

  /* mode public : chasse, reserver et urgences sont retirés de la barre,
     mais restent dans le DOM (hidden) et donc adressables par ancre — une
     ancre profonde (lien copié, favori) doit retomber sur l'accueil,
     jamais sur un onglet caché ni une page vide. */
  function ancreVersOngletMasque(h){
    if(h === "admin") return !estAdmin;
    return !modeFamille && (h === "chasse" || h === "carnet" || h === "urgences" || /^reserver(-\d{4})?$/.test(h));
  }
  function route(){
    if(ancreVersOngletMasque((location.hash || "").slice(1))){
      location.hash = "#aujourdhui";
      return;
    }
    var panelAvant = panelVisible();
    var detailEtaitOuvert = detailEl.classList.contains("open");
    var h = (location.hash || "#aujourdhui").slice(1);
    if(h !== "carnet")fermerVueCarnet();
    var m = /^jour-(\d{4})$/.exec(h);
    if(m){
      if(!detailEtaitOuvert && (panelAvant === "jours" || panelAvant === "reserver")){
        scrollPositions[panelAvant] = window.scrollY;
      }
      ouvrirDetail("d-" + m[1]);
      afficherPanel("jours");
      return;
    }
    /* lien depuis le bandeau de synthèse d'une journée : ouvre l'onglet
       À réserver et défile jusqu'à la vignette correspondante. */
    var mr = /^reserver-(\d{4})$/.exec(h);
    if(mr){
      fermerDetail();
      afficherPanel("reserver");
      titrerOnglet("reserver");
      var cible = document.getElementById("resa-" + mr[1]);
      if(cible) cible.scrollIntoView({ block: "center" });
      return;
    }
    fermerDetail();
    if(h === "aujourdhui"){ rendreAujourdhui(); afficherPanel("aujourdhui"); document.title = titreCarnet(); }
    else if(h === "urgences"){ afficherPanel("urgences"); titrerOnglet("urgences"); }
    else if(h === "chasse"){ afficherPanel("chasse"); titrerOnglet("chasse"); }
    else if(h === "carnet"){ ouvrirCarnetDashboard(); }
    else if(h === "reserver"){ afficherPanel("reserver", detailEtaitOuvert ? scrollPositions.reserver : 0); titrerOnglet("reserver"); }
    else if(h === "admin"){ afficherPanel("admin"); titrerOnglet("admin"); }
    else if(h === "jours"){
      if(detailEtaitOuvert){
        afficherPanel("jours", scrollPositions.jours);
      } else if(premiereOuvertureJours){
        premiereOuvertureJours = false;
        afficherPanel("jours", 0);
        var carteAuj = document.querySelector("#list .card-today");
        if(carteAuj) carteAuj.scrollIntoView({ block: "center" });
      } else {
        afficherPanel("jours", 0);
      }
      titrerOnglet("jours");
    }
    else { location.hash = "#aujourdhui"; }
  }
  /* --- mémorisation de la position (onglet / journée ouverte) -------------
     iOS relance start_url en mode autonome (icône d'écran d'accueil) et
     ignore le fragment d'URL : sans ce mécanisme, on retombe toujours sur
     l'accueil en rouvrant l'app. On mémorise donc la position à chaque
     changement d'onglet ou de journée, et on la restaure au démarrage —
     sauf si l'URL porte déjà une ancre explicite (lien partagé), et sauf
     si l'état a plus de 4 h (revenir le lendemain doit rouvrir l'accueil,
     pas la journée de la veille). */
  var STOCKAGE_POSITION = slugVoyage + "-carnet-position-v1";
  var PEREMPTION_POSITION_MS = 4 * 60 * 60 * 1000;
  function sauvegarderPosition(){
    try{
      var panel = panelVisible();
      if(!panel) return;
      var etat = { tab: panel, ts: Date.now() };
      if(panel === "jours" && detailEl.classList.contains("open")){
        var m = /^jour-(\d{4})$/.exec((location.hash || "").slice(1));
        if(m){ etat.jour = m[1]; etat.scrollDetail = detailEl.scrollTop; }
      }
      window.localStorage.setItem(STOCKAGE_POSITION, JSON.stringify(etat));
    }catch(e){}
  }
  function lirePositionMemorisee(){
    try{
      var brut = window.localStorage.getItem(STOCKAGE_POSITION);
      if(!brut) return null;
      var etat = JSON.parse(brut);
      if(!etat || typeof etat.ts !== "number") return null;
      if(Date.now() - etat.ts > PEREMPTION_POSITION_MS) return null;
      return etat;
    }catch(e){ return null; }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") sauvegarderPosition();
  });

  var etatMemorise = null;
  if(!location.hash){
    etatMemorise = lirePositionMemorisee();
    if(etatMemorise && !ancreVersOngletMasque(etatMemorise.tab)){
      if(etatMemorise.jour) location.hash = "#jour-" + etatMemorise.jour;
      else if(etatMemorise.tab && etatMemorise.tab !== "aujourdhui") location.hash = "#" + etatMemorise.tab;
      else etatMemorise = null;
    } else {
      etatMemorise = null;
    }
  }
  window.addEventListener("hashchange", function(){ route(); sauvegarderPosition(); });
  route();
  if(etatMemorise && etatMemorise.jour && typeof etatMemorise.scrollDetail === "number"){
    detailEl.scrollTop = etatMemorise.scrollDetail;
  }
  sauvegarderPosition();

  /* --- bannière d'installation : "Ajoutez à l'écran d'accueil" -----------
     Réservée à Safari sur iOS/iPadOS, hors mode autonome — c'est le seul
     navigateur où le geste Partager → Sur l'écran d'accueil s'applique tel
     quel. iPadOS 13+ se déclare "Macintosh" dans son user-agent ; seul le
     support tactile le distingue d'un vrai Mac. Affichée une fois par
     appareil, fermeture mémorisée dans localStorage. */
  var STOCKAGE_BANNIERE_INSTALL = slugVoyage + "-carnet-banniere-install-v1";
  function estIOSSafariNonInstalle(){
    if(window.navigator.standalone) return false;
    var ua = navigator.userAgent;
    var estIOS = /iPad|iPhone|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if(!estIOS) return false;
    return /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  }
  (function initBanniereInstall(){
    var banniere = document.getElementById("install-banner");
    if(!banniere) return;
    var deraFermee;
    try{ deraFermee = window.localStorage.getItem(STOCKAGE_BANNIERE_INSTALL) === "1"; }
    catch(e){ deraFermee = false; }
    if(deraFermee || !estIOSSafariNonInstalle()) return;
    banniere.querySelector(".install-banner-icone").innerHTML = ICONES.partageIOS;
    banniere.hidden = false;
    document.documentElement.style.setProperty("--install-banner-h", banniere.offsetHeight + "px");
    document.getElementById("install-banner-fermer").addEventListener("click", function(){
      banniere.hidden = true;
      document.documentElement.style.setProperty("--install-banner-h", "0px");
      try{ window.localStorage.setItem(STOCKAGE_BANNIERE_INSTALL, "1"); }catch(e){}
    });
  })();
}

/* ==========================================================================
   THÈME PAR VOYAGE — voyages.theme (jsonb) peut surcharger la palette et
   les polices par défaut (Officina Bodoniana, déclarées dans le :root de
   ce fichier). Colonne nullable : un voyage sans thème (salo2026 pour le
   moment) garde le rendu par défaut à l'identique.
   Forme attendue : { "polices_google": ["Playfair+Display:wght@600;700"],
   "css": ":root{--rosso:#7A2E2E;--font-display:'Playfair Display',...}" }
   Appliqué avant tout rendu pour éviter un flash de la mauvaise police
   (voir l'appel juste après la lecture de la ligne voyages).
   ========================================================================== */
function appliquerTheme(theme){
  if(!theme) return;
  (theme.polices_google || []).forEach(function(famille){
    var lien = document.createElement("link");
    lien.rel = "stylesheet";
    lien.href = "https://fonts.googleapis.com/css2?family=" + famille + "&display=swap";
    document.head.appendChild(lien);
  });
  if(theme.css){
    var style = document.createElement("style");
    style.textContent = theme.css;
    document.head.appendChild(style);
  }
}

/* ==========================================================================
   CHARGEMENT DES DONNÉES — remplace donnees.js.
   Lit le slug du voyage dans l'URL (?voyage=salo2026), interroge Supabase,
   transforme les lignes en la même forme d'objets JS que l'ancien
   donnees.js (voir mapping ci-dessous, calé sur
   supabase/migrations/0001_init.sql), puis démarre le moteur de rendu.
   ========================================================================== */
(function chargerEtDemarrer(){
  "use strict";

  /* Lu avant toute autre chose, y compris avant la création du client
     Supabase : supabase-js consomme et nettoie le fragment d'URL dès
     l'initialisation (detectSessionInUrl), il ne serait déjà plus lisible
     une ligne plus bas. */
  var paramsFragment = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var typeLienAuth = paramsFragment.get("type");

  /* Deux projets Supabase distincts (prod/dev, voir CLAUDE.md « Environnements »)
     — aucun build, donc le choix se fait au runtime par nom d'hôte plutôt
     que par variable d'environnement. Seul le vrai domaine de production
     touche les données famille réelles ; tout le reste (localhost,
     prévisualisations Netlify, autre domaine) retombe sur dev par défaut,
     pour ne jamais pouvoir l'atteindre par accident. */
  var ENVIRONNEMENTS = {
    prod: { url: "https://cgxnrgkalhfyfkpesshq.supabase.co", cle: "sb_publishable_fbZPyz9G6UIBWwU00phJig_fQegJUl9" },
    dev:  { url: "https://ozjbkpgoatagqyrlxdry.supabase.co", cle: "sb_publishable_Jz82ewEk0V8Qdq-6jRSXQg_WMxjVo5h" }
  };
  var HOTE_PRODUCTION = "salo2026.netlify.app";
  var env = window.location.hostname === HOTE_PRODUCTION ? ENVIRONNEMENTS.prod : ENVIRONNEMENTS.dev;
  var URL_PROJET = env.url;
  var CLE_PUBLISHABLE = env.cle;
  /* Clé publique par construction (voir CLAUDE.md du projet) : la sécurité
     réelle est assurée par les policies RLS côté Supabase, pas par le
     secret de cette clé. */
  var supabase = window.supabase.createClient(URL_PROJET, CLE_PUBLISHABLE);

  var params = new URLSearchParams(window.location.search);
  var slug = params.get("voyage") || "salo2026";

  var zoneChargement = document.createElement("div");
  zoneChargement.id = "chargement-carnet";
  zoneChargement.style.cssText = "padding:80px 22px;text-align:center;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1A1A18;";
  zoneChargement.textContent = "Chargement…";
  document.body.appendChild(zoneChargement);

  function afficherErreur(message){
    zoneChargement.textContent = message;
  }

  /* --- accueil d'une invitation / d'une récupération de mot de passe ----
     Supabase-js consomme automatiquement le jeton posé dans le fragment
     d'URL par le lien reçu par e-mail (detectSessionInUrl, activé par
     défaut) et pose une session — mais ne demande jamais de mot de passe
     lui-même. `type=invite` (premier accès) ou `type=recovery` (mot de
     passe oublié) reste lisible dans le fragment le temps de ce chargement :
     on s'en sert pour savoir s'il faut intercepter le démarrage normal du
     carnet et proposer l'écran « Choisissez votre mot de passe » avant
     toute chose — personne, pas même l'organisateur, ne connaît ensuite
     le mot de passe choisi. Même facture visuelle que le dialogue de
     connexion (.famille-pw-*, voir demarrerCarnet), en pleine page
     puisqu'il n'y a encore aucun carnet chargé derrière. */
  function nettoyerFragmentAuth(){
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }

  function gererLienAuth(type){
    supabase.auth.getSession().then(function(resSession){
      var session = resSession.data && resSession.data.session;
      if(!session){
        nettoyerFragmentAuth();
        afficherErreur("Ce lien n'est plus valide — il a peut-être déjà été utilisé, ou a expiré. Demandez un nouveau lien.");
        return;
      }
      afficherFormulaireNouveauMotDePasse(session.user.email, type);
    });
  }

  /* ICONES est défini à l'intérieur de demarrerCarnet, hors de portée
     ici : les deux seules icônes nécessaires (œil ouvert/barré) sont
     reprises telles quelles plutôt que d'exposer tout ICONES plus tôt. */
  function icooOeil(interieur){
    return '<svg class="iico" viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
           'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ' +
           'aria-hidden="true">' + interieur + '</svg>';
  }
  var ICOO_OEIL = icooOeil('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/>');
  var ICOO_OEIL_BARRE = icooOeil('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/><line x1="4" y1="4" x2="20" y2="20"/>');

  function afficherFormulaireNouveauMotDePasse(email, type){
    zoneChargement.innerHTML = "";
    zoneChargement.style.cssText = "";

    var overlay = document.createElement("div");
    overlay.className = "famille-pw-overlay";
    var boite = document.createElement("div");
    boite.className = "famille-pw-boite";
    boite.setAttribute("role", "dialog");
    boite.setAttribute("aria-labelledby", "nouveau-mdp-titre");
    overlay.appendChild(boite);

    var titre = document.createElement("p");
    titre.className = "famille-pw-titre";
    titre.id = "nouveau-mdp-titre";
    titre.textContent = (type === "recovery" ? "Choisissez un nouveau mot de passe" : "Bienvenue — choisissez votre mot de passe")
      + " (" + email + ")";
    boite.appendChild(titre);

    function creerChampMotDePasse(placeholder, autocomplete){
      var champ = document.createElement("div");
      champ.className = "famille-pw-champ";
      champ.style.marginTop = "8px";
      var input = document.createElement("input");
      input.type = "password";
      input.className = "famille-pw-input";
      input.placeholder = placeholder;
      input.autocomplete = autocomplete;
      input.setAttribute("autocorrect", "off");
      input.setAttribute("autocapitalize", "off");
      input.spellcheck = false;
      champ.appendChild(input);

      var boutonOeil = document.createElement("button");
      boutonOeil.type = "button";
      boutonOeil.className = "famille-pw-oeil";
      boutonOeil.setAttribute("aria-label", "Afficher le mot de passe");
      boutonOeil.innerHTML = ICOO_OEIL;
      boutonOeil.addEventListener("click", function(){
        var revele = input.type === "text";
        input.type = revele ? "password" : "text";
        boutonOeil.innerHTML = revele ? ICOO_OEIL : ICOO_OEIL_BARRE;
        boutonOeil.setAttribute("aria-label", revele ? "Afficher le mot de passe" : "Masquer le mot de passe");
        boutonOeil.classList.toggle("actif", !revele);
        input.focus();
      });
      champ.appendChild(boutonOeil);
      boite.appendChild(champ);
      return input;
    }

    var inputMdp = creerChampMotDePasse("Nouveau mot de passe", "new-password");
    var inputMdpConfirme = creerChampMotDePasse("Confirmez le mot de passe", "new-password");

    var erreur = document.createElement("p");
    erreur.className = "famille-pw-erreur";
    erreur.hidden = true;
    boite.appendChild(erreur);

    var actions = document.createElement("div");
    actions.className = "famille-pw-actions";
    var boutonValider = document.createElement("button");
    boutonValider.type = "button";
    boutonValider.className = "famille-pw-valider";
    boutonValider.textContent = "Valider";
    actions.appendChild(boutonValider);
    boite.appendChild(actions);

    function valider(){
      var mdp = inputMdp.value;
      var mdpConfirme = inputMdpConfirme.value;
      if(!mdp || mdp.length < 6){
        erreur.textContent = "Le mot de passe doit faire au moins 6 caractères.";
        erreur.hidden = false;
        return;
      }
      if(mdp !== mdpConfirme){
        erreur.textContent = "Les deux mots de passe ne correspondent pas.";
        erreur.hidden = false;
        return;
      }
      boutonValider.disabled = true;
      supabase.auth.updateUser({ password: mdp }).then(function(res){
        if(res.error){
          boutonValider.disabled = false;
          erreur.textContent = res.error.message || "Impossible d'enregistrer ce mot de passe.";
          erreur.hidden = false;
          return;
        }
        nettoyerFragmentAuth();
        location.reload();
      });
    }
    boutonValider.addEventListener("click", valider);
    inputMdp.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); inputMdpConfirme.focus(); }
    });
    inputMdpConfirme.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); valider(); }
    });

    zoneChargement.appendChild(overlay);
    inputMdp.focus();
  }

  /* --- noms de mois français, pour reconstituer dow/num/mois depuis la
     colonne `date` (l'ancien donnees.js les écrivait à la main). --------- */
  var JOURS_SEMAINE = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
  var NOMS_MOIS = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
    "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

  function decoderEntitesTexte(value){
    var noeud=document.createElement("textarea");
    noeud.innerHTML=String(value == null ? "" : value);
    return noeud.value;
  }

  function mapperJournee(ligne){
    /* new Date("YYYY-MM-DD") est interprété en UTC par le moteur JS ;
       on ajoute l'heure locale midi pour éviter tout décalage de jour
       selon le fuseau du navigateur. */
    var d = new Date(ligne.date + "T12:00:00");
    return {
      id: ligne.ancre,
      /* uuid réel de la ligne journees, distinct de `id` (l'ancre texte) —
         nécessaire pour toute écriture qui référence journees(id) en FK
         côté Supabase (ex. photos.journee_id), alors que `id` sert
         partout ailleurs dans ce fichier comme identifiant d'affichage. */
      uuid: ligne.id,
      date: ligne.date,
      dow: JOURS_SEMAINE[d.getDay()],
      num: String(d.getDate()),
      mois: NOMS_MOIS[d.getMonth()],
      lat: ligne.lat,
      lon: ligne.lon,
      rail1: ligne.rail1,
      rail2: ligne.rail2,
      cat: ligne.categorie,
      badge: ligne.badge,
      intensite: ligne.intensite,
      star: !!ligne.star,
      eclipse: !!ligne.eclipse,
      anniversaire: !!ligne.anniversaire,
      titre: decoderEntitesTexte(ligne.titre),
      accroche: ligne.accroche,
      fil: ligne.fil || [],
      pratique: ligne.pratique || null,
      carte: ligne.carte || [],
      illustration: ligne.illustration || [],
      manger: ligne.manger || null,
      /* `regarder` (ancien donnees.js) = table observations, triée par
         ordre. Le champ `ou`, `niveau` et `quoi` sont conservés à l'identique. */
      regarder: (ligne.observations || [])
        .slice()
        .sort(function(a, b){ return a.ordre - b.ordre; })
        .map(function(o){ return { id: o.id, ou: o.ou, niveau: o.niveau, quoi: o.quoi }; }),
      /* `lieux` (ancien donnees.js) = table lieux, triée par ordre. */
      lieux: (ligne.lieux || [])
        .slice()
        .sort(function(a, b){ return a.ordre - b.ordre; })
        .map(function(l){ return { id: l.id, nom: l.nom, quoi: l.quoi, pratique: l.pratique, requete: l.requete }; }),
      optionsTitre: ligne.options_titre,
      options: ligne.options || [],
      notes: ligne.notes || [],
      /* `chapitre` : {numero, titre} en jsonb (migration 0014), même forme
         que donnees.js — plus d'écart de mapping à compenser ici. */
      chapitre: ligne.chapitre || null,
      /* la bonne réponse n'est jamais envoyée ici : elle vit dans
         quiz_reponses, réservée aux comptes admin par RLS (voir
         supabase/migrations/0008) — voir admin/index.html pour la
         correction. */
      quiz: (ligne.quiz_questions || [])
        .slice()
        .sort(function(a, b){ return a.ordre - b.ordre; })
        .map(function(q){
          return { id: q.id, question: q.question, choix: q.choix };
        })
    };
  }

  function mapperBadge(ligne, observationsParId){
    var badge = {
      nom: ligne.nom,
      resume: ligne.resume,
      icone: ligne.icone
    };
    if(ligne.seuil_niveau3 != null) badge.seuilNiveau3 = ligne.seuil_niveau3;
    if(ligne.seuil_total != null) badge.seuilTotal = ligne.seuil_total;
    if(ligne.seuil_journees_corrigees != null) badge.seuilJourneesCorrigees = ligne.seuil_journees_corrigees;
    if(ligne.seuil_points_quiz != null) badge.seuilPointsQuiz = ligne.seuil_points_quiz;
    if(ligne.seuil_photos != null) badge.seuilPhotos = ligne.seuil_photos;
    var conditions = (ligne.badge_conditions || [])
      .map(function(c){ return observationsParId[c.observation_id]; })
      .filter(Boolean);
    if(conditions.length) badge.conditions = conditions;
    return badge;
  }

  if(typeLienAuth === "invite" || typeLienAuth === "recovery"){
    gererLienAuth(typeLienAuth);
    return;
  }

  /* Session famille : lue avant toute requête de contenu, pour que le
     jeton d'authentification (s'il existe déjà, restauré par supabase-js
     depuis son propre localStorage) soit bien joint aux requêtes qui
     suivent — c'est lui qui fait apparaître le contenu visibilite=
     "famille" dans les réponses, via les policies RLS. `sessionFamille`
     ne sert qu'à l'affichage (voir demarrerCarnet) : la vraie restriction
     est appliquée par Supabase, pas par ce fichier. */
  supabase.auth.getSession().then(function(resSession){
    var session = resSession.data && resSession.data.session;
    var sessionFamille = !!session;
    var utilisateurId = session ? session.user.id : null;

    supabase
    .from("voyages")
    .select("*")
    .eq("slug", slug)
    .maybeSingle()
    .then(function(res){
      if(res.error) throw res.error;
      var voyage = res.data;
      if(!voyage){
        afficherErreur("Voyage introuvable pour « " + slug + " ». Vérifiez le paramètre ?voyage= dans l'URL.");
        return;
      }
      appliquerTheme(voyage.theme);

      return supabase
        .from("journees")
        .select("*, observations(*), quiz_questions(*), lieux(*)")
        .eq("voyage_id", voyage.id)
        .order("ordre", { ascending: true })
        .then(function(resJournees){
          if(resJournees.error) throw resJournees.error;

          return supabase
            .from("badges")
            .select("*, badge_conditions(*)")
            .eq("voyage_id", voyage.id)
            .order("ordre", { ascending: true })
            .then(function(resBadges){
              if(resBadges.error) throw resBadges.error;

              /* index { journee_id + "||" + ou } -> {jour, ou} pour résoudre
                 les badge_conditions (qui référencent une observation par id)
                 vers la forme { jour, ou } attendue par idPourCondition()
                 dans le moteur de rendu — c'est ce format-là, pas l'id
                 d'observation, que demarrerCarnet() sait consommer. */
              var observationsParId = {};
              var journeeParId = {};
              (resJournees.data || []).forEach(function(j){ journeeParId[j.id] = j; });
              (resJournees.data || []).forEach(function(j){
                (j.observations || []).forEach(function(o){
                  observationsParId[o.id] = { jour: j.ancre, ou: o.ou };
                });
              });

              var JOURS = (resJournees.data || []).map(mapperJournee);
              var BADGES = (resBadges.data || []).map(function(b){ return mapperBadge(b, observationsParId); });
              var CARNET = {
                /* "eyebrow" n'a pas de colonne dédiée dans le schéma SQL :
                   valeur fixe, cohérente avec l'esprit du carnet d'origine. */
                eyebrow: "Carnet de route",
                titre: voyage.titre,
                titreSuite: voyage.titre_suite,
                sousTitre: voyage.sous_titre,
                dateDebut: voyage.date_debut,
                dateFin: voyage.date_fin,
                destination: voyage.destination || "",
                friseLegende: voyage.frise_legende,
                aVerifier: voyage.a_verifier
              };

              /* progression du membre famille connecté (réponses au quiz
                 déjà envoyées, corrections déjà reçues) : lue une fois au
                 démarrage, voir fusionnerProgressionQuiz. Absente pour un
                 visiteur non famille (utilisateurId null) ou un membre qui
                 n'a encore jamais répondu (maybeSingle → null). */
              var chargerProgression = utilisateurId
                ? supabase.from("progression").select("*")
                    .eq("voyage_id", voyage.id).eq("utilisateur_id", utilisateurId).maybeSingle()
                : Promise.resolve({ data: null });

              /* rôle admin (voir supabase/migrations/0008) : pilote
                 uniquement l'affichage de l'onglet Admin ci-dessous, la
                 vraie restriction d'accès aux données de correction est
                 imposée par les policies RLS, pas par ce fichier. */
              var chargerRole = utilisateurId
                ? supabase.from("membres_famille").select("role")
                    .eq("voyage_id", voyage.id).eq("utilisateur_id", utilisateurId).maybeSingle()
                : Promise.resolve({ data: null });

              /* assurance auto : table à part, réservée aux membres famille
                 par RLS (voir migration 0015 — numéro client/contrat n'ont
                 jamais eu leur place dans voyages.urgences, publique sans
                 restriction). maybeSingle() renvoie null pour un visiteur
                 non famille : la section correspondante reste simplement
                 absente côté rendu (voir construirePanelUrgences). */
              var chargerUrgencesFamille = utilisateurId
                ? supabase.from("urgences_famille").select("assurance_auto")
                    .eq("voyage_id", voyage.id).maybeSingle()
                : Promise.resolve({ data: null });

              /* photos famille (voir supabase/migrations/0018) : les siennes
                 quelle que soit leur visibilite, plus celles marquees
                 "partagee" par les autres membres — la policy RLS fait deja
                 ce tri, select("*") suffit ici. Absent pour un visiteur non
                 famille (utilisateurId null), comme le reste de ce bloc. */
              var chargerPhotos = utilisateurId
                ? supabase.from("photos").select("*")
                    .eq("voyage_id", voyage.id).order("cree_le", { ascending: true })
                : Promise.resolve({ data: null });

              /* surcharges de texte de carnet (voir migration 0020) :
                 RLS limite deja a ses propres lignes, select("*") suffit. */
              var chargerTextesCarnet = utilisateurId
                ? supabase.from("carnet_textes").select("*").eq("voyage_id", voyage.id)
                : Promise.resolve({ data: null });

              /* Préparation additive du carnet (migration 0023). Le modèle
                 historique reste chargé en parallèle pour la compatibilité
                 et pour présenter ses textes comme brouillons `legacy`. */
              var chargerPreparationsCarnet = utilisateurId
                ? supabase.from("carnet_journees")
                    .select("*, carnet_faits_confirmes(*), carnet_photos_selectionnees(*)")
                    .eq("voyage_id", voyage.id)
                : Promise.resolve({ data: null });

              return Promise.all([chargerProgression, chargerRole, chargerUrgencesFamille, chargerPhotos, chargerTextesCarnet, chargerPreparationsCarnet]).then(function(res){
                var resProgression = res[0];
                var resRole = res[1];
                var resUrgencesFamille = res[2];
                var resPhotos = res[3];
                var resTextesCarnet = res[4];
                var resPreparationsCarnet = res[5];
                if(resPreparationsCarnet.error) throw resPreparationsCarnet.error;
                var estAdmin = !!(resRole.data && resRole.data.role === "admin");
                var urgences = Object.assign({}, voyage.urgences || {});
                if(resUrgencesFamille.data && resUrgencesFamille.data.assurance_auto){
                  urgences.assuranceAuto = resUrgencesFamille.data.assurance_auto;
                }
                /* zoneChargement retiré seulement après un démarrage réussi :
                   si demarrerCarnet() lève une exception, elle doit encore
                   pouvoir s'afficher dedans via le .catch() plus bas — pas
                   sur un noeud déjà détaché du DOM. */
                demarrerCarnet(JOURS, BADGES, CARNET, slug, supabase, sessionFamille,
                  urgences, voyage.id, utilisateurId, resProgression.data || null, estAdmin,
                  resPhotos.data || [], resTextesCarnet.data || [], resPreparationsCarnet.data || [], URL_PROJET);
                zoneChargement.remove();
              });
            });
        });
    })
    .catch(function(err){
      console.error("Erreur de chargement du carnet :", err);
      afficherErreur("Impossible de charger le carnet (" + slug + ") : " + (err && err.message ? err.message : err));
    });
  });

  /* Service worker : cache l'app shell, les polices et les dernières
     données Supabase chargées, pour que le carnet reste consultable sans
     réseau sur le terrain (voir sw.js pour le détail des stratégies).
     Chemin relatif : le scope suit l'endroit où app/ est servi.

     Rechargement automatique à la mise à jour : sur un téléphone, en
     PWA installée sur l'écran d'accueil surtout, personne ne peut faire
     un rechargement forcé façon Cmd+Maj+R pour contourner le cache.
     controllerchange se déclenche quand un nouveau service worker vient
     de prendre la main (il l'a fait tout seul, skipWaiting + clients.
     claim() dans sw.js) : on recharge la page à cet instant précis, une
     seule fois (refreshing), pour ne jamais tourner en boucle. Un peu
     brusque si on est en train de lire, mais bien plus sûr qu'un
     carnet resté silencieusement périmé pendant tout le voyage. */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(registration){return registration.update();}).catch(function(err){console.error("Échec d'enregistrement du service worker :", err);});
    });
    var refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
})();
</script>
</body>
</html>
