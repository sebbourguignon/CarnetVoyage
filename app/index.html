  /* --- sur place : fiches de lieu consultables sur le terrain, distinctes
     des entrées « à regarder » (des amorces d'observation, pas du contexte).
     Chaque fiche est un accordéon replié par défaut : le nom et le bouton
     Maps restent joignables sans déplier, c'est le geste le plus fréquent
     en marchant. Réutilise lienPlans(), déjà utilisée par .carte-puce. --- */
  function construireItemLieu(j, lieu, index){
    var id = "lieu-" + j.id + "-" + index;
    var item = el("div", "lieu-item");

    var head = el("div", "lieu-head");
    var bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = "lieu-nom-btn";
    bouton.setAttribute("aria-expanded", "false");
    bouton.setAttribute("aria-controls", id);
    bouton.appendChild(el("span", "lieu-chevron", ICONES.chevron));
    bouton.appendChild(el("span", "lieu-nom", lieu.nom));
    bouton.addEventListener("click", function(){
      var ouvrir = !item.classList.contains("open");
      item.classList.toggle("open", ouvrir);
      bouton.setAttribute("aria-expanded", ouvrir ? "true" : "false");
    });
    head.appendChild(bouton);

    var lienMaps = document.createElement("a");
    lienMaps.className = "lieu-maps";
    lienMaps.href = lienPlans(lieu.requete);
    lienMaps.target = "_blank";
    lienMaps.rel = "noopener";
    lienMaps.setAttribute("aria-label", "Ouvrir « " + sansHtml(lieu.nom) + " » dans Google Maps");
    lienMaps.innerHTML = ICONES.carte + "<span>Maps</span>";
    head.appendChild(lienMaps);

    item.appendChild(head);

    var collapse = el("div", "lieu-collapse");
    collapse.id = id;
    var inner = el("div", "lieu-collapse-inner");
    inner.appendChild(el("p", "lieu-quoi", lieu.quoi));
    if(lieu.pratique) inner.appendChild(el("p", "lieu-pratique", lieu.pratique));
    collapse.appendChild(inner);
    item.appendChild(collapse);

    return item;
  }
  function construireLieuxJour(j){
    var wrap = el("div", "block lieux");
    wrap.appendChild(el("h3", null, ICONES.carte + " Sur place"));
    var liste = el("div", "lieu-liste");
    j.lieux.forEach(function(lieu, i){ liste.appendChild(construireItemLieu(j, lieu, i)); });
    wrap.appendChild(liste);
    return wrap;
  }

  /* --- easter egg : la côte de baleine -----------------------------------
     Les mots "côte de baleine" sont tactiles uniquement dans l'observation
     "Arco della Costa" du 4 août (voir donnees.js) : un appui fait
     descendre une côte de baleine en SVG depuis le haut de l'écran, qui se
     balance puis remonte et disparaît sans jamais tomber — la légende
     veut qu'elle ne soit jamais tombée. Un seul exemplaire à la fois.
     Le texte de donnees.js n'est pas modifié : le repérage et l'habillage
     en <span> se font ici, au rendu, dans construireItemRegarder. */
  var MOT_BALEINE_CACHE = "côte de baleine";
  var baleineCacheEnCours = false;

  function svgCoteDeBaleineCachee(){
    var fill = "var(--ink)";
    return (
      '<svg viewBox="0 0 60 100" aria-hidden="true" focusable="false">' +
        '<path d="M30,2 C6,10 2,46 11,74 C15,88 22,96 30,98 L35,98 ' +
          'C28,93 21,86 18,72 C10,44 14,16 35,7 Z" fill="' + fill + '"/>' +
      '</svg>'
    );
  }

  function declencherCoteDeBaleine(){
    if(baleineCacheEnCours) return;
    baleineCacheEnCours = true;

    var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var wrap = document.createElement("div");
    wrap.className = "baleine-cachee";
    wrap.innerHTML = svgCoteDeBaleineCachee();
    document.body.appendChild(wrap);

    var duree = reduit ? 600 : 5000;
    /* réduit : même passage par le point bas, quasi instantané plutôt que
       supprimé — voir declencherEclipseCachee() pour le même principe. */
    var trames = reduit
      ? [
          { transform: "translateY(-120%) rotate(0deg)", offset: 0 },
          { transform: "translateY(8%) rotate(-4deg)", offset: .5 },
          { transform: "translateY(-120%) rotate(0deg)", offset: 1 }
        ]
      : [
          { transform: "translateY(-120%) rotate(0deg)", offset: 0 },
          { transform: "translateY(8%) rotate(0deg)", offset: .18 },
          { transform: "translateY(6%) rotate(-6deg)", offset: .38 },
          { transform: "translateY(9%) rotate(5deg)", offset: .58 },
          { transform: "translateY(6%) rotate(-4deg)", offset: .78 },
          { transform: "translateY(-120%) rotate(0deg)", offset: 1 }
        ];

    var anim = wrap.animate(trames, { duration: duree, easing: "cubic-bezier(0.77,0,0.175,1)" });

    function nettoyer(){
      if(wrap.parentNode) wrap.remove();
      baleineCacheEnCours = false;
    }
    anim.addEventListener("finish", nettoyer);
    anim.addEventListener("cancel", nettoyer);
  }

  /* --- à regarder : contenu de lecture, pas une liste technique — mais
     chaque entrée reste une vraie case à cocher (input natif masqué,
     voir .regarder-checkbox) pour garder focus clavier et lecteur
     d'écran standards. ---------------------------------------------- */
  function construireItemRegarder(j, r, index){
    var id = j.id + "-r" + index;
    var item = document.createElement("label");
    item.className = "regarder-item" + (estCoche(id) ? " checked" : "");
    item.setAttribute("data-regarder-id", id);
    item.setAttribute("data-niveau", String(r.niveau || 1));

    var input = document.createElement("input");
    input.type = "checkbox";
    input.className = "regarder-checkbox";
    input.checked = estCoche(id);
    /* mode public : contenu de lecture seule — la case disparaît (voir
       CSS body.mode-public), disabled empêche aussi tout basculement via
       le <label> englobant. */
    input.disabled = !modeFamille;
    input.setAttribute("aria-label", "Marquer « " + sansHtml(r.ou) + " » comme repéré");
    input.addEventListener("change", function(){ basculerCoche(id); });
    item.appendChild(input);
    item.appendChild(el("span", "regarder-box", null));

    var contenu = el("div", "regarder-content");
    contenu.appendChild(el("p", "ou", r.ou + ' <span class="regarder-pts">+' + pointsEntree(id) + "</span>"));

    var estBaleineCachee = j.id === "d-0804" && r.ou === "Arco della Costa" &&
      r.quoi.indexOf(MOT_BALEINE_CACHE) !== -1;
    var texteQuoi = estBaleineCachee
      ? r.quoi.split(MOT_BALEINE_CACHE).join('<span class="baleine-mot">' + MOT_BALEINE_CACHE + '</span>')
      : r.quoi;
    var pQuoi = el("p", "quoi", texteQuoi);
    contenu.appendChild(pQuoi);
    item.appendChild(contenu);

    if(estBaleineCachee){
      var motBaleine = pQuoi.querySelector(".baleine-mot");
      /* stopPropagation ET preventDefault : le <label> englobant coche sa
         case dès qu'un clic l'atteint, même si stopPropagation empêche cet
         appui de continuer à remonter — le navigateur déclenche ce
         basculement comme une action par défaut liée à l'évènement
         d'origine, pas seulement à sa remontée. preventDefault est donc
         indispensable ici, en plus de stopPropagation qui isole le reste
         de la ligne (elle continue de cocher normalement en mode famille
         pour tout appui hors de ce span). */
      if(motBaleine) motBaleine.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        declencherCoteDeBaleine();
      });
    }

    return item;
  }
  function construireRegarderJour(j, sansTitre){
    var wrap = el("div", "block regarder");
    wrap.setAttribute("data-jour-regarder", j.id);
    if(!sansTitre) wrap.appendChild(el("h3", null, ICONES.regarder + " À regarder"));

    var progression = el("div", "regarder-progress");
    progression.appendChild(el("div", "regarder-progress-bar"));
    wrap.appendChild(progression);
    wrap.appendChild(el("p", "regarder-progress-label"));

    j.regarder.forEach(function(r, i){ wrap.appendChild(construireItemRegarder(j, r, i)); });

    majProgressionRegarder(wrap, j);
    return wrap;
  }

  /* --- quiz : questions à choix multiples, sous le bloc « À regarder ».
     Chaque choix est un bouton plutôt qu'un radio : plus simple à styler
     bonne/mauvaise après correction, et une seule tentative rend inutile
     la sémantique de groupe d'un vrai radio. --------------------------- */
  var POINTS_PAR_BONNE_REPONSE_QUIZ = 3;
  /* nombre de journées dont le quiz est intégralement corrigé — sert au
     badge "Assidu". Le seuil porte sur les journées qui ONT un quiz
     (j.quiz non vide), pas sur les 22 journées du carnet. */
  function journeesQuizCorrigees(){
    return JOURS.filter(function(j){
      if(!j.quiz || !j.quiz.length) return false;
      return j.quiz.every(function(q){
        var e = etatQuiz[q.id];
        return !!(e && e.corrige);
      });
    }).length;
  }
  /* total de points gagnés sur l'ensemble du quiz — sert au badge "Érudit". */
  function pointsQuizObtenus(){
    var total = 0;
    JOURS.forEach(function(j){
      (j.quiz || []).forEach(function(q){
        var e = etatQuiz[q.id];
        if(e && e.corrige && e.correcte) total += POINTS_PAR_BONNE_REPONSE_QUIZ;
      });
    });
    return total;
  }
  /* dépli des questions corrigées : purement transitoire (jamais dans
     etatQuiz/localStorage), remis à zéro à chaque rechargement — seul le
     résultat compte d'une visite à l'autre, pas l'état de relecture. */
  var quizDeplies = {};
  function remplirResumeQuiz(resumeEl, q, e){
    resumeEl.innerHTML = "";
    if(!e.correcte){
      var mauvaise = el("span", "mauvaise");
      mauvaise.textContent = "✗ " + (e.reponse != null ? q.choix[e.reponse] : "?");
      resumeEl.appendChild(mauvaise);
      resumeEl.appendChild(el("span", "fleche", " → "));
    }
    var bonne = el("span", "bonne");
    bonne.textContent = "✓ " + (q.choix[e.indexCorrect] || "?");
    resumeEl.appendChild(bonne);
  }
  function construireQuestionQuiz(j, q, index, wrap){
    var id = q.id;
    var e = etatQuiz[id];
    var corrige = !!(e && e.corrige);

    var item = el("div", "quiz-item" + (corrige ? " corrige" : ""));
    item.setAttribute("data-quiz-id", id);

    if(corrige){
      var deplie = !!quizDeplies[id];
      var bouton = document.createElement("button");
      bouton.type = "button";
      bouton.className = "quiz-compact";
      bouton.setAttribute("aria-expanded", deplie ? "true" : "false");
      bouton.appendChild(el("span", "quiz-compact-question", q.question));
      var resume = el("p", "quiz-resume");
      remplirResumeQuiz(resume, q, e);
      bouton.appendChild(resume);
      bouton.addEventListener("click", function(){
        quizDeplies[id] = !deplie;
        remplirBlocQuiz(wrap, j);
      });
      item.appendChild(bouton);

      if(deplie){
        var liste = el("div", "quiz-choix quiz-choix-lecture");
        q.choix.forEach(function(texteChoix, i){
          var b = document.createElement("button");
          b.type = "button";
          var cls = "quiz-choix-item";
          if(e.reponse === i) cls += " choisi";
          if(e.indexCorrect === i) cls += " bonne";
          if(e.reponse === i && !e.correcte) cls += " mauvaise";
          b.className = cls;
          b.textContent = texteChoix;
          b.disabled = true;
          liste.appendChild(b);
        });
        item.appendChild(liste);
      }
      return item;
    }

    item.appendChild(el("p", "quiz-question", q.question));

    var liste = el("div", "quiz-choix");
    q.choix.forEach(function(texteChoix, i){
      var bouton = document.createElement("button");
      bouton.type = "button";
      var cls = "quiz-choix-item";
      if(e && e.reponse === i) cls += " choisi";
      bouton.className = cls;
      bouton.textContent = texteChoix;
      bouton.addEventListener("click", function(){ choisirReponseQuiz(id, i); });
      liste.appendChild(bouton);
    });
    item.appendChild(liste);

    return item;
  }
  /* reconstruit entièrement le bloc (plutôt que de patcher des classes,
     comme pour .regarder-item) : la transition « corrigé » change trop
     de choses à la fois — désactivation, bonne/mauvaise réponse, score —
     pour valoir la peine d'être suivie incrémentalement. */
  function remplirBlocQuiz(wrap, j){
    wrap.innerHTML = "";

    var total = j.quiz.length, corrigees = 0, bonnes = 0;
    j.quiz.forEach(function(q){
      var e = etatQuiz[q.id];
      if(e && e.corrige){ corrigees++; if(e.correcte) bonnes++; }
    });

    var titre = el("h3", null, ICONES.quiz + " Quiz");
    if(corrigees){
      titre.appendChild(el("span", "quiz-compteur",
        "— " + bonnes + " / " + corrigees + " · " + (bonnes * POINTS_PAR_BONNE_REPONSE_QUIZ) + " pts"));
    }
    wrap.appendChild(titre);

    j.quiz.forEach(function(q, i){ wrap.appendChild(construireQuestionQuiz(j, q, i, wrap)); });

    /* un seul bouton pour toute la journée plutôt qu'un par question :
       on répond aux trois avant de trancher, pas question par question.
       Valide toutes les réponses déjà sélectionnées mais pas encore
       corrigées ; celles laissées sans réponse restent ouvertes pour
       plus tard (voir validerReponsesJour). */
    var enAttente = j.quiz.filter(function(q){
      var e = etatQuiz[q.id];
      return e && e.reponse != null && !e.corrige;
    });
    if(enAttente.length){
      var boutonValider = document.createElement("button");
      boutonValider.type = "button";
      boutonValider.className = "quiz-valider";
      boutonValider.textContent = enAttente.length > 1 ? "Valider mes réponses" : "Valider ma réponse";
      boutonValider.addEventListener("click", function(){
        boutonValider.disabled = true;
        boutonValider.textContent = "Correction…";
        validerReponsesJour(j);
      });
      wrap.appendChild(boutonValider);
    }

    /* auto-correction (voir repondre_quiz), chacun se corrige lui-même en
       validant sa réponse — pas de correction à distance à attendre. */
    var pied = el("div", "quiz-pied");
    pied.appendChild(el("p", "quiz-score", corrigees ?
      bonnes + " / " + corrigees + " bonnes réponses · " + corrigees + " / " + total + " corrigées" :
      total + " question" + (total > 1 ? "s" : "")));

    wrap.appendChild(pied);
  }
  function construireBlocQuiz(j){
    var wrap = el("div", "block quiz");
    wrap.setAttribute("data-jour-quiz", j.id);
    remplirBlocQuiz(wrap, j);
    return wrap;
  }
  function rafraichirQuiz(){
    Array.prototype.forEach.call(document.querySelectorAll(".quiz[data-jour-quiz]"), function(wrap){
      var j = trouverJour(wrap.getAttribute("data-jour-quiz"));
      if(j) remplirBlocQuiz(wrap, j);
    });
    /* une correction de quiz peut débloquer "Assidu" ou "Érudit" — mêmes
       rafraîchissements de badges qu'après une coche de regarder. */
    majBlocChasseTab();
    majResumeChasseAccueil();
  }

  /* --- le fil sait quelle heure il est, mais seulement sur la journée
     d'aujourd'hui (comparaison sur l'id "d-MMJJ", comme jourDuJour()).
     dateAujourdhui() reste le seul point d'accès à l'horloge. --------- */
  function minutesDepuisTexte(h){
    var m = /^(\d{1,2})\s*h\s*(\d{2})$/.exec(String(h || "").trim());
    if(!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function construireRepereMaintenant(){
    var li = el("li", "now-marker");
    li.appendChild(el("span", "t", "●"));
    li.appendChild(el("span", "now-label", "Maintenant"));
    return li;
  }
  function construireBlocFil(j){
    var bFil = el("div", "block");
    bFil.appendChild(el("h3", null, ICONES.fil + " Fil principal"));
    var ul = el("ul", "thread");

    var estAujourdhui = j.id === idAujourdhui();
    var nowMin = null, curIdx = -1;
    if(estAujourdhui){
      var d = dateAujourdhui();
      nowMin = d.getHours() * 60 + d.getMinutes();
      j.fil.forEach(function(e, i){
        var m = minutesDepuisTexte(e.h);
        if(m !== null && m <= nowMin) curIdx = i;
      });
    }

    j.fil.forEach(function(e, i){
      if(estAujourdhui && curIdx === -1 && i === 0){
        ul.appendChild(construireRepereMaintenant());
      }
      var li = document.createElement("li");
      if(estAujourdhui){
        if(i < curIdx) li.className = "passee";
        else if(i === curIdx) li.className = "encours";
      }
      li.appendChild(el("span", "t", e.h));
      li.appendChild(el("span", null, e.texte));
      ul.appendChild(li);
      if(estAujourdhui && i === curIdx){
        ul.appendChild(construireRepereMaintenant());
      }
    });

    bFil.appendChild(ul);
    return bFil;
  }

  /* --- météo (Open-Meteo, sans clé ni compte) --------------------------
     Un seul appel par position (lat/lon arrondis au centième, ~1 km),
     quel que soit le nombre de journées qui la partagent — les 6 jours
     à Salò par exemple : past_days + forecast_days couvrent tout le
     voyage (22 jours) en un seul passage par lieu, jamais un appel par
     jour. Jamais bloquant : hors connexion ou API indisponible, la
     pastille météo disparaît simplement, comme le reste du carnet (voir
     CLAUDE.md « jamais de donnée inventée » — jamais de repli inventé
     non plus ici, on affiche ce qu'on sait ou rien). */
  var CACHE_METEO = {};
  /* la liste Agenda affiche les 24 jours d'un coup, sur ~18 lieux
     distincts : sans étalement, ça part en rafale et Open-Meteo répond
     429 (trop de requêtes à la même seconde) sur les derniers appels.
     300ms entre chaque NOUVEAU lieu (pas chaque jour, les doublons de
     lieu réutilisent déjà la même promesse) suffit à rester sous le
     radar sans que l'attente se voie à l'écran. */
  var meteoFileAttente = 0;
  function chargerJoursMeteo(lat, lon){
    var cle = lat.toFixed(2) + "," + lon.toFixed(2);
    if(!CACHE_METEO[cle]){
      var delai = meteoFileAttente * 300;
      meteoFileAttente++;
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
        "&daily=weathercode,temperature_2m_max,temperature_2m_min&current_weather=true" +
        "&past_days=92&forecast_days=16&timezone=auto";
      CACHE_METEO[cle] = new Promise(function(resolve){ setTimeout(resolve, delai); })
        .then(function(){ return fetch(url); })
        .then(function(r){ if(!r.ok) throw new Error("météo HTTP " + r.status); return r.json(); })
        .catch(function(e){ console.error("Météo indisponible :", e); return null; });
    }
    return CACHE_METEO[cle];
  }
  function isoAujourdhui(){
    var d = dateAujourdhui();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  /* résout la météo d'une journée précise : conditions actuelles pour
     aujourd'hui (current_weather), relevé réel pour un jour déjà passé,
     prévision pour un jour à venir — la même réponse Open-Meteo porte
     les trois, il n'y a qu'à choisir la bonne entrée selon la date. */
  function chargerMeteo(j){
    if(j.lat == null || j.lon == null) return Promise.resolve(null);
    return chargerJoursMeteo(j.lat, j.lon).then(function(data){
      if(!data || !data.daily) return null;
      var idx = (data.daily.time || []).indexOf(j.date);
      if(idx === -1) return null;
      var auj = isoAujourdhui();
      if(j.date === auj && data.current_weather){
        return {
          temperature: Math.round(data.current_weather.temperature),
          code: data.current_weather.weathercode,
          periode: "actuel"
        };
      }
      return {
        temperature: Math.round((data.daily.temperature_2m_max[idx] + data.daily.temperature_2m_min[idx]) / 2),
        code: data.daily.weathercode[idx],
        periode: j.date < auj ? "passe" : "prevu"
      };
    });
  }
  /* codes Open-Meteo (WMO) regroupés en 4 pictogrammes plutôt qu'un jeu
     complet — assez pour situer un jour d'un coup d'œil, sans viser une
     iconographie météo exhaustive. */
  function iconeMeteo(code){
    if(code === 0) return ICONES.meteoSoleil;
    if(code >= 95) return ICONES.meteoOrage;
    if((code >= 51 && code <= 82) || (code >= 71 && code <= 77)) return ICONES.meteoPluie;
    return ICONES.meteoNuage;
  }
  function creerItemMeteo(j){
    if(j.lat == null || j.lon == null) return null;
    var item = el("span", "day-synth-item meteo");
    item.innerHTML = ICONES.meteoNuage + " …";
    chargerMeteo(j).then(function(m){
      if(!m){ item.remove(); return; }
      var libelle = m.periode === "passe" ? " (relevé)" : m.periode === "prevu" ? " (prévu)" : "";
      item.innerHTML = iconeMeteo(m.code) + " " + m.temperature + "°" + libelle;
    });
    return item;
  }
  /* version compacte (icône + température seule, sans libellé "prévu"/
     "relevé") pour les cartes de la liste Agenda et de l'accueil
     (Aujourd'hui/Demain) — même style que .cdist déjà en place, pas le
     format pilule de la vue détail. Même cache par position que
     creerItemMeteo : afficher toute la liste des 24 jours ne coûte
     qu'un appel réseau par lieu distinct, pas par carte. */
  function creerItemMeteoCompact(j){
    if(j.lat == null || j.lon == null) return null;
    var item = el("span", "cdist meteo");
    item.innerHTML = "…";
    chargerMeteo(j).then(function(m){
      if(!m){ item.remove(); return; }
      item.innerHTML = iconeMeteo(m.code) + " " + m.temperature + "°";
    });
    return item;
  }

  /* --- bandeau de synthèse : une ligne d'items de même niveau, calculés
     depuis l'existant. Sous le titre et l'accroche, avant le premier
     bloc. Chaque item est omis si sa donnée est absente — aucune valeur
     inventée. rail1/rail2 ne contiennent pas toujours une distance
     ("Sur place", "10 min") : affichés tels quels, aucun parsing. Le
     lien « à voir » défile jusqu'au bloc .regarder du même jour ; il
     cherche dans `corps`, le conteneur partagé par les deux, plutôt que
     par id, pour ne jamais viser le mauvais jour si Aujourd'hui et le
     détail plein écran contiennent tous les deux le même jour. */
  function construireBandeauSynthese(j, corps){
    var wrap = el("div", "day-synth");

    if(j.rail1 || j.rail2){
      var iTrajet = el("span", "day-synth-item");
      var vTrajet = el("span", null, ICONES.carte + " " + (j.rail1 || ""));
      if(j.rail2) vTrajet.appendChild(el("span", "day-synth-sub", "· " + j.rail2));
      iTrajet.appendChild(vTrajet);
      wrap.appendChild(iTrajet);
    }

    var iMeteo = creerItemMeteo(j);
    if(iMeteo) wrap.appendChild(iMeteo);

    if(j.pratique && j.pratique.chien){
      var niveau = iconeNiveauChien(NIVEAU_CHIEN[j.pratique.chien] || 0);
      var iChien = el("span", "day-synth-item chien " + (CHIEN_CLASSES[j.pratique.chien] || ""),
        ICONES.chien + " " + niveau + " " + j.pratique.chien);
      iChien.addEventListener("pointerdown", demarrerAppuiLongChihuahuaCache);
      wrap.appendChild(iChien);
    }

    if(j.regarder && j.regarder.length){
      var voir = document.createElement("button");
      voir.type = "button";
      voir.className = "day-synth-item voir";
      var n = j.regarder.length;
      voir.innerHTML = ICONES.regarder + " " + n + (n > 1 ? " choses à voir" : " chose à voir");
      voir.addEventListener("click", function(){
        var cible = corps.querySelector(".regarder");
        if(cible) cible.scrollIntoView({ block: "start" });
      });
      wrap.appendChild(voir);
    }

    if(j.pratique && j.pratique.ztl){
      wrap.appendChild(el("span", "day-synth-item ztl", ICONES.ztl + " ZTL"));
    }

    if(j.anniversaire){
      wrap.appendChild(el("span", "day-synth-item anniversaire", ICONES.anniversaire + " Anniversaire"));
    }

    /* le lien mène à l'onglet À réserver, masqué en mode public : la
       pastille elle-même doit disparaître, pas juste devenir inerte —
       sinon elle reste une trace de navigation vers un onglet caché. */
    if(modeFamille && jourADesActions(j)){
      var a = document.createElement("a");
      a.className = "day-synth-item reserver";
      a.href = "#reserver-" + idCourt(j);
      a.innerHTML = ICONES.reserver + " À réserver";
      wrap.appendChild(a);
    }

    return wrap.children.length ? wrap : null;
  }

  /* --- easter egg : le chihuahua caché --------------------------------
     Appui long (~800 ms) sur la pastille chien du bandeau de synthèse :
     une silhouette de chihuahua traverse le bas de l'écran, de droite à
     gauche, au-dessus de la barre d'onglets. Un seul à la fois.
     Le suivi du déplacement (pointermove) annule la détection au-delà de
     10 px : sans ça, un simple défilement vertical du doigt sur la
     pastille déclencherait l'appui long à tort. */
  var chihuahuaCacheEnCours = false;

  /* tête du chihuahua (crâne, oreille, museau, œil), commune aux deux poses
     dessinées dans l'appli : celle qui trotte ci-dessous (svgChihuahuaCache,
     inchangée par ce factoring) et celle assise de profil du colophon
     (svgChihuahuaAssis). Ancrée sur un crâne de centre (50,28) — un appelant
     qui a besoin d'une autre position l'entoure d'un <g transform="translate(…)">. */
  function chihuahuaTete(fill){
    return (
      '<circle cx="50" cy="28" r="15" fill="' + fill + '"/>' +
      '<path d="M40,16 C36,4 46,-4 54,12 C50,16 44,17 40,16 Z" fill="' + fill + '"/>' +
      '<ellipse cx="32" cy="35" rx="10" ry="7" fill="' + fill + '"/>' +
      '<circle cx="38" cy="25" r="2.2" fill="var(--paper)"/>'
    );
  }

  function svgChihuahuaCache(){
    var fill = "var(--ink)";
    return (
      '<svg viewBox="0 0 150 70" aria-hidden="true" focusable="false">' +
        '<ellipse cx="95" cy="44" rx="32" ry="13" fill="' + fill + '"/>' +
        '<rect x="64" y="52" width="6" height="16" rx="3" fill="' + fill + '"/>' +
        '<rect x="76" y="52" width="6" height="16" rx="3" fill="' + fill + '"/>' +
        '<rect x="112" y="52" width="6" height="16" rx="3" fill="' + fill + '"/>' +
        '<rect x="124" y="52" width="6" height="16" rx="3" fill="' + fill + '"/>' +
        '<path class="chihuahua-queue" style="transform-origin:122px 34px" ' +
          'd="M122,34 C132,28 140,20 145,11" fill="none" stroke="' + fill + '" stroke-width="5" stroke-linecap="round"/>' +
        chihuahuaTete(fill) +
      '</svg>'
    );
  }

  /* chihuahua assis de profil, pose statique du colophon (voir plus bas) :
     même trait et mêmes proportions que la silhouette qui trotte, mais une
     seconde pose distincte — croupe posée au sol, une patte avant, queue
     enroulée. La tête est celle de chihuahuaTete, translatée pour s'aligner
     sur ce nouveau corps assis. */
  function svgChihuahuaAssis(){
    var fill = "currentColor";
    return (
      '<svg viewBox="0 0 86 76" aria-hidden="true" focusable="false">' +
        '<ellipse cx="58" cy="50" rx="16" ry="20" fill="' + fill + '"/>' +
        '<ellipse cx="46" cy="48" rx="11" ry="20" fill="' + fill + '"/>' +
        '<rect x="38" y="52" width="7" height="18" rx="3.5" fill="' + fill + '"/>' +
        '<path d="M66,44 C76,40 78,28 70,20" fill="none" stroke="' + fill + '" stroke-width="5" stroke-linecap="round"/>' +
        '<g transform="translate(-20,6)">' + chihuahuaTete(fill) + '</g>' +
      '</svg>'
    );
  }

  function declencherChihuahuaCache(){
    if(chihuahuaCacheEnCours) return;
    chihuahuaCacheEnCours = true;

    var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var wrap = document.createElement("div");
    wrap.className = "chihuahua-cache";
    wrap.innerHTML = svgChihuahuaCache();
    var footer = document.querySelector(".footer-stack");
    if(footer) wrap.style.bottom = (footer.getBoundingClientRect().height + 10) + "px";
    document.body.appendChild(wrap);

    var depart = window.innerWidth + 40, arrivee = -170;
    var duree = reduit ? 500 : 4000;

    var anim = wrap.animate([
      { transform: "translate(" + depart + "px,0px)" },
      { transform: "translate(" + (depart * 0.66 + arrivee * 0.34) + "px,-7px)" },
      { transform: "translate(" + (depart * 0.33 + arrivee * 0.66) + "px,0px)" },
      { transform: "translate(" + arrivee + "px,-7px)" }
    ], { duration: duree, easing: "linear" });

    var queue = wrap.querySelector(".chihuahua-queue");
    if(queue && !reduit){
      queue.animate(
        [ { transform: "rotate(0deg)" }, { transform: "rotate(16deg)" }, { transform: "rotate(0deg)" } ],
        { duration: 300, iterations: Math.ceil(duree / 300), easing: "cubic-bezier(0.77,0,0.175,1)" }
      );
    }

    /* "finish" ET "cancel" : si l'animation devait s'interrompre pour une
       raison qui ne passe pas par une fin naturelle, le compteur retombe
       quand même à zéro — jamais de chihuahua qui reste bloqué "en cours"
       et empêche tous les suivants. */
    function nettoyer(){
      if(wrap.parentNode) wrap.remove();
      chihuahuaCacheEnCours = false;
    }
    anim.addEventListener("finish", nettoyer);
    anim.addEventListener("cancel", nettoyer);
  }

  function demarrerAppuiLongChihuahuaCache(e){
    var x0 = e.clientX, y0 = e.clientY, id = e.pointerId, declenche = false;

    var minuteur = setTimeout(function(){
      declenche = true;
      nettoyer();
      declencherChihuahuaCache();
    }, 800);

    /* filtré par pointerId : un doigt ou une souris qui bouge ailleurs sur
       la page ne doit pas annuler l'appui en cours sur la pastille. */
    function surDeplacement(ev){
      if(ev.pointerId !== id) return;
      if(Math.hypot(ev.clientX - x0, ev.clientY - y0) > 10) nettoyer();
    }
    function surFin(ev){
      if(ev.pointerId === id) nettoyer();
    }
    function nettoyer(){
      if(!declenche) clearTimeout(minuteur);
      document.removeEventListener("pointermove", surDeplacement);
      document.removeEventListener("pointerup", surFin);
      document.removeEventListener("pointercancel", surFin);
    }

    document.addEventListener("pointermove", surDeplacement);
    document.addEventListener("pointerup", surFin);
    document.addEventListener("pointercancel", surFin);
  }

  /* --- contenu complet d'une journée (détail plein écran + onglet Aujourd'hui) */
  function construireContenuJour(j){
    var art = el("article", "day" + (j.star ? " flag" : "") + (j.eclipse ? " eclipse" : ""));
    art.setAttribute("data-kind", j.cat);

    /* bandeau de tête plein : seul bloc sombre du carnet. L'illustration
       (si le jour en a une) sert de fond ; la date et le titre sont posés
       en réserve blanche par-dessus, dans la bande de ciel vide que
       laissent toujours les silhouettes (voir composerBandeau). Sans
       illustration (12 août), hero-flat renonce à l'habillage en
       position absolue : le texte reprend un flux normal. */
    var svgBandeau = j.illustration && j.illustration.length ? composerBandeau(j.illustration, j.cat, true) : "";
    var hero = el("div", "hero" + (svgBandeau ? "" : " hero-flat"));
    if(svgBandeau){
      var illuWrap = el("div", "hero-illu");
      illuWrap.innerHTML = svgBandeau;
      hero.appendChild(illuWrap);
    }
    var heroText = el("div", "hero-text");
    var heroDate = el("p", "hero-date");
    heroDate.appendChild(el("span", "dow", j.dow));
    heroDate.appendChild(el("span", "num", j.num));
    heroDate.appendChild(el("span", "mon", j.mois));
    heroDate.appendChild(el("span", "kind " + j.cat, j.badge));
    heroText.appendChild(heroDate);
    heroText.appendChild(el("h2", "hero-title", j.titre));
    hero.appendChild(heroText);
    art.appendChild(hero);

    var body = el("div", "body");
    body.appendChild(el("p", "tagline", j.accroche));

    var synth = construireBandeauSynthese(j, body);
    if(synth) body.appendChild(synth);

    if(j.eclipse){
      var discWrap = document.createElement("div");
      discWrap.innerHTML = svgSchemaEclipse();
      body.appendChild(discWrap.firstChild);
    }

    if(j.fil && j.fil.length){
      body.appendChild(construireBlocFil(j));
    }

    /* juste apres le fil horaire : c'est la premiere chose qui suit le
       "quoi faire aujourd'hui", avant les infos pratiques secondaires
       (parking, quiz, chasse...) -- voir discussion de placement, pas
       en toute premiere position pour ne pas repousser le fil (ce que
       consulte en priorite quelqu'un qui prepare son depart a 8h),
       pas non plus apres le quiz/chasse ou il etait quasi invisible. */
    var blocPhotos = construireBlocPhotos(j);
    if(blocPhotos) body.appendChild(blocPhotos);

    if(j.pratique){
      var dlPratique = construirePratiqueJour(j.pratique);
      if(dlPratique) body.appendChild(dlPratique);
    }

    if(j.manger){
      body.appendChild(construireMangerJour(j.manger));
    }

    /* liens de navigation : facultatif, aucune donnée encore remplie
       (le contenu arrivera séparément) — juste le rendu, prêt à l'emploi
       dès qu'un jour aura un champ carte. */
    if(j.carte && j.carte.length){
      var carteWrap = el("div", "carte-liens");
      j.carte.forEach(function(c){
        var a = el("a", "carte-puce", ICONES.carte + " " + c.label);
        a.href = lienPlans(c.requete);
        a.target = "_blank";
        a.rel = "noopener";
        carteWrap.appendChild(a);
      });
      body.appendChild(carteWrap);
    }

    if(j.options && j.options.length){
      var bOpt = el("div", "block");
      bOpt.appendChild(el("h3", null, ICONES.options + " " + (j.optionsTitre || "Si vous avez plus de temps")));
      var ol = el("ul", "opts");
      j.options.forEach(function(o){ ol.appendChild(el("li", null, o)); });
      bOpt.appendChild(ol);
      body.appendChild(bOpt);
    }

    if(j.lieux && j.lieux.length){
      body.appendChild(construireLieuxJour(j));
    }

    if(j.regarder && j.regarder.length){
      body.appendChild(construireRegarderJour(j));
    }

    /* mode public : aucune trace du quiz, ni bloc ni titre orphelin —
       la ligne n'est même pas construite. */
    if(modeFamille && j.quiz && j.quiz.length){
      body.appendChild(construireBlocQuiz(j));
    }

    if(j.notes && j.notes.length){
      var bNotes = el("div", "block");
      bNotes.appendChild(el("h3", null, ICONES.attention + " Points d'attention"));
      j.notes.forEach(function(n){
        var cls = "note" + (n.ton === "soleil" ? " sun" : "");
        bNotes.appendChild(el("div", cls, "<b>" + n.titre + "</b> — " + n.texte));
      });
      body.appendChild(bNotes);
    }

    art.appendChild(body);
    return art;
  }

  /* --- carte compacte pour la liste de l'onglet Agenda --------------------
     marquerAujourdhui : réservé à la liste complète (#list) — la pastille
     n'a rien à faire sur les cartes dupliquées ailleurs (pin "Aujourd'hui",
     onglet Accueil), déjà annoncées par leur propre titre de section. */
  function construireCarte(j, marquerAujourdhui){
    var a = document.createElement("a");
    var estAuj = !!marquerAujourdhui && j.id === idAujourdhui();
    a.className = "card" + (j.star ? " flag" : "") + (j.eclipse ? " eclipse" : "") + (estAuj ? " card-today" : "");
    a.href = "#jour-" + idCourt(j);
    a.setAttribute("data-kind", j.cat);
    a.setAttribute("data-id", j.id);
    if(j.star) a.setAttribute("data-star", "1");

    var cdate = el("p", "cdate", j.dow + " " + j.num + " " + j.mois);
    if(estAuj) cdate.appendChild(el("span", "card-today-badge", "Aujourd’hui"));
    if(j.anniversaire) cdate.appendChild(el("span", "card-anniversaire-badge", ICONES.anniversaire + " Anniversaire"));
    a.appendChild(cdate);
    a.appendChild(el("h3", null, j.titre));
    a.appendChild(el("p", "ctag", j.accroche));

    var meta = el("div", "cmeta");
    meta.appendChild(el("span", "kind " + j.cat, j.badge));
    meta.appendChild(el("span", "cdist", j.rail1 + " · " + j.rail2));
    var iMeteoCarte = creerItemMeteoCompact(j);
    if(iMeteoCarte) meta.appendChild(iMeteoCarte);
    a.appendChild(meta);

    return a;
  }

  function construireEnteteOnglet(titre){
    var h = el("header", "panel-head");
    h.appendChild(el("h2", null, titre));
    return h;
  }

  /* --- lien Plans à partir d'une adresse libre --------------------------- */
  function lienPlans(adresse){
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adresse);
  }
  function lienExterne(a, href, texte){
    a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = texte;
    return a;
  }

  /* --- lien Plans pour l'itinéraire complet du séjour : les mêmes étapes
     que le trajet décrit dans CLAUDE.md, en noms de lieu texte, encodés —
     jamais de coordonnées, même règle que lienPlans ci-dessus. */
  function lienItineraireComplet(){
    var etapes = ["Rueil-Malmaison", "Lyon", "Torino", "Salò BS", "Valbonne", "Soumont Hérault", "Rueil-Malmaison"];
    var waypoints = etapes.slice(1, -1).map(encodeURIComponent).join("|");
    return "https://www.google.com/maps/dir/?api=1" +
      "&origin=" + encodeURIComponent(etapes[0]) +
      "&destination=" + encodeURIComponent(etapes[etapes.length - 1]) +
      "&waypoints=" + waypoints +
      "&travelmode=driving";
  }
  function construireBoutonItineraire(){
    var a = document.createElement("a");
    a.className = "itineraire-bouton";
    a.href = lienItineraireComplet();
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = ICONES.carte + "<span>Ouvrir l'itinéraire dans Google Maps</span>" + ICONES.externe;
    return a;
  }

  /* --- schéma d'itinéraire : illustration de la boucle du voyage, du
     31 juillet au 23 août. Ni carte ni ruban chronologique : un tracé
     stylisé fermé passant par les six étapes, avec les primitives
     d'illustrations.js posées en retrait le long du chemin pour évoquer
     chaque tronçon (Alpes, lac de Garde, côte ligure, Mourèze, Millau/
     Auvergne). Les six positions (ITIN_POS) sont des coordonnées de
     mise en page fixes et stylisées — elles ne représentent aucune
     coordonnée géographique réelle, voir le commentaire de svgParcours. */
  var ITIN_JOURS = ["d-0731", "d-0801", "d-0802", "d-0817", "d-0818", "d-0823"];

  function segmentItineraire(dayId){
    var j = trouverJour(dayId);
    if(!j) return null;
    var parties = sansHtml(j.titre || "").split("→");
    if(parties.length !== 2) return null;
    return { dayId: dayId, de: parties[0].trim(), a: parties[1].trim() };
  }
  function segmentsItineraire(){
    return ITIN_JOURS.map(segmentItineraire).filter(function(s){ return s; });
  }
  /* sept entrées : la première (départ) et la dernière (retour) portent
     le même nom de lieu — Rueil-Malmaison ouvre et referme la boucle. */
  function noeudsItineraire(segments){
    var liste = [{ nom: segments[0].de, dayId: segments[0].dayId }];
    segments.forEach(function(s){ liste.push({ nom: s.a, dayId: s.dayId }); });
    return liste;
  }
  function lienNoeudItineraire(n){ return "#jour-" + n.dayId.slice(2); }
  /* les six nœuds de la boucle : Rueil-Malmaison (départ) puis les cinq
     étapes, dans l'ordre du trajet — on retire la septième entrée
     (Rueil-Malmaison au retour), le tracé fermé y revient de lui-même. */
  function noeudsParcours(segments){ return noeudsItineraire(segments).slice(0, 6); }

  /* plage de Salò : le séjour fixe sans changement d'hébergement, entre
     les deux repères de chapitre déjà posés dans donnees.js ("Chapitre II
     — Quatorze jours autour du lac" et le suivant). Sert à joursAuLac(),
     utilisée elle-même par le bloc chiffres et le libellé du nœud Salò. */
  function plageSalo(){
    var debuts = [];
    JOURS.forEach(function(j, i){ if(j.chapitre) debuts.push(i); });
    if(debuts.length < 2) return null;
    var fin = debuts.length > 2 ? debuts[2] : JOURS.length;
    return { debut: debuts[1], fin: fin };
  }

  /* --- illustration du parcours : voir la consigne pour le détail. Six
     nœuds à des coordonnées stylisées fixes (ITIN_POS, dans l'ordre de
     noeudsParcours), reliés par un tracé fermé et courbe (spline de
     Catmull-Rom convertie en Bézier cubique — passe exactement par
     chaque nœud, sans les segments droits qu'un simple polygone donnerait).
     Les primitives sont posées à la main, pas via composerBandeau : ce
     composeur répartit des motifs sur des bandes horizontales à trois
     plans, une hypothèse qui ne tient pas ici où chaque motif doit se
     lire à un endroit précis du tracé plutôt que réparti sur la largeur. */
  var ITIN_POS = [
    { x: 200, y: 100 }, /* Rueil-Malmaison */
    { x: 390, y: 370 }, /* Lyon */
    { x: 630, y: 440 }, /* Turin */
    { x: 830, y: 395 }, /* Salò */
    { x: 540, y: 580 }, /* Valbonne */
    { x: 215, y: 570 }  /* Soumont */
  ];

  /* spline de Catmull-Rom fermée → chemin SVG en cubiques : chaque
     sommet garde ses voisins (i-1, i+2, indices modulo la boucle) pour
     calculer ses deux points de contrôle, ce qui donne une courbe lisse
     passant par tous les points sans jamais s'en écarter. */
  function tracéBoucle(points){
    var n = points.length, d = "M" + points[0].x + "," + points[0].y, i;
    for(i = 0; i < n; i++){
      var p0 = points[(i - 1 + n) % n], p1 = points[i], p2 = points[(i + 1) % n], p3 = points[(i + 2) % n];
      var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += " C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " + c2x.toFixed(1) + "," + c2y.toFixed(1) + " " + p2.x + "," + p2.y;
    }
    return d + " Z";
  }

  /* pose une primitive d'illustrations.js à un endroit précis, en retrait
     du tracé — pas via composerBandeau (voir plus haut pourquoi). Les
     "bandes" (montagnes, lac, vagues) sont conçues pour courir sur une
     largeur donnée ; on les recadre ici en petit patch local, translaté
     à (cx, cy), plutôt que de les étirer sur tout le canevas — s pilote
     la taille du patch. Les "objets" et le "ciel" gardent leur sens
     habituel : (cx, cy) est leur point de sol, s leur échelle. */
  function poserPrimitive(nom, cx, cy, s, fill){
    var def = ILLUSTRATIONS[nom];
    if(!def) return "";
    if(def.type === "bande"){
      var larg = 130 * s, haut = 36 * s;
      return '<g transform="translate(' + (cx - larg / 2).toFixed(1) + "," + cy.toFixed(1) + ')">' + def.dessin(larg, haut, 0, fill) + "</g>";
    }
    return def.dessin(cx, cy, s * (def.echelle || 1), fill);
  }

  function svgParcours(noeuds){
    if(!noeuds.length) return "";
    var W = 1000, H = 700;
    var teinteRoute = nuance("--pietra", 42, "--paper");
    var teinteLac = nuance("--lago-mid", 42, "--paper");
    var teinteNature = nuance("--oliva", 42, "--paper");
    var teinteEvenement = nuance("--sole", 45, "--paper");

    var out = '<svg class="itin-svg" viewBox="0 0 ' + W + " " + H +
      '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustration du parcours en boucle, du 31 juillet au 23 août, via Lyon, Turin, Salò, Valbonne et Soumont">';

    /* décors, en retrait du tracé — voir la consigne pour la
       correspondance tronçon → motifs. Échelle réduite (0.55 pour les
       objets, patch resserré pour les bandes) : ce sont des accents de
       second plan, pas des silhouettes de premier plan comme dans un
       bandeau de journée. */
    out += '<g class="itin-decor">';
    out += poserPrimitive("montagnes", 480, 290, 1, teinteRoute); /* Alpes, entre Lyon et Turin */
    out += poserPrimitive("pin", 555, 300, 0.55, teinteRoute);
    out += poserPrimitive("vagues", 690, 470, 1, teinteRoute); /* côte ligure, entre Salò et Valbonne */
    out += poserPrimitive("aiguilles", 165, 655, 0.55, teinteNature); /* Mourèze / Larzac, près de Soumont */
    out += poserPrimitive("viaduc", 95, 300, 0.55, teinteRoute); /* Millau, entre Soumont et Rueil */
    out += poserPrimitive("volcan", 115, 430, 0.55, teinteRoute); /* Auvergne, entre Soumont et Rueil */
    out += poserPrimitive("lac", 760, 460, 1, teinteLac); /* lac de Garde, à Salò */
    out += poserPrimitive("voile", 905, 435, 0.55, teinteLac);
    out += poserPrimitive("eclipse", 830, 280, 0.9, teinteEvenement); /* le 12 août, au-dessus de Salò */
    out += "</g>";

    out += '<path class="itin-path" d="' + tracéBoucle(ITIN_POS) + '"/>';

    /* les nœuds ne portent plus ni lien ni texte : le SVG redevient un
       pur décor (aria-hidden), les libellés tactiles sont posés en HTML
       par-dessus (voir construireEtiquettesItineraire). */
    out += '<g class="itin-nodes" aria-hidden="true">';
    noeuds.forEach(function(n, i){
      var p = ITIN_POS[i], majeur = i === 3;
      var r = majeur ? 15 : 7;
      out += '<circle class="itin-node' + (majeur ? " majeur" : "") + '" cx="' + p.x + '" cy="' + p.y + '" r="' + r + '"/>';
    });
    out += "</g>";

    return out + "</svg>";
  }

  /* --- libellés HTML de l'itinéraire : voir la consigne pour le détail.
     Chaque nœud reçoit une direction de décalage fixe (ITIN_DIRECTIONS,
     même ordre que noeudsParcours/ITIN_POS), choisie vers l'extérieur de
     la boucle pour qu'aucun des six libellés ne chevauche son voisin,
     y compris à 380 px de large. */
  var ITIN_DIRECTIONS = ["top", "left", "right", "right", "bottom", "bottom"];

  function construireEtiquettesItineraire(noeuds){
    var W = 1000, H = 700;
    var wrap = el("div", "itin-labels");
    noeuds.forEach(function(n, i){
      var p = ITIN_POS[i], majeur = i === 3, dir = ITIN_DIRECTIONS[i];
      var a = document.createElement("a");
      a.className = "itin-label dir-" + dir + (majeur ? " majeur" : "");
      a.href = lienNoeudItineraire(n);
      a.style.left = (p.x / W * 100).toFixed(2) + "%";
      a.style.top = (p.y / H * 100).toFixed(2) + "%";
      var txt = el("span", "itin-label-txt");
      txt.appendChild(el("span", "itin-label-nom", n.nom));
      if(majeur){
        txt.appendChild(el("span", "itin-label-duree", joursAuLac() + " jours"));
      }
      a.appendChild(txt);
      wrap.appendChild(a);
    });
    return wrap;
  }

  function construireBlocItineraire(){
    var segments = segmentsItineraire();
    if(!segments.length) return document.createDocumentFragment();
    var noeuds = noeudsParcours(segments);
    var wrap = el("div", "itineraire-block");
    var schema = el("div", "itineraire-schema");
    schema.innerHTML = svgParcours(noeuds);
    schema.appendChild(construireEtiquettesItineraire(noeuds));
    wrap.appendChild(schema);
    var pied = el("div", "itineraire-pied");
    pied.appendChild(construireBoutonItineraire());
    wrap.appendChild(pied);
    return wrap;
  }

  /* --- onglet Urgences : page austère, sections dédiées, zones tactiles
     larges. Rendu dédié plutôt que générique car chaque section d'URGENCES
     a sa propre forme (numeros en lignes tel + label, veterinaires/
     consulaire en cartes, assuranceAuto en objet unique, documents/memo en
     listes de chaînes). ---------------------------------------------------- */
  const URG_REMPLIR = "À REMPLIR";
  function estARemplir(v){ return v === URG_REMPLIR; }
  function texteOuAlerte(v){
    return estARemplir(v) ? '<span class="urg-alerte">' + URG_REMPLIR + "</span>" : v;
  }

  /* affichage lisible d'un numéro, dérivé à l'aller seulement (jamais
     l'inverse : le href="tel:" utilise toujours la valeur brute telle
     quelle). Regroupement mécanique par paires de chiffres après
     l'indicatif — pas une vraie convention par pays, mais une règle
     unique et fiable qui ne suppose rien sur la longueur d'un indicatif
     ou d'un numéro. Les codes courts sans "+" (112, 118…) ressortent
     tels quels. */
  function telLisible(tel){
    if(!tel || tel.charAt(0) !== "+") return tel;
    var indicatif = tel.slice(0, 3);
    var reste = tel.slice(3);
    var groupes = [], i = 0;
    if(reste.length % 2 === 1){ groupes.push(reste.slice(0, 1)); i = 1; }
    for(; i < reste.length; i += 2) groupes.push(reste.slice(i, i + 2));
    return indicatif + " " + groupes.join(" ");
  }

  /* une ligne tappable pleine largeur : gros numéro + libellé, note en
     dessous. Sert à numeros, champs {label, tel, note}. */
  function construireLigneUrg(entree){
    var wrap = el("div", "urg-line");
    var vide = estARemplir(entree.tel);
    var head = vide ? el("div", "urg-line-head alerte") : document.createElement("a");
    if(!vide){ head.className = "urg-line-head"; head.href = "tel:" + entree.tel; }
    head.appendChild(el("span", "n", vide ? URG_REMPLIR : telLisible(entree.tel)));
    head.appendChild(el("span", "l", entree.label));
    wrap.appendChild(head);
    if(entree.note) wrap.appendChild(el("p", "urg-remark", entree.note));
    return wrap;
  }

  /* numéro en clair dans une carte : lien tappable en gros caractères
     si la valeur est réelle, pastille d'alerte si elle vaut "À REMPLIR".
     Jamais un simple lien sur le libellé : le chiffre doit se lire et
     se recopier. */
  function construireTelCarte(tel){
    if(estARemplir(tel)) return el("p", "urg-tel alerte", URG_REMPLIR);
    var a = document.createElement("a");
    a.className = "urg-tel";
    a.href = "tel:" + tel;
    a.textContent = telLisible(tel);
    return a;
  }
  function actionAdresse(adresse){
    return estARemplir(adresse)
      ? el("span", "action alerte", URG_REMPLIR)
      : lienExterne(document.createElement("a"), lienPlans(adresse), "Plans");
  }

  /* carte générique : titre, lignes de méta-texte, numéro en clair,
     remarque, puis actions adresse/web. Sert à veterinaires et
     consulaire. */
  function construireCarteUrg(opts){
    var b = el("div", "urg-card");
    if(opts.titre) b.appendChild(el("h4", null, texteOuAlerte(opts.titre)));
    (opts.lignes || []).forEach(function(l){
      if(!l) return;
      b.appendChild(el("p", "meta", texteOuAlerte(l)));
    });
    if(opts.tel) b.appendChild(construireTelCarte(opts.tel));
    if(opts.note) b.appendChild(el("p", "urg-remark", opts.note));
    var items = [];
    if(opts.adresse) items.push(actionAdresse(opts.adresse));
    if(opts.web) items.push(lienExterne(document.createElement("a"), opts.web, "Site"));
    if(items.length){
      var actions = el("div", "actions");
      items.forEach(function(i){ actions.appendChild(i); });
      b.appendChild(actions);
    }
    return b;
  }

  function construirePanelUrgences(container, titre, urg){
    container.appendChild(construireEnteteOnglet(titre));

    /* 112 : extrait de numeros, en tout premier, en très grand, sans
       avoir à faire défiler. Le reste de numeros suit dans sa section. */
    var hero = null, reste = [];
    urg.numeros.forEach(function(e){

    /* assuranceAuto est un objet unique, pas une liste — et réservé aux

    if(urg.assuranceAuto){

      var lignesAA = el("div", "urg-lignes");
      aa.lignes.forEach(function(l){
        var row = document.createElement("a");
        row.className = "urg-subline";
        row.href = "tel:" + l.tel;
        row.appendChild(el("span", "l", l.label));
        row.appendChild(el("span", "n", telLisible(l.tel)));
        row.appendChild(el("span", "h", l.horaires));
        lignesAA.appendChild(row);
      });
      carteAA.appendChild(lignesAA);
      secAA.appendChild(carteAA);
      container.appendChild(secAA);
    }

    var secCons = el("div", "urg-section");
    secCons.appendChild(el("h3", null, "Consulaire"));
    urg.consulaire.forEach(function(c){
      secCons.appendChild(construireCarteUrg({
        titre: c.label, lignes: [c.horaires], note: c.note,
        tel: c.tel, adresse: c.adresse
      }));
    });
    container.appendChild(secCons);

    var secDoc = el("div", "urg-section");
    secDoc.appendChild(el("h3", null, "À emporter"));
    var ulDoc = el("ul", "urg-check");

    secDoc.appendChild(ulDoc);

    /* mémo : plus discret, en pied de panneau. */
    var memoWrap = el("div", "urg-memo-wrap");
    memoWrap.appendChild(el("h3", null, "Mémo"));

    urg.memo.forEach(function(m){ ulMemo.appendChild(el("li", null, m)); });

  /* --- onglet Admin : fréquentation ----------------------------------
     La correction du quiz n'est plus une action admin : chaque membre
     famille se corrige lui-même en repondant (voir repondre_quiz, RPC
     security definer, et choisirReponseQuiz plus haut) puisque tout est
     desormais stocke en base par un vrai compte, plus besoin qu'un
     adulte prenne le telephone de chacun pour valider apres coup.
     Seule reste ici la lecture d'usage (visites), reservee aux comptes
     admin par RLS. */
  function formaterDateAdmin(date){
    try{ return new Date(date + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }); }
    catch(e){ return date; }
  }
  /* --- fréquentation famille : tableau de bord (indicateurs, barres par
     membre, courbe des visites par jour, top des onglets), lu depuis la
     table visites (voir tracking dans demarrerCarnet plus haut). RLS
     réserve la lecture aux comptes admin du voyage — pas de vérification
     supplémentaire ici. Tout en SVG/HTML natif, sans bibliothèque de
     graphique : cohérent avec le reste du moteur de rendu (voir les
     icônes de la barre d'onglets, elles aussi du SVG écrit à la main). */
  var NOMS_ONGLETS_FREQUENTATION = {
    aujourdhui: "Accueil", jours: "Agenda", chasse: "Chasse", carnet: "Carnet",
    reserver: "Réserver", urgences: "Urgences", admin: "Admin"
  };
  function formaterDureeFrequentation(secondes){
    var min = Math.round(secondes / 60);
    if(min < 60) return min + " min";
    return Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0");
  }
  // "il y a …" plutôt qu'une date pour la dernière activité : c'est la
  // lecture la plus utile pour l'organisateur qui regarde ce panneau au
  // fil de l'eau. Repli sur la date exacte au-delà d'une semaine.
  function formaterRelatifFrequentation(isoDate){
    if(!isoDate) return "jamais";
    var diffMs = Date.now() - new Date(isoDate).getTime();
    var jours = Math.floor(diffMs / 86400000);
    if(jours <= 0) return "aujourd'hui";
    if(jours === 1) return "hier";
    if(jours < 7) return "il y a " + jours + " jours";
    return formaterDateAdmin(isoDate.slice(0, 10));
  }
  function construireBarresFrequentation(lignes, couleurVar){
    var max = Math.max.apply(null, lignes.map(function(l){ return l.valeur; })) || 1;
    var liste = el("ul", "admin-freq-barres");
    lignes.forEach(function(l){
      var li = document.createElement("li");
      li.className = "admin-freq-barre-ligne";
      var tete = el("div", "admin-freq-barre-tete");
      tete.appendChild(el("span", "admin-freq-barre-label", l.label));
      tete.appendChild(el("span", "admin-freq-barre-valeur", l.sousLabel));
      li.appendChild(tete);
      var piste = el("div", "admin-freq-barre-piste");
      var remplissage = el("div", "admin-freq-barre-remplissage");
      remplissage.style.width = Math.round((l.valeur / max) * 100) + "%";
      remplissage.style.background = "var(" + couleurVar + ")";
      piste.appendChild(remplissage);
      li.appendChild(piste);
      liste.appendChild(li);
    });
    return liste;
  }
  // Courbe des visites par jour sur les deux dernières semaines, zéros
  // compris (un jour sans visite doit se voir, pas disparaître).
  function construireCourbeFrequentation(parJour){
    var NB_JOURS = 14;
    var jours = [];
    for(var i = NB_JOURS - 1; i >= 0; i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var cle = d.toISOString().slice(0, 10);
      jours.push({ cle: cle, valeur: parJour[cle] || 0 });
    }
    var max = Math.max.apply(null, jours.map(function(j){ return j.valeur; })) || 1;
    var largeur = 640, hauteur = 120, marge = 8;
    var pasX = (largeur - marge * 2) / (jours.length - 1);
    var points = jours.map(function(j, i){
      var x = marge + i * pasX;
      var y = hauteur - marge - (j.valeur / max) * (hauteur - marge * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    svg.setAttribute("class", "admin-freq-courbe");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Nombre de visites par jour sur les quatorze derniers jours");

    var ligneBase = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ligneBase.setAttribute("x1", marge); ligneBase.setAttribute("x2", largeur - marge);
    ligneBase.setAttribute("y1", hauteur - marge); ligneBase.setAttribute("y2", hauteur - marge);
    ligneBase.setAttribute("stroke", "var(--rule-soft)");
    svg.appendChild(ligneBase);

    var polyligne = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyligne.setAttribute("points", points);
    polyligne.setAttribute("fill", "none");
    polyligne.setAttribute("stroke", "var(--rosso)");
    polyligne.setAttribute("stroke-width", "2");
    polyligne.setAttribute("stroke-linecap", "round");
    polyligne.setAttribute("stroke-linejoin", "round");
    svg.appendChild(polyligne);

    jours.forEach(function(j, i){
      if(!j.valeur) return;
      var x = marge + i * pasX;
      var y = hauteur - marge - (j.valeur / max) * (hauteur - marge * 2);
      var point = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      point.setAttribute("cx", x.toFixed(1)); point.setAttribute("cy", y.toFixed(1));
      point.setAttribute("r", "3"); point.setAttribute("fill", "var(--rosso)");
      var titre = document.createElementNS("http://www.w3.org/2000/svg", "title");
      titre.textContent = formaterDateAdmin(j.cle) + " — " + j.valeur + " visite" + (j.valeur > 1 ? "s" : "");
      point.appendChild(titre);
      svg.appendChild(point);
    });

    var figure = el("figure", "admin-freq-courbe-fig");
    figure.appendChild(svg);
    var legende = el("figcaption", "admin-freq-courbe-legende");
    legende.textContent = formaterDateAdmin(jours[0].cle) + " → " + formaterDateAdmin(jours[jours.length - 1].cle);
    figure.appendChild(legende);
    return figure;
  }
  function construireBlocFrequentation(container, voyageId, membres){
    var bloc = el("div", "admin-frequentation");
    var zone = el("p", "admin-info", "Chargement…");
    bloc.appendChild(zone);
    container.appendChild(bloc);

    supabaseClient.from("visites")
      .select("utilisateur_id, debutee_le, duree_secondes, onglets_vus")
      .eq("voyage_id", voyageId)
      .then(function(res){
        if(res.error){ zone.textContent = "Chargement de la fréquentation impossible : " + res.error.message; return; }
        if(!membres.length){ zone.textContent = "Aucun membre famille pour ce voyage."; return; }

        var parMembre = {};
        membres.forEach(function(m){
          parMembre[m.utilisateur_id] = { prenom: m.prenom, visites: 0, secondes: 0, derniere: null };
        });
        var parJour = {};
        var parOnglet = {};
        var derniereGlobale = null;
        (res.data || []).forEach(function(v){
          var jour = (v.debutee_le || "").slice(0, 10);
          if(jour) parJour[jour] = (parJour[jour] || 0) + 1;
          (v.onglets_vus || []).forEach(function(o){
            parOnglet[o.onglet] = (parOnglet[o.onglet] || 0) + 1;
          });
          if(!derniereGlobale || v.debutee_le > derniereGlobale) derniereGlobale = v.debutee_le;

          var m = parMembre[v.utilisateur_id];
          if(!m) return; // membre retiré du voyage depuis : on ignore ses visites passées pour l'agrégat par membre
          m.visites += 1;
          m.secondes += v.duree_secondes || 0;
          if(!m.derniere || v.debutee_le > m.derniere) m.derniere = v.debutee_le;
        });

        var totalVisites = 0, totalSecondes = 0, membresActifs = 0;
        var seuilActif = Date.now() - 3 * 86400000;
        Object.keys(parMembre).forEach(function(id){
          var m = parMembre[id];
          totalVisites += m.visites;
          totalSecondes += m.secondes;
          if(m.derniere && new Date(m.derniere).getTime() >= seuilActif) membresActifs++;
        });

        zone.remove();

        var kpis = el("div", "admin-freq-kpis");
        [
          { valeur: totalVisites, label: "visite" + (totalVisites > 1 ? "s" : "") + " au total" },
          { valeur: formaterDureeFrequentation(totalSecondes), label: "temps cumulé" },
          { valeur: membresActifs + " / " + membres.length, label: "actifs ces 3 derniers jours" },
          { valeur: formaterRelatifFrequentation(derniereGlobale), label: "dernière activité" }
        ].forEach(function(k){
          var carte = el("div", "admin-freq-kpi");
          carte.appendChild(el("span", "admin-freq-kpi-valeur", String(k.valeur)));
          carte.appendChild(el("span", "admin-freq-kpi-label", k.label));
          kpis.appendChild(carte);
        });
        bloc.appendChild(kpis);

        bloc.appendChild(el("h4", "admin-freq-soustitre", "Visites par jour (14 derniers jours)"));
        bloc.appendChild(construireCourbeFrequentation(parJour));

        bloc.appendChild(el("h4", "admin-freq-soustitre", "Par membre"));
        if(!Object.keys(parMembre).length){
          bloc.appendChild(el("p", "admin-info", "Aucun membre famille pour ce voyage."));
        } else {
          bloc.appendChild(construireBarresFrequentation(
            Object.keys(parMembre).map(function(id){
              var m = parMembre[id];
              return {
                label: m.prenom,
                valeur: m.visites,
                sousLabel: m.visites + " visite" + (m.visites > 1 ? "s" : "") + " · " + formaterDureeFrequentation(m.secondes)
                  + " · " + formaterRelatifFrequentation(m.derniere)
              };
            }),
            "--rosso"
          ));
        }

        var ongletsTries = Object.keys(parOnglet)
          .map(function(o){ return { onglet: o, valeur: parOnglet[o] }; })
          .sort(function(a, b){ return b.valeur - a.valeur; })
          .slice(0, 5);
        if(ongletsTries.length){
          bloc.appendChild(el("h4", "admin-freq-soustitre", "Onglets les plus consultés"));
          bloc.appendChild(construireBarresFrequentation(
            ongletsTries.map(function(o){
              return {
                label: NOMS_ONGLETS_FREQUENTATION[o.onglet] || o.onglet,
                valeur: o.valeur,
                sousLabel: String(o.valeur)
              };
            }),
            "--oliva"
          ));
        }
      });
  }

  /* --- console d'administration : fréquentation ----------------------------
     Seule section restante depuis le passage à l'auto-correction du quiz
     (voir repondre_quiz) : plus besoin de sous-onglets. */
  function construirePanelAdmin(container, voyageId){
    container.appendChild(construireEnteteOnglet("Admin"));

    var zone = el("div", "admin-zone");
    zone.appendChild(el("p", "admin-info", "Chargement…"));

  /* --- onglet À réserver : agrégation chronologique de pratique.reserver.

  function construireVignetteReserver(j){

    a.id = "resa-" + idCourt(j);
    a.href = "#jour-" + idCourt(j);

  function rendrePanelReserver(){

  /* --- recherche : index par jour, normalisé (accents, casse, HTML retiré)
     une fois pour toutes au chargement. Sans bibliothèque : normalize("NFD")
     sépare les accents des lettres de base, qu'on retire ensuite. --------- */
  function texteBrutRecherche(html){
    return String(html == null ? "" : html).replace(/<[^>]+>/g, " ");
  }
  function normaliser(s){
    return texteBrutRecherche(s).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
  }
  var LIBELLES_SECTION_RECHERCHE = {
    titre: "Titre", accroche: "Accroche", fil: "Fil", options: "Options",
    lieux: "Sur place", regarder: "À regarder", pratique: "Pratique", manger: "Où manger",
    notes: "Notes"
  };
  function construireIndexJour(j){
    var sections = [];
    function ajoute(cle, morceaux){
      var texte = normaliser(morceaux.filter(Boolean).join(" "));
      if(texte.trim()) sections.push({ cle: cle, libelle: LIBELLES_SECTION_RECHERCHE[cle], texte: texte });

    ajoute("titre", [j.titre]);

    ajoute("pratique", j.pratique ? [j.pratique.parking, j.pratique.ztl, j.pratique.reserver, j.pratique.emporter, j.pratique.chien] : []);
    ajoute("manger", j.manger ? [
      j.manger.midi && j.manger.midi.nom, j.manger.midi && j.manger.midi.ou, j.manger.midi && j.manger.midi.note,
      j.manger.soir && j.manger.soir.nom, j.manger.soir && j.manger.soir.ou, j.manger.soir && j.manger.soir.note,

    ] : []);
    ajoute("notes", (j.notes || []).map(function(n){ return n.titre + " " + n.texte; }));

  /* --- easter egg : le vent ----------------------------------------------
     Saisie exacte de "ora" (normalisée : sans accents, minuscules, sans
     espaces autour) dans la recherche de l'Agenda, une fois ~400 ms écoulés
     sans nouvelle frappe : les barres de la frise du rythme se soulèvent
     l'une après l'autre, de gauche à droite, comme une vague de vent qui
     traverse la frise — trois bonds amortis (le premier franc, les
     suivants plus faibles) avant extinction. Seul le <span class="bar">
     anime (translateY) ; le numéro de jour, frère du même bouton .tick,
     n'est jamais touché puisqu'un transform sur un élément déplacerait
     aussi ses descendants mais pas ses frères. La frise garde 16 px de
     marge au-dessus des barres (voir .spine en CSS) pour que ce
     soulèvement ne pousse jamais une barre hors de son cadre : overflow-x
     auto sur .spine convertit overflow-y en auto aussi (règle CSS sur les
     combinaisons visible/non-visible), donc le moindre dépassement
     déclencherait un défilement vertical indésirable. Le délai + l'égalité
     stricte (pas indexOf) évitent qu'une recherche en cours de frappe comme
     "orage" déclenche l'effet en passant par l'état intermédiaire "ora". La
     recherche elle-même continue de filtrer normalement, sans attendre ce
     délai. */
  var ventCacheEnCours = false;
  var minuteurVentCache = null;

  function declencherVentCache(){
    if(ventCacheEnCours) return;
    var barres = Array.prototype.slice.call(spine.querySelectorAll(".tick .bar"));
    if(!barres.length) return;
    ventCacheEnCours = true;

    var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var amp = 14;

    if(reduit){
      /* une seule oscillation brève, toutes les barres ensemble : pas de
         vague qui parcourt la frise, juste un signe de vie minimal. */
      var dureeReduite = 260;
      barres.forEach(function(barre){
        barre.animate([
          { transform: "translateY(0px)", offset: 0 },
          { transform: "translateY(" + (-amp) + "px)", offset: .5 },
          { transform: "translateY(0px)", offset: 1 }
        ], { duration: dureeReduite, easing: "cubic-bezier(0.77,0,0.175,1)" });
      });
      setTimeout(function(){ ventCacheEnCours = false; }, dureeReduite + 50);
      return;
    }

    var dureeVague = 5000;
    /* décalage borné : la vague doit visiblement traverser la frise sans
       que la dernière barre ne démarre après la fin de la durée totale. */
    var delaiParBarre = Math.min(60, Math.max(0, (dureeVague * 0.5 - 900) / Math.max(1, barres.length - 1)));
    var dureeOscillation = dureeVague - delaiParBarre * (barres.length - 1);

    barres.forEach(function(barre, i){
      var delai = i * delaiParBarre;
      barre.animate([
        { transform: "translateY(0px)", offset: 0 },
        { transform: "translateY(" + (-amp) + "px)", offset: .12 },
        { transform: "translateY(0px)", offset: .28 },
        { transform: "translateY(" + (-amp * .55) + "px)", offset: .46 },
        { transform: "translateY(0px)", offset: .64 },
        { transform: "translateY(" + (-amp * .25) + "px)", offset: .82 },
        { transform: "translateY(0px)", offset: 1 }
      ], { duration: dureeOscillation, delay: delai, easing: "cubic-bezier(0.77,0,0.175,1)" });
    });

    /* minuterie plutôt que suivi des "finish" de chaque animation : le
       verrou retombe de toute façon, même si la page a changé d'onglet
       ou de filtre entre-temps. */
    setTimeout(function(){ ventCacheEnCours = false; }, dureeVague + 50);
  }

  champRecherche.addEventListener("input", function(){

  /* --- recherche du jour courant ------------------------------------------
     Comparaison de chaînes valide ici : tous les id sont "d-MMJJ", même
     format sur 4 chiffres, et les 24 jours se suivent sans trou.
     dateAujourdhui() est le seul point d'accès à l'horloge : idAujourdhui()
     et le compte à rebours partagent ainsi le même instant. */
  function dateAujourdhui(){ return new Date(); }
  function idAujourdhui(){
    var d = dateAujourdhui();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var jj = String(d.getDate()).padStart(2, "0");
    return "d-" + mm + jj;
  }
  function trouverJour(id){
    for(var i = 0; i < JOURS.length; i++){ if(JOURS[i].id === id) return JOURS[i]; }
    return null;
  }
  function jourDuJour(){
    var id = idAujourdhui();
    var exact = trouverJour(id);
    if(exact) return { jour: exact, exact: true };
    var premier = JOURS[0], dernier = JOURS[JOURS.length - 1];
    if(id > dernier.id) return { jour: dernier, exact: false, avant: false };
    return { jour: premier, exact: false, avant: true };
  }

  /* --- accès famille : connexion / déconnexion Supabase Auth ------------
     Plus de mot de passe local ni de hachage maison : signInWithPassword
     authentifie le compte auprès de Supabase, qui joint désormais un
     jeton à chaque requête suivante — c'est ce jeton, vérifié par les
     policies RLS, qui fait ou non apparaître le contenu visibilite=
     "famille" dans les prochaines réponses. On ne recalcule pas l'état
     "public/famille" en place à travers tout ce qui a déjà été construit
     (barre d'onglets, quiz, chasse...) : comme pour l'ancien mécanisme,
     un succès de connexion ou une déconnexion recharge la page — supabase-
     js a déjà persisté (ou effacé) la session dans son propre localStorage
     avant le rechargement, chargerEtDemarrer() la retrouvera donc telle
     quelle au prochain chargement. */
  function desactiverModeFamille(){
    supabaseClient.auth.signOut().then(function(){ location.reload(); });

  /* --- accès famille : dialogue de connexion ----------------------------
     Même facture visuelle que l'ancien dialogue de mot de passe (classes
     .famille-pw-*), avec un champ e-mail en plus. L'erreur s'affiche dans
     le dialogue lui-même (message de Supabase, ou un texte générique si
     absent), jamais via window.alert ni de redirection. `declencheur` est
     le bouton qui a ouvert la boîte : le focus lui revient à la fermeture
     (sauf succès, qui recharge la page). */
  function ouvrirDialogueAccesFamille(declencheur){
    var overlay = el("div", "famille-pw-overlay");
    var boite = el("div", "famille-pw-boite");
    boite.setAttribute("role", "dialog");
    boite.setAttribute("aria-modal", "true");
    boite.setAttribute("aria-labelledby", "famille-pw-titre");
    overlay.appendChild(boite);

    var tete = el("div", "famille-pw-tete");
    var titre = el("p", "famille-pw-titre", "Connexion à l'accès famille :");
    titre.id = "famille-pw-titre";
    tete.appendChild(titre);
    var boutonFermer = document.createElement("button");
    boutonFermer.type = "button";
    boutonFermer.className = "famille-pw-fermer";
    boutonFermer.setAttribute("aria-label", "Fermer");
    boutonFermer.innerHTML = ICONES.fermer;
    tete.appendChild(boutonFermer);
    boite.appendChild(tete);

    var champEmail = el("div", "famille-pw-champ");
    var inputEmail = document.createElement("input");
    inputEmail.type = "email";
    inputEmail.className = "famille-pw-input";
    inputEmail.placeholder = "E-mail";
    inputEmail.autocomplete = "username";
    inputEmail.setAttribute("autocorrect", "off");
    inputEmail.setAttribute("autocapitalize", "off");
    inputEmail.spellcheck = false;
    champEmail.appendChild(inputEmail);
    boite.appendChild(champEmail);

    var champ = el("div", "famille-pw-champ");
    champ.style.marginTop = "8px";
    var input = document.createElement("input");
    input.type = "password";
    input.className = "famille-pw-input";
    input.placeholder = "Mot de passe";
    input.autocomplete = "current-password";
    /* capitalisation automatique iOS : ferait échouer la saisie sans
       explication si on ne la coupe pas ici. */
    input.setAttribute("autocorrect", "off");
    input.setAttribute("autocapitalize", "off");
    input.spellcheck = false;
    champ.appendChild(input);

    var boutonOeil = document.createElement("button");
    boutonOeil.type = "button";
    boutonOeil.className = "famille-pw-oeil";
    boutonOeil.setAttribute("aria-label", "Afficher le mot de passe");
    boutonOeil.innerHTML = ICONES.oeil;
    boutonOeil.addEventListener("click", function(){
      var revele = input.type === "text";
      input.type = revele ? "password" : "text";
      boutonOeil.innerHTML = revele ? ICONES.oeil : ICONES.oeilBarre;
      boutonOeil.setAttribute("aria-label", revele ? "Afficher le mot de passe" : "Masquer le mot de passe");
      boutonOeil.classList.toggle("actif", !revele);
      input.focus();
    });
    champ.appendChild(boutonOeil);
    boite.appendChild(champ);

    var erreur = el("p", "famille-pw-erreur");
    erreur.hidden = true;
    boite.appendChild(erreur);

    var actions = el("div", "famille-pw-actions");
    var boutonValider = document.createElement("button");
    boutonValider.type = "button";
    boutonValider.className = "famille-pw-valider";
    boutonValider.textContent = "Se connecter";
    actions.appendChild(boutonValider);
    boite.appendChild(actions);

    function fermer(){
      input.value = "";
      document.removeEventListener("keydown", surTouche);
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if(declencheur) declencheur.focus();
    }
    function valider(){
      var email = inputEmail.value.trim();
      var motDePasse = input.value;
      if(!email || !motDePasse){
        erreur.textContent = "E-mail et mot de passe sont requis.";
        erreur.hidden = false;
        return;
      }
      boutonValider.disabled = true;
      supabaseClient.auth.signInWithPassword({ email: email, password: motDePasse })
        .then(function(res){
          if(res.error){
            boutonValider.disabled = false;
            erreur.textContent = res.error.message || "Connexion impossible.";
            erreur.hidden = false;
            input.value = "";
            input.focus();
            return;
          }
          fermer();
          location.reload();
        });
    }
    function surTouche(ev){
      if(ev.key === "Escape") fermer();
    }
    boutonFermer.addEventListener("click", fermer);
    boutonValider.addEventListener("click", valider);
    input.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); valider(); }
    });
    inputEmail.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); input.focus(); }
    });
    overlay.addEventListener("click", function(ev){
      if(ev.target === overlay) fermer();
    });
    document.addEventListener("keydown", surTouche);

    document.body.appendChild(overlay);
    inputEmail.focus();
  }
  /* --- point d'entrée / sortie du mode famille : bouton verrou posé sur
     l'illustration d'accueil (voir construireHeroAccueil). Un appui en
